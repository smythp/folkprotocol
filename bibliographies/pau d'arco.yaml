# Regulatory Monographs and Pharmacopoeia
regulatory_documents:
  - authority: "World Health Organization (WHO)"
    status: "No WHO monograph identified for pau d'arco / Handroanthus impetiginosus / Tabebuia
             impetiginosa as of 2026-02-27"
    note: >
      WHO Monographs on Selected Medicinal Plants (Volumes 1–4, 1999–2009) do not include
      pau d'arco. The herb's widespread traditional use and commercial prominence have not been
      accompanied by a formal WHO assessment.

  - authority: "German Commission E"
    status: "No Commission E monograph (positive or negative) for pau d'arco identified"
    note: >
      Pau d'arco is not listed in Blumenthal M et al. 'The Complete German Commission E Monographs:
      Therapeutic Guide to Herbal Medicines' (1998). The herb was not reviewed by Commission E.
      Absence does not constitute a negative assessment.

  - authority: "European Medicines Agency (EMA) / HMPC"
    status: "No EMA/HMPC assessment report or monograph for Handroanthus impetiginosus identified"
    note: >
      The EMA Herbal Medicines Committee has not published a community monograph or assessment
      report for pau d'arco as of 2026-02-27.

  - authority: "European Scientific Cooperative on Phytotherapy (ESCOP)"
    status: "No ESCOP monograph identified for pau d'arco / Tabebuia impetiginosa"
    note: "ESCOP monographs cover other species but pau d'arco is absent as of 2026-02-27."

  - authority: "American Herbal Pharmacopoeia (AHP)"
    status: "No AHP analytical monograph identified for pau d'arco as of 2026-02-27"
    note: >
      The AHP has published monographs for numerous botanicals (including related species) but
      does not appear to have a published pau d'arco monograph. Check AHP catalog for current status.

  - authority: "USP (United States Pharmacopeia)"
    status: "No USP monograph identified for pau d'arco as of 2026-02-27"

# Dosing and Standardization
dosing_information:
  traditional_dosing:
    primary_sources: >
      No regulatory-body-validated dosing standard exists. Dosing data derived from
      traditional use patterns and the single published clinical trial.
    preparations:
      - preparation: "Bark decoction (inner bark, traditional South American)"
        dose_range: "2–4 g dried bark per cup"
        frequency: "One to three cups daily"
        notes: "Traditional preparation; likely low naphthoquinone bioavailability due to heat and aqueous extraction"
      - preparation: "Standardized encapsulated extract"
        dose_range: "1050 mg/day (from McClure et al. 2022 dysmenorrhea trial)"
        frequency: "Divided doses daily for 8 weeks"
        notes: "Only human trial dose; preparation was standardized but lapachol/beta-lapachone content
                not reported"
      - preparation: "Commercial tincture or tea (pau d'arco bark)"
        notes: "No validated dosing standard; lapachol content of commercial products highly variable
                (Gómez Castellanos 2009)"
  standardization:
    marker_compounds:
      - name: "Lapachol (2-hydroxy-3-(3-methyl-2-butenyl)-1,4-naphthoquinone)"
        role: "Primary naphthoquinone; historical antitumor interest; anticoagulant risk at high doses"
        notes: "No standardization benchmarks established for commercial botanical preparations"
      - name: "Beta-lapachone"
        role: "Primary anti-tumor naphthoquinone; NQO1 bioactivatable; Phase I/II drug (ARQ 501/761)"
        notes: "Developed as isolated synthetic drug; content in botanical preparations not standardized"
    quality_concerns:
      - "Commercial products show high inter-product variability in naphthoquinone content
         (Gómez Castellanos 2009)"
      - "Species identity often mislabeled (T. impetiginosa, T. avellanedae, H. impetiginosus used
         interchangeably in commerce)"
      - "Lapachol is poorly water-soluble; traditional aqueous decoctions likely deliver very low
         naphthoquinone doses compared to ethanol extracts or encapsulated preparations"
      - "Commercial dietary supplement forms (pills, syrups) show dramatically reduced bioactivity
         vs methanolic extracts in vitro (Pires et al. 2015)"

# Key Research Gaps
research_needs:
  - "RCTs for primary traditional indications (dysmenorrhea, antimicrobial, antifungal, anticancer) absent"
  - "Human pharmacokinetic studies for whole-bark extract and constituent bioavailability do not exist"
  - "Dose-finding studies for the whole-herb preparation in humans absent"
  - "Standardized extract definition (marker compound and % content) not established"
  - "Long-term safety studies in humans absent"
  - "Human genotoxicity data absent (animal data shows concern at ≥300 mg/kg in rats)"
  - "Drug interaction studies with anticoagulants in humans absent; mechanism known but clinical
     magnitude at botanical doses unquantified"
  - "Lapachol anticoagulant risk at whole-bark decoction doses uncharacterized in humans"
  - "Definitive species/chemotype identification and standardization for commercial products needed"

# Summary Points
summary:
  clinical_evidence:
    - "Single safety/tolerability pilot study (n=12, McClure 2022): 1050 mg/day T. avellanedae for
       dysmenorrhea was generally safe; no serious AEs; significant pain reduction (no control group)"
    - "Single Phase II uncontrolled study (n=40, Giacomelli 2015): lapacho-based Orasol Plus associated
       with reduced oral mucositis severity in head/neck cancer radiotherapy (not interpretable without
       control arm)"
    - "Lapachol (isolated constituent) failed NCI Phase I (Block 1974, Sieber 1976): anticoagulant toxicity
       prevented attainment of therapeutic concentrations; IND closed by NCI 1970"
    - "Synthetic beta-lapachone analogues (ARQ 501, ARQ 761) reached Phase I/II as cancer drugs; ARQ 761
       MTD 390 mg/m2 IV; dose-limiting toxicity anemia; Grade 3 hypoxia 26%; modest single-agent activity"
    - "No RCTs of any pau d'arco preparation for any indication published as of 2026-02-27"

  mechanism_of_action:
    - "Lapachol: inhibits vitamin K epoxide reductase (anticoagulant mechanism analogous to warfarin);
       antitumor activity via pyruvate kinase M2 inhibition; active against Walker 256 tumor in preclinical"
    - "Beta-lapachone: NQO1-bioactivatable; induces tumor-selective programmed necrosis via NQO1-dependent
       futile redox cycling; also inhibits topoisomerase I/II"
    - "Aqueous extract: IL-2-independent immunosuppression of T-lymphocytes (Böhler 2008); mechanism
       not attributable to beta-lapachone; unknown polar constituent responsible"
    - "Anti-inflammatory: suppresses NF-κB and AP-1 pathways; inhibits COX-2, iNOS, Syk, Src kinase;
       reduces IL-6, TNF-alpha, IL-1beta in human primary lymphocytes (Ryan 2021)"

  pharmacokinetics:
    - "No human PK data for whole-bark extract or its primary constituents in botanical context"
    - "Lapachol: poor water solubility limits bioavailability from aqueous decoctions; therapeutic plasma
       concentrations caused unacceptable toxicity in NCI Phase I"
    - "Beta-lapachone (synthetic ARQ 501/761): IV administration only in clinical trials; MTD 390 mg/m2 q2wks"
    - "Commercial supplement forms (pills, syrup) show dramatically lower in vitro bioactivity than
       laboratory methanol extracts (Pires 2015); human bioavailability data absent"

  safety:
    - "No serious adverse events in the single small human pilot study at 1050 mg/day (n=9, 8 weeks)"
    - "Lapachol: anticoagulant (vitamin K antagonism) is key safety concern at high doses; whole-bark tea
       may partially compensate via pro-vitamin K constituents (MSKCC/Gómez Castellanos)"
    - "Genotoxicity in rats at ≥300 mg/kg (Lemos 2012); 100 mg/kg was safe; no human genotoxicity data"
    - "Beta-lapachone class: anemia (79%), hypoxia (33%), fatigue (45%) at therapeutic IV doses (ARQ 761
       Phase I); not directly applicable to botanical at traditional doses"
    - "Drug interactions: pau d'arco may increase bleeding risk with anticoagulant/antiplatelet drugs;
       clinical magnitude at botanical doses uncharacterized"
    - "Contraindicated in pregnancy (fetotoxic in animal studies) and with warfarin/anticoagulant therapy"
    - "Hemolytic anemia: reported as limiting toxicity in animal studies; not observed in single human pilot"

