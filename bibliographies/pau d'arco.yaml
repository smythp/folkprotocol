      journal: "Cancer Research"
      year: 1968
      volume: "28"
      issue: "10"
      pages: "1952–1954"
      pmid: null
      doi: null
      url: "https://aacrjournals.org/cancerres/article/28/10/1952/476790/"
      note: "Not indexed on PubMed; accessible via AACR journals."
    study_details:
      study_type: "Preclinical pharmacological characterization"
      key_findings:
        - "Active principle isolated from Stereospermum suaveolens shown to be identical to lapachol
           (2-hydroxy-3-(3-methyl-2-butenyl)-1,4-naphthoquinone)"
        - "Lapachol showed reproducible activity against Walker 256 intramuscular tumor system (>90% confidence)"
