---
herb: Fennel (Foeniculum vulgare Mill.)
last_updated: 2026-02-28

# Official Monographs and Pharmacopoeia
official_monographs:
  - source: European Medicines Agency (EMA) / HMPC
    type: European Union Herbal Monograph
    title: "Foeniculi dulcis fructus (Sweet Fennel Fruit)"
    url: https://www.ema.europa.eu/en/medicines/herbal/foeniculi-dulcis-fructus
    originally_adopted: 2007
    revision_1_adopted: "2024-03-01"
    indications:
      - "Symptomatic treatment of mild, spasmodic gastro-intestinal complaints including bloating and flatulence (traditional use)"
      - "Symptomatic treatment of minor spasm (cramps) associated with menstrual periods (traditional use)"
      - "Expectorant in cough associated with colds (traditional use)"
    dosing_adults:
      formulation: "Tea infusion: 1.5 g crushed fennel fruits in 250 mL hot water, steep 15 min"
      frequency: "3 times daily (approx. 4.5 g/day)"
      max_duration: "2 weeks"
    dosing_children:
      age_range: "4-12 years"
      formulation: "Same infusion preparation"
      frequency: "3 times daily (approx. 3 g/day)"
      max_duration: "1 week (mild, transitory symptoms only)"
      note: "Not recommended under age 4 due to insufficient safety data"
    contraindications:
      - "Hypersensitivity to fennel or other Apiaceae/Umbelliferae family plants"
      - "Allergy to anethole"
      - "Pregnancy and breastfeeding (general precaution; not tested)"
    adverse_effects: "Most commonly allergic reactions affecting skin or respiratory system; frequency undetermined"
    estragole_limits:
      adults: "Daily estragole intake limited to 1.0 mg"
      children_4_12: "Daily estragole intake limited to 1.0 µg/kg body weight"
    evidence_basis: "Traditional use (≥30 years documented, ≥15 years in EU)"

  - source: German Commission E
    type: Monograph
    title: "Foeniculi fructus (Bitter Fennel Fruit and Sweet Fennel Fruit)"
    indications:
      - "Dyspeptic complaints (minor gastrointestinal spasms, repletion, flatulence)"
      - "Catarrh of the upper respiratory tract"
      - "Bitter fennel only: mild cramp-like gastrointestinal complaints; menstrual cramp relief"
    dosing_adults:
      daily_dose: "5-7 g crushed fruits as infusion or equivalent preparation"
      frequency: "3-4 times daily"
      max_duration: "2 weeks"
    pharmacological_action: "Promotes GI motility; at higher concentrations acts as antispasmodic"
    notes: "Bitter fennel oil monograph later withdrawn due to estragole safety concerns"

  - source: World Health Organization (WHO)
    type: Monograph
    title: "Fructus Foeniculi"
    publication: "WHO Monographs on Selected Medicinal Plants, Volume 3"
    year: 2007
    publisher: "World Health Organization, Geneva"
    url: https://iris.who.int/bitstream/handle/10665/42052/9789241547024_eng.pdf
    content_notes: "Provides botanical description, pharmacopoeial specifications, chemical composition, traditional and clinical uses, pharmacology, safety data"
    pharmacopoeial_specifications:
      bitter_fennel_volatile_oil: "≥4% (v/m)"
      sweet_fennel_volatile_oil: "≥2% (v/m)"

  - source: European Pharmacopoeia
    type: Quality Standards
    monographs:
      - "Foeniculi amari fructus (Bitter fennel fruit)"
      - "Foeniculi dulcis fructus (Sweet fennel fruit)"
      - "Foeniculi amari aetheroleum (Bitter-fennel fruit oil)"

  - source: ESCOP
    type: Scientific Monograph
    title: "Foeniculi fructus (Fennel Fruit)"
    url: https://www.escop.com/downloads/foeniculi-fructus-fennel-fruit/
    content_notes: "Covers clinical pharmacology, therapeutic indications, dosage, contraindications, adverse effects, drug interactions"

