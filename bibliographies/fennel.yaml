# Safety Profile Summary
safety_profile:
  general_safety: "FDA GRAS status for food use; EMA traditional herbal medicine classification; long safety record in food and traditional medicine"

  adverse_effects:
    allergic:
      - "Skin reactions (contact dermatitis, rash)"
      - "Respiratory allergic reactions"
      - "Cross-reactivity with Apiaceae family (carrots, celery, parsley, dill, anise)"
      severity: "Usually mild; rare anaphylaxis possible in sensitized individuals"
    gi:
      - "Mild increase in menstrual flow (3.11% in one RCT at 2% essence dose)"
    hepatic:
      - "Elevated liver enzymes reported in one case with high-dose herbal tea combination"
      - "Hepatomegaly case reported with galactagogue use"
    sensory:
      - "Strong odor leading to compliance issues (16.6% withdrawal in one RCT)"

  estragole_safety:
    classification: "Possible genotoxic carcinogen (isolated compound; animal data)"
    context: "Risk substantially mitigated in whole plant matrix by protective phenolic co-constituents"
    ema_guidance: "Exposure should be kept as low as practically achievable; short-term use per monograph is low priority for risk management in adults"
    children: "Priority for risk management; MOE <10,000 at typical doses"
    acceptable_intake_ema:
      adults: "≤1.0 mg/day"
      children_4_12: "≤1.0 µg/kg body weight/day"

  contraindications:
    - "Allergy to fennel, anethole, or Apiaceae/Umbelliferae family"
    - "Children under 4 years (insufficient safety data)"
    - "Pregnancy and breastfeeding: use with caution; avoid prolonged or high-dose use"

  drug_interactions:
    cyp3a4: "Fennel inhibits CYP3A4; may alter pharmacokinetics of drugs metabolized by this enzyme"
    note: "No specific interaction studies in humans identified in literature review"

  pregnancy_lactation:
    lactmed_summary: "Two small studies show some galactagogue benefit; no prolactin increase demonstrated; anethole excreted in milk"
    precaution: "EMA monograph contraindicates use in pregnancy/breastfeeding as general precaution pending safety data"

  clinical_trial_safety_overall:
    serious_adverse_events: "None reported in any identified RCT"
    discontinuation_due_to_aes: "Low rates; primarily odor-related compliance in dysmenorrhea trials"
    children_rct: "No adverse events reported in infantile colic RCT (Alexandrovich 2003)"

# Pharmacokinetics and Bioavailability
pharmacokinetics:
  trans_anethole:
    population_intake_estimate: "Average 1.15 mg/day from supplements among Finnish users (Uusitalo et al. 2016)"
    mechanism: "Chemically similar to dopamine; acts as phytoestrogen; relaxes intestinal smooth muscle via anethole-dependent mechanism"
    cyp_interaction: "Inhibits CYP3A4; may affect co-administered drugs"
    breast_milk: "Excreted in breastmilk"
  estragole:
    anitpollution_in_natural_matrix: "Substantially detoxified by co-occurring fennel phenolics (nevadensin, epigallocatechin)"
    bioavailability_note: "Extraction into tea infusion is 3-fold lower from whole fruits vs. finely cut material"
  general_notes:
    - "No dedicated human ADME (absorption, distribution, metabolism, excretion) pharmacokinetic studies identified"
    - "Further human pharmacokinetic research recommended for standardized extracts"

# Notes and Caveats
notes:
  - "Two species/varieties are most clinically studied: bitter fennel (var. vulgare, higher fenchone) and sweet fennel (var. dulce, lower fenchone, milder taste)"
  - "Standardization to 30% fennel extract (~21-27 mg anethole per 100 mg capsule) most common in menopausal and hormonal RCTs"
  - "Soft capsule dose of 30 mg every 4 hours most studied for dysmenorrhea"
  - "Infantile colic RCT (Alexandrovich 2003): NNT=2 is clinically impressive but specific formulation concentration not published"
  - "IBS trial (Portincasa 2016) used a combination with curcumin — cannot isolate fennel-specific effect"
  - "Menopausal RCTs show mixed results; high placebo response rates confound interpretation"
  - "Vaginal atrophy RCT (Ghazanfarpour 2017) showed no benefit for oral fennel extract"
  - "Topical 2% fennel extract cream showed 18.3% hair diameter reduction in hirsutism trial"
  - "Estragole content varies widely by preparation method; whole fruit infusions are safer than finely powdered preparations"
  - "EMA guidance limits continuous use to 2 weeks in adults, 1 week in children (ages 4-12)"
  - "Children under 4 years: EMA advises against use pending safety data (despite traditional colic use)"
  - "Cross-allergenicity with Apiaceae family (celery, carrots, parsley) clinically relevant for atopic patients"
  - "Commission E and EMA/HMPC both recognize GI antispasmodic and expectorant indications via traditional use classification"
  - "WHO Volume 3 monograph (2007) provides pharmacopoeial standards and comprehensive traditional use documentation"
  - "No serious adverse events identified in any clinical RCT; overall safety profile is favorable for short-term adult use"
