    category: "Spice, natural seasoning or flavoring, and plant extract used as flavor in foods"

# Chemical Constituents and Standardization
chemical_profile:
  plant_part: "Dry fruits (cremocarps/mericarps)"
  varieties:
    - name: "Bitter fennel (var. vulgare)"
      key_components:
        - "trans-Anethole: 60-75% of volatile oil"
        - "Fenchone: 15-22% of volatile oil"
        - "Estragole (methyl chavicol): 3-5%"
        - "Limonene: 1-5%"
    - name: "Sweet fennel (var. dulce)"
      key_components:
        - "trans-Anethole: 80-90% of volatile oil"
        - "Fenchone: <1%"
        - "Estragole: 4-7%"
        - "Limonene: 1-5%"
  volatile_oil_content:
    bitter_fennel: "≥4 mL/100 g (European Pharmacopoeia)"
    sweet_fennel: "≥2 mL/100 g (European Pharmacopoeia)"
  trans_anethole_range: "15.23-90.11% across cultivars (Rafieian et al. 2024)"
  estragole_range: "4.00-63.72% across cultivars"
  fenchone_range: "0.03-12.62%"
  flavonoids:
    - "Quercetin"
    - "Kaempferol"
    - "Rutin"
    - "Eriocitrin"
  phenolic_acids:
    - "Rosmarinic acid"
    - "p-Coumaric acid"
    - "Chlorogenic acid"
  standardization_markers:
    trans_anethole: "Primary active constituent; standardization target in clinical preparations"
    typical_range_in_capsules: "21-27 mg anethole per 100 mg extract (30% standardized extract)"

# Systematic Reviews and Meta-Analyses
systematic_reviews:
  - title: "Fennel (Foeniculum vulgare Miller) for the management of menopausal women's health: A systematic review and meta-analysis"
    authors:
      - Hye Won Lee
      - Lin Ang
      - Eunseop Kim
      - Myeong Soo Lee
    year: 2021
    journal: Complement Ther Clin Pract
    volume: 43
    pages: "101360"
    pmid: 33725577
    pubmed_url: https://pubmed.ncbi.nlm.nih.gov/33725577/
    study_type: Systematic review and meta-analysis
    rcts_included: 7
    meta_analysis_rcts: 2
    meta_analysis_sample_size: 145 participants
    key_findings:
      menopausal_symptoms:
        result: "Fennel significantly improved menopausal symptoms vs. placebo"
        statistic: "SMD -1.32 (95% CI: -1.76 to -0.87, p < 0.00001)"
      other_outcomes:
        - "Unclear benefits for sexual function, quality of life, and psychological health"
    safety: "No serious adverse events reported"
    conclusion: "Fennel shows promise for menopausal symptom management; evidence quality was limited"

  - title: "Fennel for Reducing Pain in Primary Dysmenorrhea: A Systematic Review and Meta-Analysis of Randomized Controlled Trials"
    authors:
      - Hye Won Lee
      - Lin Ang
      - Myeong Soo Lee
      - Zainab Alimoradi
      - Eunseop Kim
    year: 2020
    journal: Nutrients
    volume: 12
    issue: 11
    pages: "3438"
    pmid: 33182553
    pubmed_url: https://pubmed.ncbi.nlm.nih.gov/33182553/
    study_type: Systematic review and meta-analysis
    trials_included: 12
    sample_sizes:
      fennel_vs_drugs: 502 participants
      fennel_vs_placebo: 468 participants
    key_findings:
      vs_placebo:
        result: "Fennel significantly superior to placebo"
        statistic: "SMD -3.27 (95% CI: -5.28 to -1.26, p=0.001)"
      vs_conventional_drugs:
        result: "Fennel equivalent to conventional medications"
        statistic: "SMD 0.07 (95% CI: -0.08 to 0.21) — non-significant difference"
    safety: "3 studies assessed adverse events; 1 reported minor adverse effects only"
    limitations: "Potential publication bias due to predominantly small studies"
    conclusion: "Fennel is as effective as conventional drug therapies in alleviating dysmenorrhea pain"

  - title: "Effect of fennel on primary dysmenorrhea: a systematic review and meta-analysis"
    authors:
      - Hadis Shahrahmani
      - Masumeh Ghazanfarpour
      - Nasim Shahrahmani
      - Fatemeh Abdi
      - Robert D E Sewell
      - Mahmoud Rafieian-Kopaei
    year: 2021
    journal: Journal of Complementary and Integrative Medicine
    volume: 18
    issue: 2
    pages: "261-269"
    pmid: 34187122
    pubmed_url: https://pubmed.ncbi.nlm.nih.gov/34187122/
    study_type: Systematic review and meta-analysis
    trials_included: 12
    key_findings:
      vs_placebo:
        result: "Fennel significantly reduced dysmenorrhea intensity"
        statistic: "SMD -0.632 (95% CI: -0.827 to -0.436, p<0.001)"
      vs_mefenamic_acid:
        result: "No significant difference between fennel and mefenamic acid"
        statistic: "SMD -0.214 (95% CI: -0.446 to 0.017, p=0.07)"
    conclusion: "Fennel alleviates dysmenorrhea comparable to NSAIDs; recommended for women preferring herbal medicine"

  - title: "The effects of fennel on menstrual bleeding: A systematic review and meta-analysis"
    authors:
      - Nafiseh Ghassab Abdollahi
      - Mojgan Mirghafourvand
      - Sanaz Mollazadeh
    year: 2018
    journal: Journal of Complementary and Integrative Medicine
    volume: 15
    issue: 3
    pmid: 29500924
    pubmed_url: https://pubmed.ncbi.nlm.nih.gov/29500924/
    study_type: Systematic review and meta-analysis
    key_findings:
      menstrual_bleeding: "Fennel significantly increased bleeding in first cycle (P=0.001); no significant effect in second cycle (P=0.67)"
    conclusion: "Mixed evidence; fennel's effect on menstrual blood volume is cycle-dependent"

# Randomized Controlled Trials — Primary Dysmenorrhea
rct_dysmenorrhea:
  - title: "Comparison of fennel and mefenamic acid for the treatment of primary dysmenorrhea"
    authors:
      - B Namavar Jahromi
      - A Tartifizadeh
      - S Khabnadideh
    year: 2003
    journal: International Journal of Gynecology & Obstetrics
    volume: 80
    issue: 2
    pages: "153-157"
    pmid: 12566188
    pubmed_url: https://pubmed.ncbi.nlm.nih.gov/12566188/
    study_type: Randomized controlled trial (crossover)
    sample_size: 30 women (ages 15-24) with moderate-to-severe dysmenorrhea
    interventions:
      fennel: "2% fennel essence, 25 drops every 4 hours orally"
      mefenamic_acid: "250 mg every 6 hours orally"
      control: "No medication"
    key_findings:
      both_vs_control: "Both treatments significantly reduced pain vs. control cycle (P<0.001)"
      mean_time_to_action: "~67-75 minutes for both treatments"
      mefenamic_advantage: "Mefenamic acid more potent than fennel on 2nd and 3rd menstrual days (P<0.05); no significant difference on other days"
    safety:
      fennel: "16.6% withdrew due to odor; 3.11% reported mild increase in menstrual flow"
      mefenamic_acid: "No complications"

  - title: "Effect of fennel on pain intensity in dysmenorrhoea: A placebo-controlled trial"
