      - Zahra Ghodsi
      - Maryam Asltoghiri
    year: 2014
    journal: Journal of Pediatric and Adolescent Gynecology
    volume: 27
    issue: 5
    pages: "283-286"
    pmid: 25085020
    pubmed_url: https://pubmed.ncbi.nlm.nih.gov/25085020/
    study_type: Randomized controlled trial
    sample_size: 80 female students (40 intervention, 40 control)
    dosing:
      amount: "30 mg fennel soft capsule"
      frequency: "Every 4 hours"
      timing: "Beginning 3 days before menstruation through 5th day"
      duration: "3 months"
    key_findings:
      nausea: "Fennel group: 1.93 vs control: 2.37 at 3 months"
      weakness: "Fennel group: 2.88 vs control: 6.65 at 3 months"
      menstrual_duration: "Significantly reduced after 2 and 3 months"
      stress_wellbeing: "Significant improvements at 1 and 3 months"
    safety: "No adverse events reported; authors emphasized safety of preparation"

