# Bioavailability Studies
bioavailability:
  - citation:
      authors: "Pietrzyk N, Zakłos-Szyda M, Redzynia M, Podsędek A"
      title: "The Effect of Simulated In Vitro Digestion on Biological Activity of Viburnum opulus Fruit Juices"
      journal: "Molecules"
      year: 2021
      volume: "26"
      issue: "13"
      pages: "4086"
      pmid: "34279426"
      pmcid: "PMC8271880"
      doi: "10.3390/molecules26134086"
      url: "https://pubmed.ncbi.nlm.nih.gov/34279426/"
    study_details:
      study_type: "In vitro bioavailability/digestion study"
      methods:
        - "Three-stage simulated GI digestion (mouth, stomach, small intestine)"
        - "UPLC–MS quantification of phenolic changes"
        - "Dialysis membrane separation for bioavailable fractions"
        - "Multiple cell line bioassays (HepG2, L6 myoblasts, MIN6, 3T3-L1 adipocytes)"
      test_materials: "Fresh V. opulus fruit juice (FJ) and phenolic-rich juice (PJ)"
      key_findings:
        bioaccessibility:
          - "Chlorogenic acid decreased ~7-fold (FJ) and ~30-fold (PJ) after digestion"
          - "Total hydroxycinnamic acids decreased 31.65% (FJ) and 87.60% (PJ) post-digestion"
          - "Dialyzed bioavailable hydroxycinnamic acids: 42.28% (FJ) and 10.17% (PJ) of initial content"
          - "Neochlorogenic and cryptochlorogenic acids increased via isomerization during digestion"
        cellular_activity_post_digestion:
          - "Digested purified juice reduced lipid accumulation in HepG2 hepatocytes by 10–15%"
          - "L6 myoblasts: 10–30% enhanced glucose uptake with digested samples"
          - "Both digested samples reduced IL-6 and TNF-α secretion by adipocytes by 40–70%"
          - "Decreased glucose-stimulated insulin secretion by 35–60% (potential pancreatic concern)"
      conclusion: "Phenolic compounds from V. opulus retain meaningful biological activity post-digestion despite significant reduction in total content; juice matrix is protective; potential pancreatic effects warrant caution"
      note: "In vitro only; no human pharmacokinetic data for bark or fruit extracts"

# Regulatory Monographs and Pharmacopoeia
regulatory_documents:
  - authority: "American Herbal Pharmacopoeia (AHP)"
    title: "Cramp Bark, Viburnum Opulus: Analytical, Quality Control, and Therapeutic Monograph"
    editor: "Roy Upton"
    year: 2000
    isbn: "1929425082"
    publisher: "American Herbal Pharmacopoeia"
    location: "Scotts Valley, CA"
    url: "https://herbal-ahp.com/products/cramp-bark"
    pages: 17
    content_type: "Full analytical, quality control, and therapeutic monograph"
    content: >
      Covers nomenclature, history, identification, commercial sources and handling,
      chemical constituents (scopoletin, viopudial, chlorogenic acid, amentoflavone,
      tannins, hydroquinone glycosides), analytical methods, therapeutics, safety
      profile, international status, and references. Primary US quality and
      therapeutic standard for V. opulus.
    status: "Primary quality standard for cramp bark in the United States"
    dosing_from_monograph:
      dried_bark_decoction:
        dose: "2–4 g"
        frequency: "Three times daily"
      tincture_1_to_5_45pct_ethanol:
        dose: "5–10 mL"
        frequency: "Three times daily"
      fluid_extract_1_to_1:
        dose: "2–4 mL"
        frequency: "Three times daily"

  - authority: "British Herbal Pharmacopoeia (BHP)"
    title: "Cramp Bark (Viburnum opulus)"
    year: 1983
    content_type: "Pharmacopoeia monograph"
    content: >
      Includes quality standards, botanical description, constituents, actions and uses
      (antispasmodic, sedative, astringent), indications (dysmenorrhea, threatened
      miscarriage, nervous conditions), dosage. Recognized cramp bark in the British
      herbal medicine tradition.
    status: "Standard reference for UK herbal practice; superseded by BHMA/ESCOP sources"

  - authority: "European Scientific Cooperative on Phytotherapy (ESCOP)"
    status: "No ESCOP monograph identified for Viburnum opulus as of 2026-02-27"
    note: "ESCOP covers related Viburnum species only indirectly via general phytotherapy literature"

  - authority: "German Commission E"
    status: "Commission E did not publish an approved monograph for Viburnum opulus cortex"
    note: >
      Despite widespread use in German naturopathic practice, cramp bark did not receive
      a positive Commission E monograph. Not listed in Blumenthal et al. (1998) 'The Complete
      German Commission E Monographs.' Absence does not imply negative assessment; many herbs
      were simply not reviewed.

  - authority: "World Health Organization (WHO)"
    status: "No WHO monograph identified for Viburnum opulus as of 2026-02-27"
    note: >
      WHO Monographs on Selected Medicinal Plants (Volumes 1–4, 1999–2009) do not include
      V. opulus. The related species V. prunifolium (black haw) also lacks a WHO monograph.

# Dosing and Standardization
dosing_information:
  traditional_dosing:
    primary_source: "American Herbal Pharmacopoeia (AHP) 2000 monograph, Roy Upton ed."
    preparations:
      - preparation: "Dried bark decoction (cortex)"
        dose_range: "2–4 g"
        frequency: "Three times daily"
        notes: "Simmer 10–15 min"
      - preparation: "Tincture (1:5, 45% ethanol)"
        dose_range: "5–10 mL"
        frequency: "Three times daily"
        notes: "Most common commercial preparation; higher doses at acute onset"
      - preparation: "Fluid extract (1:1)"
        dose_range: "2–4 mL"
        frequency: "Three times daily"
      - preparation: "Weiss (German phytotherapy tradition)"
        dose: "4–8 mL tincture (1:5)"
        frequency: "Three to four times daily for dysmenorrhea"
  clinical_trial_dosing:
    - study: "Kızılay et al. 2019 / Gok et al. 2021 (ureteral stones)"
      dose: "1000 mg oral extract"
      frequency: "Three times daily (3000 mg/day total)"
      context: "Only human clinical dosing data; preparation/standardization not specified in either study"
  standardization:
    marker_compounds:
      - name: "Scopoletin (7-hydroxy-6-methoxycoumarin)"
        role: "Primary antispasmodic constituent; coumarin"
        typical_content: "Not standardized in commercial preparations; content varies by plant part and extraction"
      - name: "Chlorogenic acid"
        role: "Antioxidant, anticholinesterase; proposed mechanism for stone expulsion"
        measured_concentration: "0.3227 mg/mL in fruit juice; 0.51–1.71 mg/100mg ethyl acetate/methanol extract"
      - name: "Viopudial"
        role: "Iridoid; hypotensive and smooth muscle antispasmodic"
        notes: "Isolation confirmed 1972; no standardization benchmarks for commercial products"
    notes:
      - "No standardized extract with defined marker compound percentages identified in clinical studies"
      - "Turkish clinical studies used unspecified extract at 1000 mg; no standardization reported"
      - "Bark (cortex) is traditional medicinal part; fruit used in Turkish folk medicine (gilaburu)"
      - "Bark vs fruit have different phytochemical profiles; most traditional use references bark"

# Key Research Gaps
research_needs:
  - "RCTs for primary traditional indication (dysmenorrhea, muscle cramps) are entirely absent"
  - "Human pharmacokinetic studies for whole bark or standardized bark extract not yet conducted"
  - "Standardized extract definition for bark (marker compound, % content) not established"
  - "Dose-finding studies in humans for antispasmodic indications"
  - "Long-term safety data beyond case series and traditional use history"
  - "Mechanistic studies establishing which constituent (scopoletin, viopudial, chlorogenic acid) is primary driver of uterine relaxant activity in humans"
  - "Head-to-head comparison of bark vs fruit extract for relevant indications"
  - "Bioavailability data for scopoletin and viopudial from bark extracts in humans"

# Summary Points
summary:
  clinical_evidence:
    - "Only published human clinical trials are Turkish urology studies on ureteral stone expulsion (2019–2021)"
    - "One RCT (n=86, Gok 2021): V. opulus 3g/day non-inferior to tamsulosin for stone passage; reduced analgesic need and emergency visits"
    - "One retrospective comparative study (n=103, Kızılay 2019): 82% vs 66% stone expulsion rate vs diclofenac alone"
    - "No RCTs for dysmenorrhea, menstrual cramps, or threatened miscarriage—the primary traditional indications"
    - "One registered homeopathic trial (NCT02467543, dysmenorrhea) uses 3X dilution; no peer-reviewed publication"

  mechanism_of_action:
    - "Scopoletin (coumarin): antispasmodic via direct smooth muscle relaxation (Jarboe et al. 1967)"
    - "Viopudial (iridoid): hypotensive and smooth muscle antispasmodic (Nicholson et al. 1972)"
    - "Chlorogenic acid: anticholinesterase activity (93% AChE inhibition at 200 μg/mL); proposed mechanism for smooth muscle relaxation via cholinergic pathway"
    - "Uterine relaxant activity demonstrated in classical animal/in vitro studies (Jarboe et al. 1966)"

  pharmacokinetics:
    - "No human PK studies for bark extract or isolated scopoletin/viopudial from V. opulus identified"
    - "Chlorogenic acid bioavailability: 38.90–56.40% bioavailability index from fruit extract in vitro"
    - "Simulated digestion reduces hydroxycinnamic acids by 31–88% depending on preparation type"
    - "Bioavailable fraction retains meaningful biological activity despite reduction"

  safety:
    - "Traditional use history suggests good tolerability at standard doses; no significant hepatotoxicity signals in literature"
    - "No case reports of hepatotoxicity or serious adverse events identified (contrast with Viburnum lantana)"
    - "Turkish clinical studies (total n=189) reported no serious adverse events at 3g/day"
    - "Contraindicated in pregnancy at high doses historically (antispasmodic effect on uterus)"
    - "No drug interaction data identified in human studies"

