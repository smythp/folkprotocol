    nct_id: "NCT02467543"
    title: "The Efficacy of Viburnum Opulus 3X in the Treatment of Dysmenorrhea"
    url: "https://clinicaltrials.gov/study/NCT02467543"
    study_details:
      condition: "Dysmenorrhea"
      intervention: "Viburnum opulus 3X (homeopathic dilution of bark)"
      design: "Randomized controlled trial"
      notes: >
        This trial uses a homeopathic 3X preparation (1:1000 dilution), not a standardized
        botanical extract. Results and publication status unknown; no peer-reviewed publication
        linked to this NCT as of 2026-02-27. Cannot be used as evidence for extract efficacy.

# Pharmacological and Mechanistic Studies (Key Preclinical)
preclinical_pharmacology:
  - citation:
      authors: "Saltan G, Süntar I, Ozbilgin S, Ilhan M, Demirel MA, Ergene Oz B, Keleş H, Küpeli Akkol E"
      title: "Viburnum opulus L.: A remedy for the treatment of endometriosis demonstrated by rat model of surgically-induced endometriosis"
      journal: "Journal of Ethnopharmacology"
      year: 2016
      volume: "193"
      pages: "450–455"
      pmid: "27647013"
      doi: "10.1016/j.jep.2016.09.029"
      url: "https://pubmed.ncbi.nlm.nih.gov/27647013/"
    study_details:
      study_type: "Animal experimental study"
      animal_model: "Surgically-induced endometriosis in Sprague-Dawley rats"
      design: "15mm endometrial fragment sutured to abdominal wall; extracts administered post-surgery"
      extracts_tested: "n-hexane, ethyl acetate, and methanol extracts of V. opulus fruit"
      dose: "100 mg/kg"
      key_findings:
        - "Ethyl acetate extract: reduced endometrial implant volume to 30.1 mm³ vs control"
        - "Methanol extract: reduced volume to 34.7 mm³"
        - "No adhesion observed in reference drug and ethyl acetate extract groups"
        - "Reduced TNF-α, VEGF, IL-6 cytokine levels vs control"
        - "Chlorogenic acid identified as major compound: 0.51–1.71 mg/100mg extract (HPLC)"
      conclusion: "V. opulus fruit extracts demonstrated therapeutic potential for endometriosis; partially attributed to chlorogenic acid"

  - citation:
      authors: "Ilhan M, Ergene B, Süntar I, Ozbilgin S, Saltan Çitoğlu G, Demirel MA, Keleş H, Altun L, Küpeli Akkol E"
      title: "Preclinical Evaluation of Antiurolithiatic Activity of Viburnum opulus L. on Sodium Oxalate-Induced Urolithiasis Rat Model"
      journal: "Evidence-Based Complementary and Alternative Medicine"
      year: 2014
      volume: "2014"
      pages: "578103"
      pmid: "25165481"
      pmcid: "PMC4137613"
      doi: "10.1155/2014/578103"
      url: "https://pubmed.ncbi.nlm.nih.gov/25165481/"
    study_details:
      study_type: "Animal experimental study (preclinical)"
      animal_model: "Sodium oxalate-induced urolithiasis in rats (70 mg/kg injection)"
      animals_per_group: 6
      intervention: "Lyophilized V. opulus fruit juice extract over 7 days"
      comparator: "Cystone (commercial herbal urinary supplement)"
      key_findings:
        - "Lyophilized juice exerted antiurolithiatic activity via diuretic effect"
        - "Chlorogenic acid concentration: 0.3227 mg/mL in fruit juice (HPLC)"
        - "Reduced urinary crystal formation vs control"
        - "Provided scientific evidence for traditional Turkish folk use in kidney stone passage"

  - citation:
      authors: "Altun ML, Saltan Çitoğlu G, Sever Yilmaz B, Özbek H"
      title: "Antinociceptive and anti-inflammatory activities of Viburnum opulus"
      journal: "Pharmaceutical Biology"
      year: 2009
      volume: "47"
      issue: "7"
      pages: "653–658"
      pmid: null
      doi: "10.1080/13880200902918345"
      url: "https://www.tandfonline.com/doi/full/10.1080/13880200902918345"
      note: "Not indexed on PubMed; DOI-accessible via Taylor & Francis"
    study_details:
      study_type: "Animal experimental study (preclinical)"
      animal_model: "Mice and rats"
      extract: "Water extract of V. opulus leaf"
      doses_tested: "100 mg/kg and 200 mg/kg oral"
      methods:
        - "Tail flick test (analgesic)"
        - "Acetic acid-induced writhing test (antinociceptive)"
        - "Carrageenan-induced paw edema (anti-inflammatory)"
      key_findings:
        - "100 mg/kg: 56.59% inhibition of acetic acid-induced abdominal stretching"
        - "200 mg/kg: 63.21% inhibition of acetic acid-induced abdominal stretching"
        - "Antinociceptive activity comparable to morphine at 90 min, aspirin at 150 min"
        - "No significant anti-inflammatory effect at either dose (carrageenan model)"
      conclusion: "V. opulus leaf water extract has antinociceptive but not anti-inflammatory activity"

