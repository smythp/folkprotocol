herb: Cramp Bark
scientific_name: "Viburnum opulus L."
common_names:
  - "Cramp bark"
  - "Guelder rose"
  - "European cranberry bush"
  - "High bush cranberry"
  - "Gilaburu (Turkish folk medicine)"
  - "Kalina (Eastern European folk medicine)"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-27
notes_on_scope: >
  Viburnum opulus (cramp bark) has significant ethnobotanical use but a thin clinical evidence base.
  No RCTs on the primary indication (dysmenorrhea/muscle cramps) have been published in peer-reviewed
  journals; the only clinical trials involve ureteral stone expulsion (Turkish urology literature,
  2019–2021) and a registered homeopathic trial (NCT02467543). Most mechanistic evidence comes from
  preclinical animal models and in vitro studies. Key active constituents include scopoletin
  (antispasmodic coumarin), viopudial (hypotensive/spasmolytic iridoid), and chlorogenic acid
  (antioxidant, anticholinesterase). The American Herbal Pharmacopoeia published a full monograph
  in 2000 (Roy Upton, ed.). Dosing data from traditional sources only; no human PK studies exist
  for the whole bark extract.

# Comprehensive Reviews
reviews:
  - citation:
      authors: "Kajszczak D, Zakłos-Szyda M, Podsędek A"
      title: "Viburnum opulus L.—A Review of Phytochemistry and Biological Effects"
      journal: "Nutrients"
      year: 2020
      volume: "12"
      issue: "11"
      pages: "3398"
      pmid: "33167421"
      pmcid: "PMC7694363"
      doi: "10.3390/nu12113398"
      url: "https://pubmed.ncbi.nlm.nih.gov/33167421/"
    study_details:
      study_type: "Comprehensive narrative review"
      scope: "Phytochemistry (all plant parts), biological effects in vitro and in vivo, traditional uses"
      key_findings:
        phytochemistry:
          - "Phenolic compounds dominant: total phenolics 325.4–1460 mg/100g fresh weight in fruit"
          - "Chlorogenic acid is major phenolic compound; also neochlorogenic, cryptochlorogenic acids"
          - "Scopoletin (coumarin): primary antispasmodic constituent in bark"
          - "Viopudial (iridoid): hypotensive and smooth muscle antispasmodic constituent"
          - "Additional constituents: carotenoids, vitamin C, anthocyanins (fruit), tannins, volatile oils"
        biological_effects:
          - "Anti-inflammatory, anti-obesity, anti-diabetic, osteogenic, cardioprotective properties (cell-based studies)"
          - "In vivo studies confirmed applicability in urinary tract diseases, endometriosis, and some cancers"
          - "Antimicrobial potential especially against Gram-positive bacteria"
          - "Antioxidant activity demonstrated in both in vitro and in vivo studies"
        clinical_evidence:
          - "No human RCTs for primary traditional indications (cramps, dysmenorrhea) identified"
          - "Turkish clinical studies on ureteral stone expulsion represent only published human data"
      conclusion: "V. opulus has substantial phytochemical richness but clinical evidence lags traditional use; further human studies needed"

# Clinical Trials (Human Studies)
clinical_trials:
  - citation:
      authors: "Gok B, Atik YT, Uysal B, Koc E, Tastemur S, Cimen HI"
      title: "Gilaburu extract (Viburnum opulus Linnaeus) is as effective as Tamsulosin in medical expulsive therapy of distal ureteral calculi"
      journal: "International Journal of Clinical Practice"
      year: 2021
      volume: "75"
      issue: "12"
      pages: "e14950"
      pmid: "34610178"
      doi: "10.1111/ijcp.14950"
      url: "https://pubmed.ncbi.nlm.nih.gov/34610178/"
    study_details:
      study_type: "Randomized Controlled Trial"
      design: "Prospective, parallel-group RCT"
      participants: 86  # n=43 per group
      population: "Adults with distal ureteral stones ≤10mm"
      intervention: "Viburnum opulus extract 1000 mg orally three times daily + diclofenac 50 mg as needed"
      comparator: "Tamsulosin 0.4 mg orally once daily + diclofenac 50 mg as needed"
      duration: "Until stone expulsion or 4-week maximum"
      outcomes:
        primary:
          - "Stone expulsion rate: no significant difference between V. opulus and tamsulosin groups overall"
        secondary:
          - "Additional analgesic requirement: 37.2% (V. opulus) vs 65.1% (tamsulosin), P=.017"
          - "Emergency admission rates: 11.6% (V. opulus) vs 34.8% (tamsulosin), P=.02"
          - "For 5–10mm stones specifically: time to expulsion 7.1±4.2 days (V. opulus) vs 11.8±5.2 days (tamsulosin), P=.005"
      safety: "Described as effective and safe; no serious adverse events reported"
      conclusion: "V. opulus extract can be used effectively and safely for medical expulsive therapy of distal ureteral calculi; non-inferior to tamsulosin"
      notes: "Only published RCT on Viburnum opulus; not for traditional indication (cramps/dysmenorrhea)"

  - citation:
      authors: "Kızılay F, Ülker V, Çelik O, Özdemir T, Çakmak Ö, Can E, Nazlı O"
      title: "The evaluation of the effectiveness of Gilaburu (Viburnum opulus L.) extract in the medical expulsive treatment of distal ureteral stones"
      journal: "Turkish Journal of Urology"
      year: 2019
      volume: "45"
      issue: "Supplement 1"
      pages: "S63–S69"
      pmid: "30978165"
      pmcid: "PMC7595025"
      doi: "10.5152/tud.2019.23463"
      url: "https://pubmed.ncbi.nlm.nih.gov/30978165/"
    study_details:
      study_type: "Retrospective comparative analysis"
      design: "Retrospective cohort, two urology clinics, January 2017–June 2018"
      participants: 103  # treatment n=53, control n=50
      population: "Adults referred with distal ureteral stones <10mm"
      intervention: "V. opulus extract 1000 mg peroral 3×2 daily + diclofenac 50 mg on-demand"
      comparator: "Diclofenac sodium 50 mg on-demand only"
      outcomes:
        primary:
          - "Stone expulsion rate: 82% (V. opulus) vs 66% (control), P=0.026"
          - "Time to expulsion: 9±1.8 days (V. opulus) vs 14±2.3 days (control), P=0.018"
        secondary:
          - "Additional treatment need (URS/ESWL): 9.4% vs 20%, P=0.038"
          - "Analgesic requirement: 24.5% vs 44%, P=0.042"
      conclusion: "V. opulus is an herbal treatment alternative that facilitates passage of ureteral stones <10mm; prospective randomized studies needed"
      limitations:
        - "Retrospective design; no randomization"
        - "Not double-blinded"
        - "Extract preparation and standardization not specified"

