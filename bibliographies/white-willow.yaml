        arhus_index: "~20% improvement in both groups"
        pain_component: "~30% improvement in both groups"
        total_pain_index: "~35% improvement in both groups"
        comparative_efficacy: "No significant difference between willow bark and rofecoxib"
        cost: "Willow bark (Assalix) was approximately 40% less expensive than rofecoxib"

  osteoarthritis:
    - id: schmid2001_oa_rct
      title: "Efficacy and tolerability of a standardized willow bark extract in patients with osteoarthritis: randomized placebo-controlled, double blind clinical trial"
