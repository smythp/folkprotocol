randomized_controlled_trials:
  low_back_pain:
    - id: chrubasik2000_lbp_rct
      title: "Treatment of low back pain exacerbations with willow bark extract: a randomized double-blind study"
      authors:
        - Chrubasik, S
        - Eisenberg, E
        - Balan, E
        - Weinberger, T
        - Luzzati, R
        - Conradt, C
      year: 2000
      journal: "American Journal of Medicine"
      pmid: "10936472"
      pmid_link: "https://pubmed.ncbi.nlm.nih.gov/10936472/"
      study_design: "Randomized, double-blind, placebo-controlled, three-arm trial"
      sample_size:
        enrolled: 210
        completed: 191
        per_group:
          high_dose: 65
          low_dose: 67
          placebo: 59
      intervention:
        high_dose: "240 mg salicin/day (willow bark extract)"
        low_dose: "120 mg salicin/day (willow bark extract)"
        control: "Placebo"
        rescue_medication: "Tramadol only"
        duration: "4 weeks"
      population: "Acute exacerbation of chronic low back pain (VAS ≥5/10)"
      key_results:
        pain_free_at_week_4:
          high_dose: "39% (27/65), p<0.001 vs placebo"
          low_dose: "21% (15/67), p<0.001 vs placebo"
          placebo: "6% (4/59)"
        dose_response: "Dose-dependent effect; high-dose group showed improvements within one week"
        rescue_medication: "Placebo group required significantly more tramadol throughout"
      adverse_effects: "One severe allergic reaction; otherwise well-tolerated"
      notes: "Landmark trial establishing dose-response relationship for low back pain"

    - id: chrubasik2001_lbp_vs_nsaid
