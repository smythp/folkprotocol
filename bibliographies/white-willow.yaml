dosing_summary:
  standardized_extracts:
    salicin_content:
      low_dose: "120 mg salicin/day"
      standard_dose: "240 mg salicin/day"
      evidence_base: "RCT data (Chrubasik 2000, 2001; Schmid 2001; Biegert 2004)"
    duration:
      acute_low_back_pain: "4 weeks (Chrubasik 2000, 2001)"
      osteoarthritis: "2-6 weeks minimum (Schmid 2001; Beer 2008)"
      long_term: "Up to 6 months (Uehleke 2013)"

  traditional_dosing:
    powdered_bark_decoction: "6-12 g/day (WHO monograph)"
    liquid_preparations: "Equivalent to 120-240 mg salicin/day"

  dose_response:
    notes: "Dose-dependent analgesic effect demonstrated — 240 mg salicin significantly more effective than 120 mg (Chrubasik 2000)"

active_compounds:
  primary_salicylates:
    - "Salicin (prodrug; converted to salicylic acid in vivo)"
    - "Salicortin"
    - "Acetyl-salicortin"
    - "Tremulacin"
    - "Salicyl alcohol (saligenin)"
  additional_actives:
    - "Polyphenols (contribute independently to anti-inflammatory effect)"
    - "Flavonoids (contribute independently to anti-inflammatory effect)"
    - "Tannins"
  standardization_marker: "Salicin (primary quality control marker)"

mechanisms_of_action:
  - "Downregulation of TNF-α (Shara & Stohs 2015)"
  - "Inhibition of NF-kB pathway (Shara & Stohs 2015)"
  - "Conversion of salicin → salicylic acid in vivo (Schmid 2001)"
  - "Flavonoid/polyphenol anti-inflammatory activity — broader than aspirin (Vlachojannis 2011)"
  - "Minimal COX inhibition at therapeutic doses (unlike NSAIDs)"
  - "No significant antiplatelet activity at standard doses (Vlachojannis 2011)"

safety_profile:
  contraindications:
    - "Aspirin/salicylate hypersensitivity"
    - "Children (Reye syndrome risk)"
    - "Pregnancy and breastfeeding (salicylates cross placenta, slow neonatal elimination)"
  precautions:
    - "Concurrent use of anticoagulants (additive bleeding risk)"
    - "Concurrent use of other salicylate-containing medicines"
    - "Peptic ulcer disease (caution, though less GI damage than NSAIDs)"
  common_adverse_effects:
    - "Mild gastrointestinal symptoms (most common)"
    - "Isolated allergic reactions in sensitive individuals"
  serious_adverse_effects:
    - "Rare severe allergic reactions (1 case in Chrubasik 2000 trial of 210 patients)"
  advantage_vs_nsaids:
    - "Significantly lower GI damage risk than aspirin or diclofenac"
    - "No significant antiplatelet effect at standard doses"
    - "Equivalent efficacy to rofecoxib at lower cost"

clinical_applications:
  established:
    - condition: "Acute low back pain"
      evidence_level: "Strong (2 positive RCTs, 1 non-inferior to rofecoxib)"
      dosing: "240 mg salicin/day for 4 weeks"
      typical_outcomes: "39% pain-free at 4 weeks (vs 6% placebo) at 240 mg dose"

    - condition: "Chronic rheumatic pain / osteoarthritis"
      evidence_level: "Moderate (mixed RCT results; positive cohort data)"
      dosing: "240 mg salicin/day for 2-6 weeks"
      notes: "Schmid 2001 positive; Biegert 2004 negative for OA; long-term observational data favorable"

  uncertain:
    - condition: "Rheumatoid arthritis"
      evidence_level: "Insufficient (underpowered negative RCT, Biegert 2004 n=26)"
      notes: "No firm conclusions possible from available data"

research_gaps:
  - "No large, adequately-powered RCT for rheumatoid arthritis"
  - "No head-to-head comparison of standardized extract vs placebo for >8 weeks in OA"
  - "No bioavailability studies for enhanced delivery formulations"
  - "No pediatric safety data (and currently contraindicated)"
  - "Limited drug interaction data (particularly with anticoagulants)"
  - "No RCT data for fever or headache indications despite historical use"
  - "Genotoxicity studied in vitro (low concern at therapeutic doses); carcinogenicity and reproductive toxicity not formally assessed"

notes:
  - "Strongest evidence for acute low back pain — dose of 240 mg salicin/day equivalent to rofecoxib at lower cost"
  - "Mechanism involves polyphenols/flavonoids beyond salicin conversion; not simply 'natural aspirin'"
  - "Serum salicylate levels from 240 mg salicin equivalent to only ~87 mg aspirin — insufficient to explain full effect"
  - "EMA HMPC and Commission E have established well-characterized traditional use"
  - "Long-term safety data up to 6 months available from observational study (Uehleke 2013)"
  - "Safety review by USP (2019) identifies important labeling gaps for vulnerable populations"
