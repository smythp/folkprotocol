    pmid_link: "https://pubmed.ncbi.nlm.nih.gov/37895439/"
    study_type: "Meta-analysis of RCTs"
    trials_included: 6
    studies_included: 5
    total_sample_size: 329
    population: "Arthritis patients"
    key_findings:
      pain_relief: "SMD: -0.31 (95% CI: -0.53, -0.08; p=0.007) — significant improvement vs placebo"
      physical_function: "WOMAC improvement SMD: -0.80 (95% CI: -1.08, -0.53) — significant improvement in health status"
      safety: "No significant difference in adverse event risk vs analgesics or placebo (OR: 1.37; 95% CI: 0.79, 2.37; p=0.26)"
