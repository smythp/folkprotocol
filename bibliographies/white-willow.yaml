        womac_pain: "14% reduction from baseline in treatment group vs 2% increase in placebo (p=0.047)"
        patient_assessment: "Superiority of willow bark extract over placebo (p=0.0002)"
        investigator_assessment: "Superiority of willow bark extract over placebo (p=0.0073)"
        conclusion: "Moderate analgesic effect in osteoarthritis; well-tolerated"

    - id: biegert2004_oa_ra
      title: "Efficacy and safety of willow bark extract in the treatment of osteoarthritis and rheumatoid arthritis: results of 2 randomized double-blind controlled trials"
      authors:
        - Biegert, Claudia
        - Wagner, Irmela
        - Lüdtke, Rainer
        - Kötter, Ina
        - Lohmüller, Claudia
        - Günaydin, Ilhan
