---
herb: Marshmallow Root
scientific_name: "Althaea officinalis L."
common_names:
  - "Marshmallow root"
  - "Althaea"
  - "Marsh mallow"
  - "White mallow"
  - "Radix Althaeae"
  - "Althaeae radix"
herb_part: "Root (peeled or unpeeled, dried)"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-27
notes_on_scope: >
  Clinical evidence for marshmallow root is primarily traditional-use-based and classified
  under well-established or traditional use in European regulatory frameworks. The main
  indication supported by clinical evidence is irritative/dry cough and oral/pharyngeal
  mucosal irritation, with a secondary indication for mild GI discomfort. The mechanism of
  action is physical rather than pharmacological: bioadhesive mucilaginous polysaccharides
  (primarily rhamnogalacturonans, arabinogalactans, arabinans, and glucans comprising 5–11.6%
  of the root) coat and protect irritated mucous membranes. Two small RCTs exist for cough/ACE
  inhibitor indications; the most recent RCTs address atopic dermatitis, vulvovaginal candidiasis,
  and pediatric fever. No formal systematic reviews or meta-analyses on marshmallow root were
  identified. Bioavailability data for the polysaccharide fraction is limited: mucilage is
  not absorbed systemically but acts locally; it reaches the colon largely intact where
  partial bacterial degradation occurs.

# Randomized Controlled Trials
clinical_trials:
  - citation:
      authors: "Amini F, Namjooyan F, Zomorodian K, Moein M, Kamalinejad M, Jaladat AM"
      title: "The efficacy of complementary treatment with marshmallow (Althaea officinalis L.) on vulvovaginal candidiasis: A randomized double-blinded controlled clinical trial"
      journal: "Explore (NY)"
      year: 2023
      volume: "19"
      issue: "6"
      pages: "813-819"
      pmid: "37121836"
      doi: "10.1016/j.explore.2023.04.005"
      url: "https://pubmed.ncbi.nlm.nih.gov/37121836/"
    study_details:
      design: "Randomized, double-blind, controlled clinical trial"
      duration: "7 consecutive nights treatment; 30-day follow-up"
      participants: 100  # n=50 per arm; 139 assessed for eligibility, 107 randomized, 100 analyzed
      population: "Women with confirmed vulvovaginal candidiasis (VVC)"
      intervention: "Marshmallow aqueous extract 4% vaginal cream + clotrimazole 1% vaginal cream"
      comparator: "Clotrimazole 1% vaginal cream alone"
      outcomes:
        primary:
          - "Itching: significant decrease in treatment group at 7-day follow-up (p=0.001) and 30-day follow-up (p=0.001)"
          - "Dyspareunia: significant improvement at 7 days (p=0.001) and 30 days (p=0.04)"
          - "Dysuria: significant improvement at 7-day follow-up (p=0.001)"
      safety: "Neither cream caused any significant adverse events"
      notes: "Assessed marshmallow as adjunct to standard antifungal; based on Persian traditional medicine use"

  - citation:
      authors: "Goodarzi H, Valizadeh F, Ghasemi F, Farid M, Alavi NM, Mardani R"
      title: "Comparing the effect of body wash with marshmallow plant and lukewarm water on reducing the temperature of febrile children: a randomized clinical trial"
      journal: "BMC Complementary Medicine and Therapies"
      year: 2022
      volume: "22"
      issue: "1"
      pages: "293"
      pmid: "36369081"
      pmcid: "PMC9652963"
      doi: "10.1186/s12906-022-03762-3"
      url: "https://pubmed.ncbi.nlm.nih.gov/36369081/"
    study_details:
      design: "Parallel-group randomized controlled trial"
      duration: "Single session; temperature monitored at 15-min intervals x 1 hour, then at 4h and 6h"
      participants: 92  # children aged 6 months to 10 years with tympanic temperature >38.3°C
      population: "Febrile children aged 6 months to 10 years"
      intervention: "Body wash with white marshmallow extract + acetaminophen"
      comparator: "Body wash with lukewarm water + acetaminophen"
      outcomes:
        primary:
          - "Time to fever resolution: significantly shorter in marshmallow group (B=8.181, 95% CI 3.778–12.584, p<0.001)"
          - "Frequency of afebrile children: higher in marshmallow group at all time points (p<0.001)"
          - "Mean temperature reduction: −0.27°C greater in marshmallow group (p<0.001 unadjusted; p=0.127 after confounder adjustment)"
        secondary:
          - "Heart rate change: no significant difference after adjustment (p=0.771)"
          - "Fever recurrence timing: no significant difference (p=0.397)"
          - "Need for additional acetaminophen: no significant difference (p=0.397)"
      safety: "No adverse effects reported"
      notes: "Topical/antipyretic use; not the traditional oral mucilage indication. External marshmallow extract application"

  - citation:
      authors: "Naseri V, Chavoshzadeh Z, Mizani A, Naseri M, Babaeian M, Khodadoost M, Ghafari M, Mehrabani M, Tavakoli Ardakani M"
      title: "Effect of topical marshmallow (Althaea officinalis) on atopic dermatitis in children: A pilot double-blind active-controlled clinical trial of an in-silico-analyzed phytomedicine"
      journal: "Phytotherapy Research"
      year: 2021
      volume: "35"
      issue: "3"
      pages: "1389-1398"
      pmid: "33034099"
      doi: "10.1002/ptr.6899"
      url: "https://pubmed.ncbi.nlm.nih.gov/33034099/"
    study_details:
      design: "Pilot double-blind randomized active-controlled clinical trial with in-silico molecular docking analysis"
      duration: "4 weeks (1 week twice daily, then 3 weeks three times weekly)"
      participants: 22  # completed; pilot study
      population: "Children with atopic dermatitis"
      intervention: "Althaea officinalis 1% topical ointment"
      comparator: "Hydrocortisone 1% ointment"
      outcomes:
        primary:
          - "SCORAD index: significantly greater improvement in marshmallow group vs. baseline (p=0.015) and vs. week 1 (p=0.018)"
          - "Marshmallow 1% ointment described as more effective than hydrocortisone 1% in decreasing disease severity"
      safety: "No specific adverse events reported in abstract"
      notes: >
        Pilot study; small sample limits conclusions. In-silico analysis guided preparation.
        Authors recommend further large-scale studies.

  - citation:
      authors: "Khalighi N, Jabbari-Azad F, Barzegar-Amini M, Mojahedi MJ, Saffari M, Aval SB, Majd MH, Rajabian Tabesh M"
      title: "Impact of Althaea Officinalis extract in patients with atopic eczema: a double-blind randomized controlled trial"
      journal: "Clinical Phytoscience"
      year: 2021
      volume: "7"
      pages: "81"
      pmid: null  # Open-access Springer; not indexed on PubMed
      doi: "10.1186/s40816-021-00306-z"
      url: "https://clinphytoscience.springeropen.com/articles/10.1186/s40816-021-00306-z"
    study_details:
      design: "Phase II double-blind randomized controlled trial; split-body design"
      duration: "4 weeks"
      participants: 40  # patients with moderate-to-severe allergic atopic eczema confirmed by skin prick test; enrolled Oct 2018–Jan 2019
      population: "Adults with moderate-to-severe allergic atopic eczema"
      intervention: "Topical Althaea officinalis extract applied to lesions on right side of body"
      comparator: >
        Topical triamcinolone (corticosteroid) on left side; or eucerin (placebo) on right side.
        Split-body design compared herb vs. steroid on different body sides in same patient.
      outcomes:
        primary:
          - "SCORAD assessed at baseline, week 2, week 4"
          - "After 4 weeks: SCORAD decreased on both sides; no significant difference between herb and steroid sides (p=0.716)"
          - "Conclusion: Althaea officinalis decreased SCORAD comparably to topical triamcinolone"
      safety: "No side effects or reactions to either treatment reported"
      notes: >
        Split-body design provides intra-subject comparison but limits blinding validity.
        Herb formulation concentration not specified in abstract.

  - citation:
      authors: "Rouhi H, Ganji F"
      title: "Effect of Althaea Officinalis on Cough Associated with ACE Inhibitors"
      journal: "Pakistan Journal of Nutrition"
      year: 2007
      volume: "6"
      issue: "3"
      pages: "256-258"
      pmid: null  # Not indexed on PubMed; indexed on SciAlert
      doi: "10.3923/pjn.2007.256.258"
      url: "https://scialert.net/abstract/?doi=pjn.2007.256.258"
    study_details:
      institution: "Shahrekord University of Medical Sciences, Iran"
      design: "Double-blind, placebo-controlled randomized clinical trial"
      duration: "4 weeks"
      participants: 60  # hypertensive patients with ACE inhibitor-induced cough
      population: "Hypertensive patients who developed cough during ACE inhibitor therapy"
      intervention: "Althaea officinalis herbal extract, 20 drops every 8 hours (three times daily)"
      comparator: "Placebo drops, identical dosing"
      outcomes:
        primary:
          - "Cough severity (0–4 scale): treatment group improved from 2.66±0.958 to 1.23±1.006 (significant)"
          - "8 patients in treatment group showed almost complete cough abolition"
        secondary:
          - "Spirometry tests: no significant change in either group"
      safety: "Not specified beyond absence of adverse effects mentioned in discussion"
      notes: >
        Earliest identified clinical RCT for marshmallow root. Not indexed in PubMed.
        ACE inhibitor cough mechanism may involve bradykinin/substance P accumulation in airway;
        marshmallow mucilage may provide mechanical barrier reducing mucosal irritation.

# Consumer/User Outcome Studies (Non-RCT Clinical Evidence)
observational_studies:
  - citation:
      authors: "Fink C, Schmidt M, Kraft K"
      title: "Marshmallow Root Extract for the Treatment of Irritative Cough: Two Surveys on Users' View on Effectiveness and Tolerability"
      journal: "Complementary Medicine Research"
      year: 2018
      volume: "25"
      issue: "5"
      pages: "299-305"
      pmid: "30064132"
      doi: "10.1159/000489560"
      url: "https://pubmed.ncbi.nlm.nih.gov/30064132/"
    study_details:
      design: "Two prospective, non-interventional consumer surveys (pharmacy-recruited)"
      duration: "7 days of treatment"
      participants: 822  # consumers purchasing STW42 marshmallow root product at pharmacies
      population: "Adults with dry/irritative cough (including pharyngeal irritation)"
      intervention: "Aqueous marshmallow root extract STW42 as either lozenges or syrup"
      comparator: "None (single-arm observational)"
      outcomes:
        primary:
          - "Both lozenge and syrup preparations rated as having 'good effect' for symptomatic relief of oral/pharyngeal irritation and dry cough"
          - "Onset of symptom relief: in majority of cases within 10 minutes"
          - "Favorable effectiveness ratings in both survey arms"
      safety:
        tolerability: "Very good"
        adverse_events: "Only 3 minor adverse events for the syrup formulation; lozenges had no reported adverse events"
      notes: >
        Observational design; no control group or blinding. Consumer-reported outcomes subject to
        placebo effects and recall bias. STW42 is a standardized aqueous marshmallow root extract
        product. Largest clinical dataset on marshmallow root to date.

# Reviews
reviews:
  - citation:
      authors: "Mahboubi M"
      title: "Marsh Mallow (Althaea officinalis L.) and Its Potency in the Treatment of Cough"
      journal: "Complementary Medicine Research"
      year: 2020
      volume: "27"
      issue: "3"
      pages: "174-183"
      pmid: "31770755"
      doi: "10.1159/000503747"
      url: "https://pubmed.ncbi.nlm.nih.gov/31770755/"
    study_details:
      study_type: "Narrative review"
      scope: "Traditional use, animal studies, clinical studies, and mechanisms for cough treatment"
      key_findings:
        - "Animal and clinical studies confirm efficacy of A. officinalis extracts alone for dry cough"
        - "Combination with Zataria multiflora, Zingiber officinale, or Hedera helix increased efficacy across cough types"
        - "In vivo animal data: marshmallow reduced cough episodes by ~50% vs. codeine which reduced by ~61%"
