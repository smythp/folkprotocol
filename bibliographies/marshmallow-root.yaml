    - preparation: "Fluid extract (1:1)"
      dose: "2–5 mL"
      frequency: "Three times daily"
      source: "Traditional/practitioner reference"

  clinical_trial_doses:
    - study: "Rouhi & Ganji 2007 (ACE inhibitor cough)"
      dose: "20 drops every 8 hours (three times daily) for 4 weeks"
      form: "Liquid herbal extract drops"
      outcome: "Significant cough reduction; 8/30 nearly complete abolition"

    - study: "Amini et al. 2023 (vulvovaginal candidiasis)"
      dose: "4% aqueous extract vaginal cream, nightly for 7 days"
      form: "Topical vaginal cream (adjunct use)"
      outcome: "Significant improvement in itching, dyspareunia, dysuria"

    - study: "Naseri et al. 2021 (atopic dermatitis, children)"
      dose: "1% topical ointment; twice daily x 1 week, then three times weekly x 3 weeks"
      form: "Topical ointment"
      outcome: "SCORAD improvement; may exceed hydrocortisone 1% efficacy"

    - study: "Khalighi et al. 2021 (atopic eczema)"
      dose: "Topical extract (concentration not specified)"
      form: "Topical extract"
      outcome: "SCORAD reduction comparable to topical triamcinolone"

    - study: "Fink et al. 2018 (consumer surveys)"
      dose: "Aqueous extract STW42 (lozenges or syrup)"
      form: "Lozenges or syrup"
      outcome: "Rapid symptom relief within 10 min in majority; very good tolerability"

  standardization:
    quality_marker: "Mucilage content (polysaccharide fraction)"
    pharmacopeial_standard: "Minimum mucilage content specified in Ph. Eur."
    preferred_extraction: >
      Cold maceration in water; hot water extraction degrades high-molecular-weight polysaccharides.
      Alcoholic extraction reduces polysaccharide yield. Standardized aqueous extracts (e.g., STW42)
      used in clinical consumer studies.
    active_fraction: "Polysaccharide mucilage — primarily rhamnogalacturonans (pectic), arabinogalactans, arabinans, glucans"
    other_constituents: >
      Starch (25–35%), pectins (~11%), sucrose (~10%), flavonoids (kaempferol, quercetin, isorhamnetin
      glycosides), phenolic acids (caffeic acid, p-coumaric acid), isoquercitrin, scopoletin (coumarin),
      phytosterols, tannins, amino acids (asparagine)

# Key Research Gaps
research_needs:
  - "No systematic reviews or meta-analyses on marshmallow root clinical evidence identified"
  - "No formal dose-finding or pharmacokinetic studies in humans; mucilage PK by definition local"
  - "No long-term safety studies (>4 weeks) in any indication"
  - "Largest clinical dataset (n=822) is uncontrolled observational; true RCT for respiratory indication needed"
  - "Drug interaction studies needed to quantify mucilage effect on oral drug absorption"
  - "Standardization marker: no universally accepted assay analogous to HPLC for small-molecule herbs"
  - "Bioavailability of minor constituents (flavonoids, phenolics) not characterized in humans"
  - "No head-to-head comparison of different extract types (cold macerate vs. hot extract vs. syrup)"
  - "Mechanism of 5-HT₂ receptor involvement in antitussive effect not confirmed in humans"
  - "More rigorous RCTs needed for atopic dermatitis indication (current trials small, pilot, or split-body)"
  - "Safety data in pregnancy completely absent"
  - "Combination product studies (e.g., with thyme, ivy, licorice) predominate; isolated marshmallow RCTs rare"

# Summary Points
summary:
  clinical_evidence:
    respiratory:
      - "One double-blind RCT (n=60) demonstrates significant reduction in ACE inhibitor-induced dry cough vs. placebo (Rouhi & Ganji 2007)"
      - "Two uncontrolled studies in ~900 children (cited by EMA) showed cough reduction but lacked comparator groups"
      - "Consumer survey (n=822) shows favorable effectiveness and tolerability for STW42 extract (syrup and lozenges); onset within 10 min in most cases"
      - "Narrative review supports antitussive/expectorant activity; ~50% cough reduction in animal models (vs. ~61% for codeine)"
    dermatological:
      - "Pilot RCT in 22 children (n=22): Althaea 1% ointment may outperform hydrocortisone 1% for atopic dermatitis SCORAD (Naseri et al. 2021)"
      - "Phase II RCT in 40 adults: Althaea extract comparable to topical triamcinolone for atopic eczema SCORAD (Khalighi et al. 2021)"
    gynecological:
      - "RCT (n=100): Althaea 4% vaginal cream adjunct to clotrimazole significantly improves VVC symptoms (itching p=0.001, dyspareunia p=0.001) vs. clotrimazole alone (Amini et al. 2023)"
    pediatric_fever:
      - "RCT (n=92 children): marshmallow body wash + acetaminophen reduces fever faster than lukewarm water + acetaminophen (p<0.001); temperature advantage not significant after confounder adjustment (Goodarzi et al. 2022)"
    overall: >
      Clinical evidence base is small and heterogeneous. No systematic reviews identified.
      EMA/HMPC classifies marshmallow root as traditional use, not well-established use, for
      respiratory and GI indications. Most rigorous RCT evidence exists for the ACE inhibitor
      cough indication.

  mechanism:
    - "Primary mechanism is physical/bioadhesive: mucilaginous polysaccharides form protective film over irritated mucosal surfaces"
    - "Polysaccharides internalized into epithelial cells and stimulate cell physiology (in vitro, Deters et al. 2010)"
    - "Antitussive mechanism also involves 5-HT₂ receptor modulation (animal data, Sutovska et al. 2009)"
    - "Anti-inflammatory and antioxidative effects demonstrated in vitro: IL-6 suppression, ROS inhibition, wound closure stimulation (Bonaterra et al. 2022)"
    - "Efficacy may be reduced in established allergic/inflammatory airway disease vs. simple irritative cough (Sutovska et al. 2011)"

  safety:
    - "Excellent safety profile: no serious adverse events in any clinical study"
    - "EMA (2016): no adverse effects reported at time of assessment"
    - "3 minor adverse events across 822 consumer exposures (syrup formulation)"
    - "No hepatotoxicity signals identified"
    - "Main safety concern: mucilage may delay oral drug absorption (theoretical; unquantified)"
    - "Insufficient data for pregnancy; typical food amounts unlikely to harm breastfeeding infants"

  pharmacokinetics:
    - "Mucilaginous polysaccharides not absorbed systemically; act locally via bioadhesion"
    - "Mucilage traverses GI tract largely intact; partial bacterial degradation in colon"
    - "Cold maceration preferred extraction to preserve high-MW polysaccharide integrity"
    - "Minor constituents (flavonoids, phenolics) not characterized for human PK"
    - "No conventional PK parameters (Cmax, Tmax, AUC) applicable to primary active fraction"

  dosing_consensus:
    - "Dried root: 6 g/day (Commission E); cold macerate preparation preferred"
    - "Syrup: 10 g single dose (Commission E)"
    - "Clinical trials used: 20 drops TID (drops formulation, 4 weeks), 4% vaginal cream (7 days), 1% topical ointment (4 weeks)"
    - "Duration for respiratory/throat: reassess after 1 week; GI: reassess after 2 weeks (EMA guidance)"
    - "Separate administration from other oral medications by at least 1–2 hours"

