# Pharmacological Mechanism Studies (Preclinical)
preclinical_mechanism:
  - citation:
      authors: "Sutovska M, Nosalova G, Sutovsky J, Franova S, Prisenznakova L, Capek P"
      title: "Possible mechanisms of dose-dependent cough suppressive effect of Althaea officinalis rhamnogalacturonan in guinea pigs test system"
      journal: "International Journal of Biological Macromolecules"
      year: 2009
      volume: "45"
      issue: "1"
      pages: "27-32"
      pmid: "19447256"
      doi: "10.1016/j.ijbiomac.2009.03.008"
      url: "https://pubmed.ncbi.nlm.nih.gov/19447256/"
    study_details:
      design: "In vivo and in vitro guinea pig experimental study"
      model: "Guinea pig cough reflex; airway smooth muscle reactivity"
      key_findings:
        - "Rhamnogalacturonan demonstrated dose-dependent cough suppression comparable to codeine in vivo"
        - "Airway smooth muscle reactivity largely unaffected (bronchodilation not the mechanism)"
        - "K⁺(ATP) ion channel activation not involved in antitussive mechanism"
        - "Serotonergic 5-HT₂ receptor antagonist pretreatment significantly reduced cough-suppressive efficacy, implicating 5-HT₂ receptor involvement"
      mechanistic_conclusion: "Antitussive mechanism involves 5-HT₂ receptor modulation, not bronchodilation or K⁺(ATP) channels"

  - citation:
      authors: "Sutovska M, Capek P, Franova S, Joskova M, Sutovsky J, Marcinek J, Kalman M"
      title: "Antitussive activity of Althaea officinalis L. polysaccharide rhamnogalacturonan and its changes in guinea pigs with ovalbumine-induced airways inflammation"
      journal: "Bratislavske Lekarske Listy"
      year: 2011
      volume: "112"
      issue: "12"
      pages: "670-675"
      pmid: "22372330"
      doi: null
      url: "https://pubmed.ncbi.nlm.nih.gov/22372330/"
    study_details:
      design: "In vivo guinea pig study with ovalbumin-sensitized allergic airway inflammation model"
      model: "Ovalbumin-induced airways inflammation in guinea pigs"
      key_findings:
        - "Rhamnogalacturonan exhibited dose-dependent antitussive activity in non-inflamed animals"
        - "Codeine at 10 mg/kg showed comparable antitussive activity to higher rhamnogalacturonan doses"
        - "In inflammatory conditions (sensitized animals): polysaccharide shortened duration of antitussive effect"
        - "Airway reactivity not significantly altered in either sensitized or unsensitized groups"
        - "Histological confirmation of allergic airway inflammation in ovalbumin group"
      clinical_implication: >
        Efficacy may be diminished in established allergic airway inflammation vs. simple
        irritative cough; consistent with EMA indication for 'dry, irritative' cough rather
        than productive or allergic cough.

  - citation:
      authors: "Deters A, Zippel J, Hellenbrand N, Pappai D, Possemeyer C, Hensel A"
      title: "Aqueous extracts and polysaccharides from Marshmallow roots (Althea officinalis L.): cellular internalisation and stimulation of cell physiology of human epithelial cells in vitro"
      journal: "Journal of Ethnopharmacology"
      year: 2010
      volume: "127"
      issue: "1"
      pages: "62-69"
      pmid: "19799989"
      doi: "10.1016/j.jep.2009.09.050"
      url: "https://pubmed.ncbi.nlm.nih.gov/19799989/"
    study_details:
      design: "In vitro cell biology study"
      models:
        - "KB epithelial cells"
        - "Primary normal human dermal fibroblasts (pNHF)"
      concentrations_tested: "1 and 10 µg/mL"
      methods:
        - "Cell viability and proliferation assays"
        - "Microarray gene expression analysis"
        - "Laser scanning microscopy (cellular internalization)"
      key_findings:
        - "Aqueous extract (AE) significantly stimulated cell vitality of epithelial cells at tested doses"
        - "Raw polysaccharides (RPS) enhanced epithelial cell vitality without increasing proliferation"
        - "Neither AE nor RPS significantly affected fibroblast physiology (epithelial-cell-specific effect)"
        - "Polysaccharides were internalized into epithelial cells but not fibroblasts"
        - "Microarray: upregulation of genes related to cell adhesion proteins, growth regulators, and extracellular matrix"
      clinical_relevance: >
        Supports mucosal regenerative and protective effects; bioadhesive polysaccharides appear to
        stimulate natural protective physiology of epithelial cells lining the throat and GI tract.

  - citation:
      authors: "Bonaterra GA, Schmitt J, Schneider K, Schwarzbach H, Aziz-Kalbhenn H, Kelber O, Müller J, Kinscherf R"
      title: "Phytohustil® and root extract of Althaea officinalis L. exert anti-inflammatory and anti-oxidative properties and improve the migratory capacity of endothelial cells in vitro"
      journal: "Frontiers in Pharmacology"
      year: 2022
      volume: "13"
      pages: "948248"
      pmid: "36569306"
      doi: "10.3389/fphar.2022.948248"
      url: "https://pubmed.ncbi.nlm.nih.gov/36569306/"
    study_details:
      design: "In vitro laboratory study"
      models:
        - "Human umbilical vein endothelial cells (HUVEC)"
        - "Scratch assay for cell migration"
      interventions_tested:
        - "Phytohustil® cough syrup (commercial marshmallow root product)"
        - "Marshmallow root extract (raw)"
      key_findings:
        - "Both Phytohustil® and marshmallow root extract inhibited LPS-activated IL-6 release (anti-inflammatory)"
        - "Both inhibited H₂O₂-induced cytotoxicity and intracellular ROS production (antioxidative)"
        - "Both significantly stimulated wound closure in scratch assay (improved endothelial migration)"
        - "No cytotoxic effects from either active compounds or excipients on endothelial cells"
      clinical_relevance: "Provides in vitro mechanistic basis for mucosa-protective and anti-inflammatory properties relevant to throat/upper respiratory indication"

# Pharmacokinetics and Bioavailability
pharmacokinetics:
  general_notes: >
    Marshmallow root lacks human pharmacokinetic studies in the conventional sense because its
    primary active fraction — the mucilaginous polysaccharides — acts locally via bioadhesion rather
    than systemic absorption. The mucilage forms a protective physical film on epithelial surfaces,
    is not absorbed through the intestinal wall, traverses the GI tract largely intact, and undergoes
    partial or complete bacterial fermentation in the colon. This local mechanism means standard
    PK parameters (Cmax, Tmax, AUC, half-life) are not applicable to the polysaccharide fraction.
    Minor constituents (flavonoids, phenolic acids, coumarins) may have systemic bioavailability
    but are not the primary therapeutic agents and have not been studied for PK in marshmallow root
    clinical preparations.

  polysaccharide_behavior:
    composition:
      mucilage_content: "5–11.6% of dried root (varies by vegetative period)"
      polysaccharide_types:
        - "Rhamnogalacturonans (main pectic fraction)"
        - "Arabinogalactans"
        - "Arabinans"
        - "Glucans"
      sugar_components: "L-rhamnose, D-galactose, D-galacturonic acid, D-glucuronic acid (molar ratios ~2:3:3:3)"
    absorption: "Not systemically absorbed; acts via mucosal bioadhesion"
    stability_in_GI: "Intact through stomach and small intestine; bacterial fermentation in colon"
    mechanism_of_action: "Physical/bioadhesive: mucin-like protective film covers irritated epithelial tissue"
    solubility: "Water-miscible; cold maceration preferred over hot extraction to preserve polysaccharide integrity"

  key_reference:
    authors: "Deters A, Zippel J, Hellenbrand N, et al."
    pmid: "19799989"
    finding: "Polysaccharide fraction internalized into epithelial cells at 1–10 µg/mL; stimulates cell physiology without systemic absorption"

# Safety
safety:
  overall_assessment: >
    Marshmallow root is considered one of the safest medicinal plants in traditional and modern
    use. The EMA/HMPC found no adverse events reported at the time of their 2016 assessment.
    GRAS (Generally Recognized As Safe) by the U.S. FDA for food amounts. No hepatotoxicity
    signals identified. The primary safety concern is potential pharmacokinetic drug interactions
    due to mucilage coating the GI tract and potentially delaying drug absorption.

  adverse_events:
    clinical_evidence: "No adverse events in RCTs; 3 minor adverse events across 822 consumer survey participants (syrup)"
    ema_assessment: "No adverse effects reported at time of HMPC assessment (2016)"
    allergic_reactions: "Theoretically possible but not documented in literature"
    gastrointestinal: "Not reported; polysaccharide action is mucosal-protective"

  drug_interactions:
    mechanism: "Mucilaginous coating of GI epithelium may delay or reduce absorption of concurrently administered oral medications"
    clinical_significance: "Theoretical; not confirmed in clinical interaction studies"
    practical_recommendation: "Take marshmallow root preparations at least 1–2 hours apart from other oral medications"
    specific_concerns:
      - drug_class: "Lithium"
        concern: "Reduced lithium absorption possible; monitor"
      - drug_class: "Antidiabetic agents"
        concern: "Potential additive hypoglycemic effect via direct activity; blood glucose monitoring advisable"
      - drug_class: "Diuretics/antihypertensives"
        concern: "Theoretical absorption alteration; no clinical documentation"

  pregnancy_and_lactation:
    pregnancy: >
      Insufficient reliable data; absence of safety evidence means standard caution applies.
      Not recommended during pregnancy unless clinically indicated and supervised. No teratogenicity
      studies identified.
    lactation: >
      LactMed (NBK501839): No data on excretion of marshmallow components into breastmilk.
      No data on safety or efficacy in nursing mothers or infants. Food amounts unlikely harmful.
      Used in proprietary galactogogue teas but no valid clinical trials support this use.
      One small manufacturer-sponsored study of Mother's Milk tea (containing multiple herbs
      including marshmallow) showed no differences in infant safety outcomes vs. lemon verbena tea.

  contraindications:
    - "No absolute contraindications established"
    - "Theoretical contraindication during pregnancy (insufficient safety data)"
    - "Caution in patients on multiple oral medications due to absorption effects"

