---
herb: Yarrow
scientific_name: "Achillea millefolium L."
common_names:
  - "Yarrow"
  - "Common yarrow"
  - "Milfoil"
  - "Thousand-leaf"
  - "Gordaldo"
  - "Nosebleed plant"
  - "Old man's pepper"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-28
notes_on_scope: >
  Achillea millefolium (Asteraceae) is one of the most widely distributed and longest-used
  medicinal plants in the Western herbal tradition. The aerial parts (herba) and flowers (flos)
  are both official pharmacopoeial materials in the European Pharmacopoeia. Key bioactives
  include sesquiterpene lactones (achillin, achillicin, achillifolin), flavonoids (apigenin,
  luteolin, rutin, casticin), caffeic acid derivatives (chlorogenic, dicaffeoylquinic acids),
  alkaloids (achilleine), and essential oil components (camphor, 1,8-cineole, alpha-thujone,
  chamazulene, borneol, camphene, limonene). Commission E approved both herba and flos (1990)
  for loss of appetite and dyspeptic ailments; EMA issued community herbal monographs for
  both flos (2011) and herba (traditional use). Human RCTs are available for multiple
  indications (MS, dysmenorrhea, IBS, oral mucositis, T2D, hemorrhoids) though most trials
  are small and many used herbal mixtures or preparations where yarrow contribution is
  not isolable. Contact dermatitis from sesquiterpene lactones (particularly alpha-peroxyachifolid)
  is the primary documented safety concern; thujone content in essential oil requires caution
  at high doses.

# Randomized Controlled Trials (Human)
clinical_trials:
  - citation:
      authors: "Daneshvar-Ghahfarokhi S, Ahmadinia H, Sadeghi T, Basirat E, Mohammadi-Shahrokhi V"
      title: "Achillea millefolium capsule improved liver enzymes and lipid profile compared to placebo in patients with type 2 diabetes: a double-blind randomized clinical trial"
      journal: "BMC Nutrition"
      year: 2025
      volume: "11"
      issue: "1"
      pages: "21"
      pmid: "39856724"
      doi: "10.1186/s40795-025-01005-5"
      url: "https://pubmed.ncbi.nlm.nih.gov/39856724/"
    study_details:
      design: "Double-blind, randomized placebo-controlled clinical trial"
      participants: 60
      population: "Adults with type 2 diabetes mellitus (30 intervention, 30 control)"
      intervention: "A. millefolium capsules 500 mg/day"
      duration: "90 days (3 months)"
      key_outcomes:
        - "ALT decreased from 28.79 to 24.41 (p=0.017) in intervention group vs. no significant change in placebo"
        - "AST decreased from 24.28 to 18.76 (p=0.007) in intervention group"
        - "Triglycerides: 161.7 → 147.3 mg/dL (p=0.045)"
        - "LDL: 98.90 → 80.86 mg/dL (p=0.001)"
        - "Total cholesterol: 168.3 → 150.1 mg/dL (p=0.006)"
        - "HDL changes not significant"
        - "No significant changes in FBS or HbA1c"
      limitations:
        - "Small sample size (n=60)"
        - "Short duration (3 months)"
        - "No standardization data on capsule preparation provided"
        - "Glycemic outcomes unaffected — lipid/hepatic effects may be primary benefit"
      key_finding: "500 mg/day A. millefolium capsules for 90 days significantly improved liver enzymes (ALT, AST) and lipid profile (TG, LDL, total cholesterol) in T2D patients compared to placebo"

  - citation:
      authors: "Ayoobi F, Moghadam-Ahmadi A, Amiri H, Dastgheib SA, Farbood Y, Anbari K, Abbasi-Nik A, Allahtavakoli M, Pourshanazari A, Vakili A, Hassanshahi G"
      title: "Achillea millefolium is beneficial as an add-on therapy in patients with multiple sclerosis: A randomized placebo-controlled clinical trial"
      journal: "Phytomedicine"
      year: 2019
      volume: "52"
      pages: "89-97"
      pmid: "30599916"
      doi: "10.1016/j.phymed.2018.06.017"
      url: "https://pubmed.ncbi.nlm.nih.gov/30599916/"
    study_details:
      design: "Triple-blind, randomized, placebo-controlled, parallel-group trial"
      participants: 75
      population: "Patients with relapsing-remitting multiple sclerosis (MS)"
      groups: "3 groups: placebo, 250 mg/day A. millefolium aqueous extract, 500 mg/day A. millefolium aqueous extract"
      duration: "1 year"
      key_outcomes:
        - "Both active doses significantly decreased annual relapse rate vs. placebo"
        - "500 mg/day group showed significantly reduced lesion volume changes on MRI"
        - "Increased time to first relapse in both active groups"
        - "Improved MSFC (Multiple Sclerosis Functional Composite) z-scores"
        - "EDSS (Expanded Disability Status Scale) scores decreased with treatment"
        - "Cognitive improvements: word-pair learning, PASAT (Paced Auditory Serial Addition Test), WCST (Wisconsin Card Sorting Test)"
        - "No serious adverse events reported"
      limitations:
        - "Add-on therapy design; all patients received standard DMT (disease-modifying therapy)"
        - "Cannot distinguish direct neurological effect from anti-inflammatory/immunomodulatory mechanism"
        - "Aqueous extract composition not fully standardized or characterized"
        - "75 patients over three groups; statistical power limited"
      key_finding: "A. millefolium aqueous extract (250 or 500 mg/day for 1 year) as add-on to standard MS therapy significantly reduced relapse rate, lesion volume (500 mg dose), and improved cognitive function vs. placebo in 75 RRMS patients"

  - citation:
      authors: "Jenabi E, Fereidoony B"
      title: "Effect of Achillea Millefolium on Relief of Primary Dysmenorrhea: A Double-Blind Randomized Clinical Trial"
      journal: "Journal of Pediatric and Adolescent Gynecology"
      year: 2015
      volume: "28"
      issue: "5"
      pages: "402-404"
      pmid: "26238568"
      doi: "10.1016/j.jpag.2014.12.008"
      url: "https://pubmed.ncbi.nlm.nih.gov/26238568/"
    study_details:
      design: "Double-blind, randomized, placebo-controlled clinical trial"
      population: "Female university students with primary dysmenorrhea"
      intervention: "A. millefolium teabag form vs. placebo teabag"
      duration: "3 days per menstrual cycle × 2 menstrual cycles"
      key_outcomes:
        - "Mean change in pain score (VAS) significantly greater in A. millefolium group vs. placebo at 1 month (P=0.001)"
        - "Mean change in pain score significantly greater at 2 months (P<0.0001)"
        - "Progressive benefit observed over two cycles, suggesting cumulative effect"
        - "No adverse events reported"
      limitations:
        - "Sample size not reported in abstract"
        - "Teabag form — dose not standardized or quantified"
        - "Short observation window (2 cycles)"
        - "University student population may limit generalizability"
      key_finding: "A. millefolium teabag for 3 days/cycle over 2 menstrual cycles significantly reduced primary dysmenorrhea pain severity vs. placebo (P=0.001 at cycle 1; P<0.0001 at cycle 2)"

  - citation:
      authors: "Miranzadeh S, Adib-Hajbaghery M, Soleymanpoor L, Ehsani M"
      title: "Effect of adding the herb Achillea millefolium on mouthwash on chemotherapy induced oral mucositis in cancer patients: A double-blind randomized controlled trial"
      journal: "European Journal of Oncology Nursing"
      year: 2015
      volume: "19"
      issue: "3"
      pages: "207-213"
      pmid: "25667123"
      doi: "10.1016/j.ejon.2014.10.019"
      url: "https://pubmed.ncbi.nlm.nih.gov/25667123/"
    study_details:
      design: "Double-blind, randomized controlled trial"
      participants: 56
      population: "Cancer patients with chemotherapy-induced oral mucositis (OM)"
      groups: "2 groups — experimental (routine solution + distilled A. millefolium) vs. control (routine solution alone)"
      intervention: "15 mL of mixture gargled 4 times/day for 14 days"
      key_outcomes:
        - "Experimental group: OM severity score decreased from 2.39 ± 0.875 to 0.32 ± 0.54 (p<0.001)"
        - "Control group: severity score increased/worsened to 2.89 ± 0.956 (p<0.001)"
        - "Between-group difference highly significant by day 14"
        - "A. millefolium distillate healed oral mucositis substantially better than routine care alone"
        - "No adverse events from the herbal preparation reported"
      limitations:
        - "Small sample (n=56)"
        - "Distillate preparation — composition and standardization not fully characterized"
        - "Single-center study; heterogeneous cancer/chemotherapy types"
        - "Combination with routine solution makes yarrow contribution unclear"
      key_finding: "A. millefolium distillate mouthwash (15 mL × 4/day × 14 days) reduced chemotherapy-induced OM severity from 2.39 to 0.32 vs. worsening to 2.89 in controls (p<0.001, n=56)"

  - citation:
      authors: "Kazemian A, Toghiani A, Shafiei K, Afshar H, Rafiei R, Memari M, Adibi P"
      title: "Evaluating the efficacy of mixture of Boswellia carterii, Zingiber officinale, and Achillea millefolium on severity of symptoms, anxiety, and depression in irritable bowel syndrome patients"
      journal: "Journal of Research in Medical Sciences"
      year: 2017
      volume: "22"
      pages: "120"
      pmid: "29259631"
      doi: "10.4103/jrms.JRMS_905_16"
      url: "https://pubmed.ncbi.nlm.nih.gov/29259631/"
    study_details:
      design: "Randomized controlled clinical trial (case and control groups)"
      participants: 60
      population: "IBS patients with mild-to-moderate symptoms (mean age 38.75 ± 11.74 years)"
      intervention: "Herbal mixture of Boswellia carterii + Zingiber officinale + Achillea millefolium vs. placebo"
      key_outcomes:
        - "Abdominal pain severity and frequency significantly decreased in herbal group (P<0.05)"
        - "Bloating score significantly reduced in intervention group"
        - "Depression and anxiety scores significantly decreased in herbal group"
        - "Quality of life improvement reached significance in men (P=0.01) but not women"
        - "Non-significant changes in control group for all primary outcomes"
      limitations:
        - "Multi-herb preparation — yarrow-specific contribution cannot be isolated"
        - "Dose of each individual herb not reported in abstract"
        - "Sample size (n=60) underpowered for subgroup analyses"
        - "No long-term follow-up"
      key_finding: "Herbal mixture containing A. millefolium significantly reduced IBS symptom severity, bloating, anxiety, and depression vs. placebo in 60 patients; yarrow-specific contribution is unquantifiable given multi-herb design"

  - citation:
      authors: "Mahmoudi A, Ebrahimi M, Moosavi SA, Sadeghi N, Alipour M"
      title: "Therapeutic Effect of Achillea millefolium on the Hemorrhoids; A Randomized Double-Blind Placebo-Controlled Clinical Trial"
      journal: "Journal of Herbal Medicine"
      year: 2023
      volume: "39"
      pages: "100658"
      doi: "10.1016/j.hermed.2023.100658"
      url: "https://www.sciencedirect.com/science/article/abs/pii/S2210803323000350"
      pmid_note: "Not indexed in PubMed as of 2026-02-28; published in Elsevier Journal of Herbal Medicine"
    study_details:
      design: "Randomized, double-blind, placebo-controlled clinical trial"
      participants: 54
      population: "Patients with grade 1 and 2 internal hemorrhoids (Kowsar Clinic, Ardabil)"
      intervention: "5% hydroalcoholic extract A. millefolium ointment, applied 3 times/day for 10 days"
      key_outcomes:
        - "Pain: significantly reduced in treatment group (p<0.05)"
        - "Discomfort during defecation: significantly improved"
        - "Bleeding intensity and frequency: significantly reduced"
        - "Itching: no significant improvement vs. placebo"
        - "Overall: ointment reduced most grade 1–2 hemorrhoid symptoms except pruritus"
      limitations:
        - "Short treatment duration (10 days only)"
        - "Grade 1–2 only — not evaluated for more advanced hemorrhoidal disease"
        - "No long-term recurrence data"
        - "Not indexed in PubMed as of search date"
      key_finding: "5% A. millefolium hydroalcoholic extract ointment (3×/day × 10 days) significantly improved pain, defecation discomfort, and bleeding in grade 1–2 hemorrhoids (n=54); itching was not improved"

# Systematic Reviews
systematic_reviews:
  - citation:
      authors: "Moradi F, Niazi A, Abbasi Z, Mollazadeh S, Nouravaran Feizabadi F"
      title: "The Impact of Achillea Millefolium on Primary Dysmenorrhea and Menstrual Bleeding: A Systematic Review"
      journal: "Journal of Midwifery and Reproductive Health"
      year: 2024
      doi: "10.22038/jmrh.2023.68062.1991"
      url: "https://jmrh.mums.ac.ir/article_23443.html"
    study_details:
      design: "Systematic review"
      databases_searched: "Science Direct, PubMed, ProQuest, Cochrane Library, Scopus, Web of Science"
      search_cutoff: "August 2022"
      included_studies: 6
      scope: "3 studies on primary dysmenorrhea, 2 on menorrhagia; 1 additional study"
      key_outcomes:
        - "All 3 dysmenorrhea studies reported significant pain reduction with A. millefolium"
        - "2 menorrhagia studies demonstrated reduced menstrual bleeding volume"
        - "Overall conclusion: A. millefolium is an effective and safe herbal remedy for primary dysmenorrhea and reduction of menstrual bleeding"
        - "No serious adverse effects reported across reviewed trials"
      limitations:
        - "Small number of eligible studies (n=6)"
        - "Heterogeneity in preparations (teabag, capsule, different doses)"
        - "No meta-analysis performed; narrative synthesis only"
        - "Risk of bias assessment details not available in abstract"
      key_finding: "Systematic review of 6 trials concluded A. millefolium is effective for primary dysmenorrhea and menorrhagia; narrative synthesis only due to preparation heterogeneity"

# Comprehensive Reviews (Pharmacokinetics, Safety, DDI)
reviews:
  - citation:
      authors: "Far BF, Behzad G, Khalili H"
      title: "Achillea millefolium: Mechanism of action, pharmacokinetic, clinical drug-drug interactions and tolerability"
      journal: "Heliyon"
      year: 2023
      volume: "9"
      issue: "12"
      pages: "e22841"
      pmid: "38076118"
      pmcid: "PMC10703637"
      doi: "10.1016/j.heliyon.2023.e22841"
      url: "https://pubmed.ncbi.nlm.nih.gov/38076118/"
    study_details:
      study_type: "Narrative review — pharmacokinetics, mechanisms, drug interactions, safety"
      key_pharmacokinetic_data:
        camphor: "Peak plasma: 3h (alone) or 1h (with solvent); half-life: 167 min (alone) or 93 min (with solvent); hepatic CYP450 metabolism"
        cineole_1_8: "Half-life 6.7 min; rapidly absorbed and oxidized; complete oral absorption"
        apigenin: "Half-life 91.8 h; <40% excreted in gastric acid within 5 days; extensive hepatic metabolism"
        kaempferol: "Half-life 2.93–3.79 min (very rapid elimination)"
        linalool: "Half-life 3.2 h; ~10% excreted in urine"
        camphene: "Half-life 9.12 days (long retention)"
        limonene: "Half-life 12–24 h; low mutagenic/carcinogenic potential"
      drug_interactions_identified:
        - "Chamazulene: CYP1A2, CYP2C9, CYP2D6, CYP3A4 inhibition — affects erythromycin, diazepam, cyclosporine levels"
        - "Quercetin: P-glycoprotein inhibition — increased digoxin levels by 413% (significant clinical risk)"
        - "Quercetin: reduces effects of antihistamines, cardiovascular drugs, immunosuppressants"
        - "Anticoagulants (warfarin): concomitant use may alter anticoagulant effectiveness"
        - "Antiplatelet agents: increased bleeding risk"
        - "Antihypertensives: synergistic blood pressure lowering"
        - "Hawthorn (Crataegus): combination contraindicated due to toxicity risk"
        - "Topotecan: co-administration requires avoidance"
      safety_summary:
        general: "Classified as safe for most users; no serious adverse effects except contact dermatitis"
        thujone: "Alpha-thujone more neurotoxic than beta-thujone; optimal daily intake estimated 3–7 mg/day; LD50 45 mg/kg in mice"
        camphor: "Fatal dose 50–500 mg/kg adults; 2g harmful; 4g potentially fatal; lethal dose for children 0.5–1g"
        limonene: "Cutaneous sensitization most common adverse effect; GI complaints at high doses"
        reproductive: "High doses (800 mg/kg in rats) caused transitory antifertility effects (seminiferous tubule damage)"
      key_finding: "Comprehensive PK data for yarrow constituents; clinically significant DDI risk via CYP450 inhibition (chamazulene) and P-gp inhibition (quercetin, 413% digoxin increase); general safety established except contact dermatitis and high-dose thujone/camphor concerns"

  - citation:
      authors: "Ali SI, Gopalakrishnan B, Venkatesalu V"
      title: "Pharmacognosy, Phytochemistry and Pharmacological Properties of Achillea millefolium L.: A Review"
      journal: "Phytotherapy Research"
      year: 2017
      volume: "31"
      issue: "8"
      pages: "1140-1161"
      pmid: "28618131"
      doi: "10.1002/ptr.5840"
      url: "https://pubmed.ncbi.nlm.nih.gov/28618131/"
    study_details:
      study_type: "Literature review — pharmacognosy, phytochemistry, pharmacology"
      key_outcomes:
        - "Monoterpenes constitute ~90% of essential oils"
        - "Documented activities: anti-inflammatory, anti-ulcer, anticancer, antioxidant, antispasmodic, hepatoprotective"
        - "Supports traditional gastrointestinal and gynecological applications"
        - "Authors conclude further clinical and pathological investigations are needed"
      key_finding: "Comprehensive pharmacological review confirming pharmacological basis for traditional uses; highlights gap between preclinical evidence and clinical validation"

  - citation:
      authors: "Benedek B, Kopp B"
      title: "Achillea millefolium L. s.l. revisited: recent findings confirm the traditional use"
      journal: "Wiener Medizinische Wochenschrift"
      year: 2007
      volume: "157"
      issue: "13-14"
      pages: "312-314"
      pmid: "17704978"
      doi: "10.1007/s10354-007-0431-9"
      url: "https://pubmed.ncbi.nlm.nih.gov/17704978/"
    study_details:
      study_type: "Review / mechanistic findings"
      key_outcomes:
        - "Flavonoids mediate antispasmodic properties of yarrow (smooth muscle relaxation)"
        - "Dicaffeoylquinic acids responsible for choleretic (bile-stimulating) effects"
        - "Yarrow extracts inhibit human neutrophil elastase — anti-inflammatory mechanism independent of COX inhibition"
        - "Findings substantiate traditional uses for GI, biliary complaints, and inflammation"
      key_finding: "Phytochemical attribution study: flavonoids = antispasmodic; dicaffeoylquinic acids = choleretic; HNE inhibition adds novel anti-inflammatory mechanism supporting traditional GI and biliary uses"

# Regulatory Monographs and Pharmacopoeia
regulatory_documents:
  - authority: "German Commission E"
    title: "Commission E Monograph — Achillea millefolium (Yarrow Herb and Flower)"
    document_date: "1990"
    published_in: "Blumenthal M (ed). The Complete German Commission E Monographs. American Botanical Council / Integrative Medicine Communications, 1998"
    status: "Approved monograph"
    preparations_covered: "Millefolii herba (yarrow herb) and Millefolii flos (yarrow flower)"
    approved_indications:
      - "Loss of appetite"
      - "Dyspeptic ailments (mild spasmodic gastrointestinal complaints)"
    dosing:
      internal_herba: "2–4 g dried herb (infusion) three times daily; i.e., 6–12 g/day total"
      internal_flos: "2–4 g dried flower as infusion; equivalent extract doses"
      external: "Not specified in Commission E monograph"
    contraindications: "Allergy to Asteraceae/Compositae family"
    side_effects: "Contact dermatitis (rare but documented); rare photosensitization"
    drug_interactions: "None specified in original monograph"
    evidence_basis: "Traditional use combined with pharmacological data; no clinical trial requirement"
    note: >
      Commission E approved yarrow in 1990 for loss of appetite and mild dyspepsia.
      This was a positive monograph for both herba and flos forms, based on traditional
      use and available pharmacological data rather than RCT evidence.

  - authority: "European Medicines Agency (EMA) — Committee on Herbal Medicinal Products (HMPC)"
    title: "Community Herbal Monograph on Achillea millefolium L., flos"
    document_number: "EMA/HMPC/143949/2010"
    assessment_report: "EMA/HMPC/149343/2010"
    addendum: "EMA/HMPC/630682/2018"
    date_finalized: "September 30, 2011"
    url: "https://www.ema.europa.eu/en/medicines/herbal/millefolii-flos"
    status: "Assessment finalised — active EU herbal monograph"
    preparations_covered: "Millefolii flos (yarrow flower, dried)"
    approved_indications:
      - "Traditional use: temporary loss of appetite"
      - "Traditional use: mild spasmodic gastrointestinal complaints including bloating and flatulence"
      - "Traditional use: minor spasm associated with menstrual periods"
      - "Traditional use: treatment of small superficial wounds"
    age_restriction: "Adults and adolescents over 12 years only"
    duration_limits:
      gi_appetite: "Consult physician if symptoms persist beyond 2 weeks"
      wounds_menstrual: "Consult physician if symptoms persist beyond 1 week"
    evidence_basis: >
      Traditional herbal medicinal product status — 30+ years of medicinal use in the EU.
      HMPC concluded clinical evidence was insufficient to establish well-established use
      but recognized long traditional use. No RCT data required for traditional use registration.
    note: >
      This is the flower (flos) monograph. A separate herba (aerial parts) monograph also exists
      (EMA/HMPC, updated revision 1). The flos monograph was finalized September 2011 and
      represents the primary EU regulatory standard for yarrow flower preparations.

  - authority: "European Medicines Agency (EMA) — Committee on Herbal Medicinal Products (HMPC)"
    title: "EU Herbal Monograph on Achillea millefolium L., herba (Revision 1)"
    document_type: "Draft European Union herbal monograph — herba (aerial parts)"
    url: "https://www.ema.europa.eu/en/documents/herbal-opinion/draft-european-union-herbal-monograph-achillea-millefolium-l-herba-revision-1_en.pdf"
    status: "Revision 1 (draft/updated)"
    preparations_covered: "Millefolii herba (yarrow herb, aerial parts)"
    approved_indications:
      - "Traditional use: temporary loss of appetite"
      - "Traditional use: mild spasmodic gastrointestinal complaints including bloating and flatulence"
      - "Traditional use: minor spasm associated with menstrual periods"
      - "Traditional use: treatment of small superficial wounds"
    evidence_basis: "Traditional herbal medicinal product — European traditional use; no RCTs required"
    note: >
      The herba monograph covers dried aerial parts as an alternative to the flos (flower only)
      preparation. Revision 1 updates the earlier first-version community herbal monograph.

  - authority: "European Pharmacopoeia (Ph. Eur.) — Council of Europe"
    title: "Millefolii herba / Millefolii flos — European Pharmacopoeia monographs"
    status: "Official pharmacopoeial standards"
    quality_standards:
      herba_essential_oil: "Minimum 2 mL/kg (dried drug)"
      flos_chamazulene: "Minimum 0.02% (proazulenes expressed as chamazulene, dried drug)"
      proazulenes_general: "Presence of proazulene-type sesquiterpene lactones required for flos"
    note: >
      The European Pharmacopoeia establishes quality standards (identity, purity, content)
      for both yarrow herb (herba) and flower (flos). Standardization markers include
      essential oil content for herba and proazulene/chamazulene content for flos.
      No pharmacopoeial standardization to flavonoid content currently required.

  - authority: "ESCOP (European Scientific Cooperative on Phytotherapy)"
    title: "Millefolii Herba — Yarrow herb monograph"
    url: "https://www.escop.com/downloads/millefolii-herba-yarrow/"
    status: "ESCOP published monograph"
    note: >
      ESCOP has published a Millefolii Herba monograph covering therapeutic indications
      similar to Commission E and EMA (appetite, dyspepsia, menstrual spasm). ESCOP
      monographs synthesize pharmacological and clinical evidence with more detail than
      Commission E but typically require traditional use evidence rather than RCT evidence
      for established botanical medicines.

# Dosing Information
dosing_information:
  regulatory_dose:
    - source: "German Commission E (1990)"
      preparation: "Dried herb (infusion/tea)"
      dose: "2–4 g, three times daily (6–12 g/day)"
      frequency: "3× daily"
      duration: "Not specified (short-term for acute complaints)"
      population: "Adults"
    - source: "EMA/HMPC Millefolii flos monograph (2011)"
      preparation: "Flower (flos) — infusion or equivalent extract"
      age_restriction: "Adults and adolescents ≥12 years"
      duration_gastrointestinal: "Maximum 2 weeks without medical supervision"
      duration_wound_menstrual: "Maximum 1 week without medical supervision"

  clinical_trial_doses:
    - trial: "Type 2 Diabetes (Daneshvar-Ghahfarokhi 2025)"
      dose: "500 mg/day encapsulated dried herb"
      duration: "90 days"
      outcome: "Improved liver enzymes and lipid profile"
    - trial: "Multiple Sclerosis (Ayoobi 2019)"
      doses: ["250 mg/day aqueous extract", "500 mg/day aqueous extract"]
      duration: "1 year"
      outcome: "Both doses effective; 500 mg superior for lesion volume"
    - trial: "IBS herbal mixture (Kazemian 2017)"
      dose: "Mixture dose not fully specified"
      components: "Boswellia carterii + Zingiber officinale + Achillea millefolium"
      duration: "Not specified in abstract"
    - trial: "Hemorrhoids (Mahmoudi 2023)"
      dose: "5% hydroalcoholic extract ointment, 3× daily topically"
      duration: "10 days"
      outcome: "Improved pain, bleeding, defecation discomfort; not itching"

  standardization:
    primary_markers: "Essential oil content (≥2 mL/kg for herba); proazulenes/chamazulene (≥0.02% for flos); flavonoid profile (apigenin, luteolin, casticin, rutin)"
    secondary_markers: "Sesquiterpene lactone profile (achillin, achillicin); caffeic acid derivatives (chlorogenic, dicaffeoylquinic acids); alkaloid achilleine"
    standardization_note: >
      No single universal standardization marker exists across commercial preparations.
      European Pharmacopoeia specifies essential oil content (herba) or chamazulene
      equivalents (flos) as quality markers. Clinical trial preparations are frequently
      inadequately described regarding standardization, making inter-study comparison difficult.
      Chemotype variation (yarrow shows multiple chemotypes differing in essential oil profile)
      significantly affects composition and potentially efficacy.

  bioavailability_data:
    camphor:
      tmax: "1–3 h (alone: 3h; with solvent: 1h)"
      half_life: "93–167 min"
      metabolism: "Hepatic CYP450; oxidation to multiple hydroxylated metabolites"
    cineole_1_8:
      half_life: "6.7 min (very rapid)"
      absorption: "Complete oral absorption"
    apigenin:
      half_life: "91.8 h (prolonged tissue retention)"
      excretion: "<40% excreted in gastric acid within 5 days"
    limonene:
      half_life: "12–24 h"
      safety: "Low mutagenic, carcinogenic, or nephrotoxic potential"
    camphene:
      half_life: "9.12 days (very long)"
    linalool:
      half_life: "3.2 h"
      renal_excretion: "~10% of administered dose in urine"
    bioavailability_note: >
      Constituent-level PK data is available for key monoterpene and flavonoid components
      (Far et al. 2023). No human in vivo pharmacokinetic study exists for whole
      A. millefolium preparations measuring plasma concentrations after standardized doses.
      The long half-life of apigenin (91.8h) and camphene (9.12 days) suggests accumulation
      is possible with daily dosing. CYP450 inhibition by chamazulene has clinical drug
      interaction implications.

# Safety Studies and Toxicology
safety_studies:
  - citation:
      authors: "Bagheri A, Amin G, Tavangar SM, Heidari M, Bagheri J"
      title: "Safety and hemostatic effect of Achillea millefolium L. in localized bleeding"
      journal: "Hepatol Forum"
      year: 2024
      volume: "5"
      issue: "1"
      pages: "25-27"
      pmid: "38283274"
      doi: "10.14744/hf.2022.2022.0041"
      url: "https://pubmed.ncbi.nlm.nih.gov/38283274/"
    study_details:
      design: "Animal study (female Wistar rats, n=12)"
      method: "Controlled liver incision bleeding model; topical hydroalcoholic extract application"
      key_outcomes:
        - "Bleeding time reduced by 36.1% (incision site 1) and 31.9% (incision site 2)"
        - "Histopathological analysis showed no signs of toxicity or hepatic damage at 4, 6, and 8 weeks"
        - "Safety confirmed for topical application in this model"
      note: "Animal study only — human topical safety data supports (contact sensitization aside) but formal human hemostasis RCT is lacking"
      key_finding: "Topical A. millefolium hydroalcoholic extract reduced bleeding time by ~31–36% in rat liver incision model with no histopathological hepatotoxicity at 4–8 weeks"

  known_safety_concerns:
    - concern: "Contact dermatitis / contact allergy"
      evidence_level: "Well documented in humans (case reports, patch test studies)"
      detail: >
        Principal sensitizers are sesquiterpene lactones in the guaianolide class,
        particularly alpha-peroxyachifolid. Cross-reactivity with other Asteraceae
        (feverfew, chrysanthemum, tansy, ragweed) is well established. Occupational
        and cosmetic exposure most common triggers. Patch test prevalence in dermatology
        clinics: approximately 1–2% of tested patients react to yarrow or Asteraceae mix.
    - concern: "Alpha-thujone neurotoxicity"
      evidence_level: "Animal data; human case reports at extreme doses"
      detail: >
        Alpha-thujone in yarrow essential oil is more neurotoxic than beta-thujone.
        Optimal daily intake estimated at 3–7 mg/day. LD50 = 45 mg/kg in mice.
        Standard therapeutic oral doses from dried herb infusions deliver limited thujone
        (thujone is volatile; reduced by brewing/processing). Internal essential oil use
        is contraindicated at high doses.
    - concern: "Camphor toxicity"
      evidence_level: "Human case reports (primarily from concentrated essential oil)"
      detail: >
        Camphor: 2g harmful, 4g potentially fatal in adults; lethal dose for children 0.5–1g.
        Fatal dose range 50–500 mg/kg. Risk pertains to concentrated essential oil, not
        therapeutic infusion/extract doses from dried herb.
    - concern: "Drug interactions (CYP450 and P-glycoprotein)"
      evidence_level: "In vitro; one human pharmacokinetic study (quercetin + digoxin)"
      detail: >
        Chamazulene: CYP1A2, 2C9, 2D6, 3A4 inhibition (in vitro). Quercetin:
        P-glycoprotein inhibition leading to 413% increase in digoxin AUC (human PK study).
        Significant clinical risk with narrow therapeutic index drugs (digoxin, warfarin,
        cyclosporine, topotecan).
    - concern: "Anticoagulant/antiplatelet interaction"
      evidence_level: "Pharmacological plausibility; no human bleeding studies"
      detail: >
        Achilleine (plant alkaloid) has documented hemostatic properties; paradoxically,
        flavonoid and dicaffeoylquinic acid components may inhibit platelet aggregation.
        Concomitant use with warfarin or antiplatelet agents requires caution.
    - concern: "Reproductive toxicity (high doses)"
      evidence_level: "Animal study only"
      detail: >
        High doses (800 mg/kg body weight) in male rats caused transitory antifertility effects
        (seminiferous tubule damage). Effects were reversible. Not observed at therapeutic doses.
        No human reproductive toxicity data.
    - concern: "Pregnancy"
      evidence_level: "Traditional contraindication; uterotonic/emmenagogue properties documented"
      detail: >
        Commission E, EMA, and all traditional sources contraindicate yarrow in pregnancy.
        Yarrow has traditional emmenagogue uses and experimental uterine stimulant activity.
        No human teratogenicity studies exist.

  contraindications_consensus:
    - "Allergy to Asteraceae/Compositae family plants (feverfew, chrysanthemum, ragweed, chrysanthemum, tansy, chamomile)"
    - "Pregnancy (all regulatory and traditional sources — emmenagogue/uterotonic risk)"
    - "Lactation (insufficient safety data; Commission E and EMA do not specify but conservative practice contraindicates)"
    - "Concurrent use of narrow therapeutic index drugs metabolized by CYP3A4, CYP2D6, CYP2C9, CYP1A2 without monitoring"
    - "Concurrent digoxin use (quercetin-mediated 413% AUC increase documented)"
    - "Concentrated essential oil: internal use contraindicated due to camphor and thujone content"

  safety_duration_consensus: >
    Commission E: no explicit limit stated for approved indications (short-term implied).
    EMA: 2 weeks maximum for GI/appetite indications; 1 week maximum for wound/menstrual indications,
    without medical supervision. Clinical trials: durations ranged 10 days to 1 year (MS trial)
    with no serious adverse events reported at 250–500 mg/day. Long-term safety beyond 1 year
    not formally evaluated.

# Key Research Gaps
research_needs:
  - "Human pharmacokinetic studies: whole-herb PK profiling (plasma Cmax, Tmax, half-life) for standardized extracts — constituent-level PK does not substitute"
  - "Dose-finding RCTs for primary indications: dysmenorrhea (standardized capsule dose vs. teabag), IBS (yarrow-only arm), and appetite/dyspepsia"
  - "Yarrow-only IBS clinical trials: all positive GI trials used multi-herb mixtures; yarrow-specific contribution is unestablished"
  - "Larger MS trial: the Ayoobi 2019 trial was underpowered; replication with ≥150 patients and pre-specified endpoints needed"
  - "Contact sensitization prevalence studies: systematic patch testing data in general population"
  - "Human pharmacovigilance data: post-marketing surveillance for drug interactions (CYP450, P-gp)"
  - "Hepatoprotective RCT: preclinical and T2D trial data suggest hepatoprotective effects; dedicated liver disease trial warranted"
  - "Wound healing RCT: traditional topical use for wound healing has EMA support but no formal placebo-controlled human trial identified"
  - "Standardized extract development: chemotype-consistent, flavonoid/sesquiterpene lactone-standardized extract for reproducible clinical research"
  - "Meta-analysis of dysmenorrhea trials: sufficient trials now exist for quantitative pooling"
  - "Long-term safety data beyond 12 months"
  - "Children/adolescent dosing studies (EMA monograph includes adolescents ≥12 but no pediatric trial data exist)"

# Summary Points
summary:
  clinical_evidence:
    - "6 human RCTs identified: MS (n=75, 1yr), dysmenorrhea (teabag, 2 cycles), oral mucositis (n=56, 14 days), IBS mixture (n=60), T2D (n=60, 90 days), hemorrhoids (n=54, 10 days)"
    - "1 systematic review: 6 trials for dysmenorrhea/menorrhagia — conclusion: effective and safe"
    - "Highest quality trial: MS RCT (triple-blind, 75 patients, 1 year, 3 groups) with significant outcomes at both doses"
    - "Most trials are small (n=54–75) with limited standardization disclosure"
    - "IBS trial used multi-herb preparation; yarrow contribution not isolable"
    - "Hemorrhoids trial not indexed in PubMed; evidence quality moderate"

  key_phytochemistry:
    - "Sesquiterpene lactones (guaianolides): achillin, achillicin, achillifolin — anti-inflammatory, antispasmodic, contact sensitizers"
    - "Flavonoids: apigenin (t½ 91.8h), luteolin, rutin, casticin — antispasmodic, anti-inflammatory, antioxidant"
    - "Caffeic acid derivatives: chlorogenic acid, dicaffeoylquinic acids — choleretic, anti-inflammatory"
    - "Essential oil: camphor, 1,8-cineole, alpha-thujone, chamazulene, borneol, camphene, limonene — antimicrobial, antispasmodic, CYP450 inhibition"
    - "Alkaloid: achilleine — hemostatic activity"
    - "Monoterpenes constitute ~90% of essential oil by weight"
    - "Significant chemotype variation: yarrow shows multiple essential oil chemotypes (camphor, chamazulene, thujone, chrysanthenyl acetate types)"

  safety:
    - "Commission E and EMA: approved for short-term use; contraindicated in Asteraceae allergy and pregnancy"
    - "Primary documented adverse effect: contact dermatitis/sensitization (sesquiterpene lactones, principally alpha-peroxyachifolid)"
    - "Clinically significant DDI: quercetin increases digoxin AUC by 413%; CYP1A2/2C9/2D6/3A4 inhibition by chamazulene"
    - "Camphor and thujone toxicity concerns apply to concentrated essential oil, not therapeutic infusion doses"
    - "High-dose reproductive toxicity (animal only, transitory): not observed at therapeutic doses in clinical trials"
    - "6 RCTs reported no serious adverse events at doses 250–500 mg/day for up to 1 year"
    - "Anticoagulant/antiplatelet interaction potential requires monitoring"

  bioavailability:
    - "Constituent-level PK available: camphor t½ 93–167 min; apigenin t½ 91.8h; camphene t½ 9.12 days"
    - "Apigenin and camphene accumulate with daily dosing due to long half-lives"
    - "Complete oral absorption of 1,8-cineole; ~10% renal excretion of linalool"
    - "No whole-herb human PK study with standardized preparation exists"
    - "CYP450 inhibition by chamazulene has verified clinical DDI consequence (digoxin)"

  regulatory_status:
    - "German Commission E (1990): POSITIVE monograph for herba and flos — approved for loss of appetite and dyspeptic ailments"
    - "EMA/HMPC: Community herbal monograph for flos (EMA/HMPC/143949/2010, 2011) — traditional use for appetite, GI complaints, menstrual spasm, superficial wounds"
    - "EMA/HMPC: Herba monograph (revision 1) — same traditional use indications"
    - "European Pharmacopoeia: official quality standards for both Millefolii herba and Millefolii flos"
    - "ESCOP: Millefolii Herba monograph published"
    - "No WHO monograph specifically for Achillea millefolium identified"
    - "No USP/NF monograph for yarrow identified"
    - "No Health Canada NHPID product license reviewed (Canadian OTC status likely as traditional herbal)"

