  - citation:
      title: "EMA/HMPC Community Herbal Monograph: Harpagophytum procumbens DC. and/or Harpagophytum zeyheri Decne., radix"
      issuing_body: "European Medicines Agency, Committee on Herbal Medicinal Products (HMPC)"
      reference: "EMA/CHMP/627057/2015"
      year: 2016
      url: "https://www.ema.europa.eu/en/medicines/herbal/harpagophyti-radix"
    document_type: "Regulatory monograph / traditional herbal medicinal product classification"
    key_content:
      indications_traditional_use:
        - "Relief of minor joint pain (musculoskeletal)"
        - "Relief of mild digestive disorders (bloating, flatulence)"
        - "Temporary loss of appetite"
      classification: "Traditional use (evidence of safe use ≥30 years including ≥15 years in EU; plausible efficacy but insufficient clinical trial evidence for 'well-established use' status)"
      dosing_raw_herb: "0.6–7.5 g dried secondary root tubers per day"
      standardization_requirement: "≥1.2% harpagoside content in herbal substance"
      adverse_effects_listed:
        - "Gastrointestinal: diarrhoea, nausea, vomiting, abdominal pain"
        - "Headache and vertigo"
        - "Hypersensitivity reactions (rash, hives, face swelling)"
      contraindications:
        - "Gastric or duodenal ulcers (potential gastric acid stimulation)"
        - "Pregnancy (oxytocic properties reported in vitro)"
        - "Known hypersensitivity to Harpagophytum preparations"
      notes: "Pharmacopoeia listing: both H. procumbens and H. zeyheri in European Pharmacopoeia since 2003. German Commission E approved for dyspepsia, appetite stimulation, and degenerative musculoskeletal disorders."

# ─── Key Dosing Summary ────────────────────────────────────────────────────────

dosing_summary:
  active_marker: "Harpagoside (iridoid glycoside)"
  pharmacopoeia_minimum: "≥1.2% harpagoside in raw herb; ≥1.5% in standardized dry extract (European Pharmacopoeia)"
  clinical_dosing_ranges:
    low_back_pain:
      - "50 mg harpagoside/day (aqueous extract WS 1531, 600 mg) — strong evidence for acute exacerbations of chronic NSLBP"
      - "100 mg harpagoside/day (WS 1531, 1200 mg) — superior pain-free outcomes vs. 50 mg dose (p=0.027)"
      - "60 mg harpagoside/day (Doloteffin) — used in comparator trials vs. rofecoxib"
    osteoarthritis:
      - "≥30 mg harpagoside/day required for OA benefit (limited evidence below this threshold)"
      - "60 mg harpagoside/day (powder form) — moderate evidence for spine, hip, knee OA"
      - "2,400–2,610 mg extract/day (containing 50 mg harpagoside) — OA surveillance studies"
  proprietary_extracts:
    WS_1531: "Aqueous extract, Schwabe; 600–1200 mg/day providing 50–100 mg harpagoside"
    Doloteffin: "60 mg harpagoside/day; used in LBP vs. rofecoxib trial and 54-week follow-up"
    Harpadol: "Cryoground powder; 6 × 435 mg/day in diacerhein comparator trials"
    Teltonal: "2 × 480 mg tablets/day; used in 2021 KOA vs. meloxicam trial"
  pharmacokinetics:
    Tmax: "1.3–2.5 hours after oral dosing (WS 1531)"
    dose_response: "Linear relationship between dose and Cmax/AUC"
    bioavailability: "Low; 100 mg/day dose may not be detectable in serum/urine; clinical activity likely from whole-extract constituents beyond harpagoside"
    stability: "Acid hydrolysis in stomach; enteric-coated preparations may improve absorption"
