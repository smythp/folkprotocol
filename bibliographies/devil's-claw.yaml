---
herb: "Devil's Claw"
scientific_name: "Harpagophytum procumbens DC. (primary); Harpagophytum zeyheri Decne. (secondary)"
common_names:
  - "Devil's claw"
  - "Grapple plant"
  - "Wood spider"
  - "Harpagophytum"
  - "Teufelskralle (German)"
  - "Griffe du diable (French)"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-27
notes_on_scope: >
  Devil's claw refers to the dried secondary root tubers of Harpagophytum procumbens
  and H. zeyheri, native to southern Africa (Kalahari Desert region). The primary
  active marker compound is harpagoside (an iridoid glycoside), though whole-extract
  activity likely exceeds isolated harpagoside. European Pharmacopoeia requires ≥1.2%
  harpagoside in raw material and ≥1.5% in standardized dry extracts. Clinical evidence
  is strongest for musculoskeletal pain (low back pain, osteoarthritis). Two key
  aqueous/aqueous-ethanolic extract preparations appear in most trials: WS 1531
  (Schwabe; doses of 600–1200 mg/day containing 50–100 mg harpagoside) and Doloteffin
  (60 mg harpagoside/day). Harpagoside bioavailability is low; Tmax ~1.3–2.5 hours
  after oral dosing with linear dose–Cmax relationship. EMA HMPC classified devil's claw
  root as a traditional herbal medicinal product for minor joint pain and mild digestive
  disorders. Most clinical trials are >20 years old with methodological limitations;
  no trials exceed 54 weeks duration.

