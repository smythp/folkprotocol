safety_reports:
  - citation:
      authors: "Cuspidi C, Sala C, Tadic M, Grassi G, Mancia G"
      title: "Systemic Hypertension Induced by Harpagophytum procumbens (devil's claw): A Case Report"
      journal: "The Journal of Clinical Hypertension"
      year: 2015
      pmid: "26094951"
      pmcid: "PMC8031842"
      url: "https://pubmed.ncbi.nlm.nih.gov/26094951/"
    study_details:
      design: "Case report"
      patient: "62-year-old postmenopausal woman; no prior hypertension history"
      dose: "Two caplets/day (250 mg each) for hand osteoarthritis"
      duration_of_use: "2 weeks"
      adverse_effect: "Grade 2 symptomatic hypertension with BP reaching 175/100 mmHg; headache and dizziness"
      resolution: "BP normalized within 2 weeks of discontinuation; ambulatory average 124/72 mmHg"
      proposed_mechanism: "Harpagoside COX-2 inhibition → suppression of vasodilator prostaglandins → increased vasoconstriction (NSAID-like mechanism)"
      clinical_significance: "First documented case of hypertension associated with H. procumbens in humans; warrants caution in hypertensive patients and expanded pharmacovigilance"

