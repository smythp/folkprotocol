# ─── Pharmacokinetics & Bioavailability ───────────────────────────────────────

pharmacokinetics:
  - citation:
      authors: "Loew D, Möllerfeld J, Schrödter A, Puttkammer S, Kaszkin M"
      title: "Investigations on the pharmacokinetic properties of Harpagophytum extracts and their effects on eicosanoid biosynthesis in vitro and ex vivo"
      journal: "Clinical Pharmacology & Therapeutics"
      year: 2001
      volume: "69"
      issue: "5"
      pages: "356–364"
      pmid: "11372004"
      doi: "10.1067/mcp.2001.115445"
      url: "https://pubmed.ncbi.nlm.nih.gov/11372004/"
    study_details:
      design: "Clinical pharmacokinetic study with in vitro and ex vivo components"
      subjects: "Male human volunteers (multiple independent studies)"
      extract: "WS 1531"
      key_findings:
        - "Tmax: maximum plasma harpagoside reached after 1.3–2.5 hours post-dose"
        - "Linear relationship between dose and both Cmax and AUC"
        - "Biphasic, dose-independent decrease of 28% and 58% in basal cysteinyl leukotriene (Cys-LT) formation"
        - "Close correlation between serum harpagoside levels and inhibition of leukotriene biosynthesis"
        - "Harpagoside is a functional biomarker for pharmacodynamic activity"

  - citation:
      authors: "Chrubasik S, Conradt C, Roufogalis BD"
      title: "Effectiveness of Harpagophytum extracts and clinical efficacy"
      journal: "Phytotherapy Research"
      year: 2004
      pmid: "15022177"
      doi: "10.1002/ptr.1416"
      url: "https://pubmed.ncbi.nlm.nih.gov/15022177/"
    study_details:
      design: "Comparative review of extract standardization and clinical efficacy"
      key_findings:
        - "Preparations standardized to 50–60 mg harpagoside/day provide substantially better clinical evidence than ~25–30 mg/day ethanol extracts"
        - "Confirmatory studies required for all extract types before treatment guideline inclusion"
        - "Harpagoside is the critical quality and efficacy marker; extract type (aqueous vs. ethanolic) affects harpagoside bioavailability"
        - "100 mg harpagoside/day at therapeutic doses may not be detectable in serum/urine (low absolute bioavailability)"

