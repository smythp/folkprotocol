# Bioavailability and Pharmacokinetics
bioavailability:
  - citation:
      authors: "Bonetti G, Tedeschi P, Meca G, Bertelli D, Mañes J, Brandolini V, Maietti A"
      title: "In vitro bioaccessibility, transepithelial transport and antioxidant activity of Urtica dioica L. phenolic compounds in nettle based food products"
      journal: "Food & Function"
      year: 2016
      volume: "7"
      issue: "10"
      pages: "4222-4230"
      pmid: "27713992"
      doi: "10.1039/c6fo00521g"
      url: "https://pubmed.ncbi.nlm.nih.gov/27713992/"
    study_details:
      design: "In vitro — dynamic digestion simulation and Caco-2 transepithelial transport model"
      methods:
        - "Simulated gastric and intestinal digestion (dynamic digestion model)"
        - "Caco-2 monolayer transepithelial transport assay"
        - "HPLC-DAD quantification of phenolic compounds"
      key_phenolics_assessed:
        - "3-Caffeoylquinic acid (3-CQA)"
        - "Caffeic malic acid (CMA)"
        - "Rutin"
      key_findings:
        bioaccessibility:
          - "Phenolic compound release optimized during duodenal digestion phase"
          - "Food matrix type significantly influenced dissolution rate"
        bioavailability:
          - "Low transepithelial transport of native forms of 3-CQA, CMA, and rutin"
          - "Colonic fermentation by gut microflora likely important secondary route"
        antioxidant:
          - "Nettle-based foods create antioxidant environment against superoxide anion radicals throughout GI tract"
      limitations:
        - "In vitro study only; human pharmacokinetic data for nettle phenolics not available"
        - "Colonic metabolism not directly modeled"
      notes: "No clinical-scale human PK studies for Urtica dioica whole herb or standardized extracts have been published as of 2026-02-27"

# Safety
safety:
  - authority: "LiverTox (NIH/NCBI)"
    title: "Stinging Nettle"
    database: "NCBI Bookshelf"
    accession: "NBK589898"
    url: "https://www.ncbi.nlm.nih.gov/books/NBK589898/"
    likelihood_score: "E (unlikely cause of clinically apparent liver injury)"
    key_findings:
      - "No published reports of serum enzyme elevations or clinically apparent liver injury from stinging nettle root or leaf extracts"
      - "Systematic reviews of herb-induced liver injury (US, Spain, Latin America, Sweden databases) identified no cases attributed to stinging nettle"
      - "Multiple controlled trials reported minimal adverse effects with no hepatic signals"
    common_adverse_effects:
      - "Headache (uncommon)"
      - "Nausea, diarrhea, abdominal discomfort (uncommon, usually mild)"
      - "Gastric irritation with leaf products"
      - "Topical urticarial rash from fresh plant contact (expected sting reaction)"
    safety_summary: >
      Stinging nettle is among the safest herbal supplements regarding hepatic safety.
      No established hepatotoxic mechanism. In sharp contrast to Scutellaria baicalensis (Chinese skullcap),
      which shares some indications, Urtica dioica has no documented DILI cases and a LiverTox Score E.

