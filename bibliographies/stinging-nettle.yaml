---
herb: Stinging Nettle
scientific_name: "Urtica dioica L.; also Urtica urens L. (small nettle, lesser stinging nettle)"
common_names:
  - "Stinging nettle"
  - "Common nettle"
  - "Nettle"
  - "Greater nettle"
  - "Burn nettle"
parts_used:
  - "Leaf/Herb (Urticae folium / Urticae herba): diuretic, anti-inflammatory, antihistamine"
  - "Root (Urticae radix): BPH, prostate health, SHBG modulation"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-27
notes_on_scope: >
  Urtica dioica is a highly versatile medicinal plant with distinct clinical profiles for its leaf/herb
  and root parts. Root extracts are the primary form studied for BPH (benign prostatic hyperplasia),
  while leaf/whole herb preparations are studied for inflammatory conditions, allergic rhinitis,
  and metabolic disorders (diabetes, lipids). Standardization is inconsistent across trials; many
  use undefined hydroalcoholic or methanol extracts without marker compound specifications.
  The clinical evidence base is moderate for BPH (multiple RCTs, meta-analyses) and emerging for
  glycemic control (meta-analysis support). Allergic rhinitis and musculoskeletal evidence is limited
  by small trials and high risk of bias. Safety profile is excellent; LiverTox assigns Likelihood
  Score E (unlikely hepatotoxin). No significant adulterant or misidentification concern noted
  (unlike Scutellaria species).

