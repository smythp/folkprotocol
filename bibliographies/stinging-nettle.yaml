# Dosing Information
dosing_information:
  nettle_leaf_herb:
    traditional_dosing:
      - preparation: "Dried leaf (infusion/tea)"
        dose_range: "2-4 g"
        frequency: "Three times daily"
        total_daily: "6-12 g"
      - preparation: "Fluid extract (1:1, 25% ethanol)"
        dose: "2-4 mL"
        frequency: "Three times daily"
      - preparation: "Tincture (1:5, 45% ethanol)"
        dose: "2-6 mL"
        frequency: "Three times daily"
    ema_approved_dosing:
      - preparation: "Dry extract (8-10:1, 50% ethanol)"
        single_dose: "536 mg"
        frequency: "Up to twice daily"
        maximum_duration: "2-4 weeks per indication"
    commission_e_dosing:
      daily_total: "8-12 g dried herb"
    clinical_trial_dosing:
      - study: "Kianbakht et al. 2013 (diabetes)"
        dose: "500 mg leaf extract three times daily (1500 mg/day)"
        duration: "3 months"
      - study: "Namazi et al. 2011 (diabetes, inflammatory)"
        dose: "100 mg/kg/day hydroalcoholic extract in 3 divided doses"
        duration: "8 weeks"
      - study: "Amiri Behzadi et al. 2016 (diabetes lipids)"
        dose: "Hydroalcoholic extract (specific dose not published)"
        duration: "8 weeks"

  nettle_root:
    traditional_dosing:
      - preparation: "Dried root (decoction)"
        dose_range: "1.5-2 g"
        frequency: "Three times daily"
    commission_e_dosing:
      aqueous_extract: "360 mg daily"
      methanolic_extract: "600-1200 mg daily"
    clinical_trial_dosing:
      - study: "Safarinejad 2005 (BPH)"
        dose: "Urtica dioica extract (dose not published in abstract)"
        duration: "6 months"
      - study: "Karami et al. 2020 (BPH)"
        dose: "450 mg root extract daily"
        duration: "12 weeks"
      - study: "Bakhshaee et al. 2017 (allergic rhinitis)"
        dose: "150 mg root extract (Urtidin® F.C. Tablet)"
        duration: "1 month"
    standardization:
      marker_compounds:
        - "Polysaccharides (immuno-modulating fraction)"
        - "Lectins (UDA — Urtica dioica agglutinin)"
        - "Beta-sitosterol"
        - "Steryl glycosides (e.g., 3-O-glucoside)"
      notes: >
        No single universally accepted marker compound for nettle root standardization.
        Most commercial products and clinical trials use proprietary methanolic or aqueous extracts
        without explicit marker compound specification. Contrast with leaf preparations where
        total phenolics, chlorogenic acid, or rutin content may be specified.

# Key Research Gaps
research_needs:
  - "Human pharmacokinetic studies for standardized nettle leaf and root extracts are absent"
  - "Definitive large-scale RCTs for BPH using clearly defined standardized extracts with dose-ranging"
  - "Head-to-head comparison of nettle root vs pharmaceutical BPH treatments (e.g., tamsulosin, finasteride)"
  - "Long-term RCTs (>6 months) for glycemic control in T2DM"
  - "Clinical trials for nettle leaf as monotherapy in inflammatory arthritis (not multi-ingredient)"
  - "Bioavailability enhancement studies (nanoformulations, food matrix effects)"
  - "Allergy/rhinitis RCTs with adequate sample sizes and validated outcome measures"
  - "Standardization consensus for marker compounds in both leaf and root preparations"
  - "Studies in pregnant or lactating populations (currently contraindicated due to insufficient data)"
  - "Mechanistic human studies on SHBG modulation and 5-alpha reductase activity in vivo"

# Summary Points
summary:
  clinical_evidence:
    BPH:
      - "Multiple RCTs (3 confirmed) and 2 meta-analyses support efficacy for LUTS/BPH"
      - "Largest RCT (n=558): IPSS 19.8→11.8 with treatment vs 19.2→17.7 with placebo; 81% responders"
      - "Commission E approval and EMA assessment reports validate traditional use for BPH"
      - "Effect size clinically meaningful; adverse events absent across trials"
    diabetes_metabolic:
      - "Meta-analysis (13 RCTs): FBG -17.17 mg/dL, HbA1c -0.93%, CRP -1.09 mg/dL, TG -26.94 mg/dL"
      - "Glycemic improvements significant but HbA1c reduction borderline/small"
      - "Lipid effects: significant for triglycerides; no effect on total cholesterol or LDL"
    allergic_rhinitis:
      - "Two small RCTs (n=69, n=40); global assessments positive but symptom diary effects modest"
      - "Root extract (150 mg) reduces eosinophilia and modulates IFN-γ"
      - "Evidence base limited; not sufficient for clinical recommendation without further trials"
    musculoskeletal_arthritis:
      - "Phytalgic RCT (n=81): large reductions in analgesic/NSAID use and WOMAC scores; multi-ingredient"
      - "RA RCT (n=30/Urtica group): DAS28, IL-17, RF, CRP significantly improved vs placebo"
      - "Exploratory topical sting study (n=18): highly positive patient-reported outcomes"
      - "Commission E approves leaf for rheumatic complaints (supportive/adjunctive)"

  safety:
    - "LiverTox Likelihood Score E: no documented cases of clinically apparent liver injury"
    - "Multiple controlled trials across diverse indications reported no adverse effects"
    - "Common mild effects: GI discomfort, headache (uncommon)"
    - "Fresh plant contact causes urticaria (expected sting reaction from formic acid and silica needles)"
    - "Contraindicated in edema due to cardiac or renal insufficiency (irrigation therapy context)"
    - "Contraindicated in pregnancy and lactation (insufficient safety data)"
    - "Drug interaction concern: may have diuretic potentiation with other diuretics"

  pharmacokinetics:
    - "No human pharmacokinetic studies for whole herb or standardized extracts identified"
    - "In vitro: low transepithelial bioavailability of native phenolics (3-CQA, CMA, rutin)"
    - "Colonic microflora fermentation likely contributes to systemic phenolic availability"
    - "Active constituents for BPH (root): lectins (UDA), polysaccharides, sterols — not directly monitored in PK studies"
    - "No standardized PK methodology established for clinical correlation"

  standardization:
    leaf:
      - "EMA: 8-10:1 dry extract with 50% ethanol is approved reference preparation"
      - "Phenolic markers: chlorogenic acid derivatives, rutin, caffeic malic acid (analytical)"
    root:
      - "No internationally harmonized marker compound for standardization"
      - "Methanolic and aqueous extracts both used in BPH trials with differing compositions"
      - "Commission E doses based on extract weight, not marker compound content"

