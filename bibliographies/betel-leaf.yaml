# ─── SUMMARY STATISTICS ───────────────────────────────────────────────────────

bibliography_summary:
  total_sources: 16
  human_rcts: 3
  systematic_scoping_reviews: 1
  comprehensive_reviews: 5
  narrative_reviews: 4
  standardization_studies: 1
  preclinical_safety_studies: 1
  preclinical_animal_studies: 1
  phytochemistry_pharmacology: 1
  regulatory_monographs: 1

clinical_evidence_grade: >
  LIMITED. Only 3 RCTs involving human subjects identified — one on weight management using
  a combined extract formulation (n=50), one on oral hygiene (n=60 crossover), and one on
  periodontitis (n=60). No meta-analyses or systematic reviews of clinical trials found.
  Most evidence is preclinical (in vitro and animal models). Bioavailability and
  pharmacokinetic data in humans absent.

key_bioactive_markers:
  - hydroxychavicol (4-allylcatechol) — primary active compound; PDE4 inhibitor
  - eugenol — antibacterial, anti-inflammatory
  - chavibetol — antibacterial
  - allylpyrocatechol — antioxidant, antimicrobial
  - piperols (A, B) — antibacterial

traditional_dosing_context:
  juice: Used as adjuvant in Ayurvedic preparations; no standardized dose
  leaf_consumption: 1–2 whole leaves chewed traditionally; no validated clinical dose
  spray_dried_powder: Quality parameters established (Arawwawala 2011); clinical dose pending trials
  mouthwash: 2% extract, 5 mL twice daily (Sundaram 2021 RCT)
  toothpaste: Standard application twice daily (Ali 2022 RCT)
  weight_management: 300 mg combined herbal extract 3×/day (Sengupta 2012 RCT — combined product)

safety_summary:
  carcinogenicity: "Betel leaf alone: insufficient evidence for carcinogenicity. Betel QUID (with areca nut ± tobacco): Group 1 IARC carcinogen"
  acute_toxicity: "No adverse effects at 1–10 mg/kg in mice (Choudhary 2002)"
  animal_tumors: "No tumors in animal studies with isolated betel leaf (Toprani 2013 review)"
  contact_risk: "Prolonged direct skin contact with steamed leaf may cause contact dermatitis and hyperpigmentation"
  drug_interactions: Not systematically studied; noted as research gap
