herb: betel-leaf
botanical_name: Piper betle L.
common_names:
  - betel leaf
  - betel vine
  - paan leaf
  - sirih (Malay)
  - nagavalli (Sanskrit)
  - pan (Hindi)
family: Piperaceae

notes: |
  IMPORTANT SAFETY DISTINCTION: Betel leaf (Piper betle) must be distinguished from betel
  quid, which combines betel leaf with areca nut, slaked lime, and often tobacco. IARC
  classifies betel quid with tobacco as Group 1 carcinogen (oral, pharyngeal, esophageal
  cancers) and betel quid without tobacco as Group 1 (oral cancer). Betel leaf alone lacks
  carcinogenic classification and may possess chemopreventive properties; however, human
  clinical evidence remains limited. Most pharmacological studies are preclinical.

