  - id: iarc_2004_monograph_vol85
    title: "Betel-quid and Areca-nut Chewing and Some Areca-nut-derived Nitrosamines"
    authors:
      - "IARC Working Group on the Evaluation of Carcinogenic Risks to Humans"
    year: 2004
    publisher: "International Agency for Research on Cancer (IARC/WHO)"
    series: "IARC Monographs on the Identification of Carcinogenic Hazards to Humans"
    volume: 85
    url: https://publications.iarc.who.int/Book-And-Report-Series/Iarc-Monographs-On-The-Identification-Of-Carcinogenic-Hazards-To-Humans/Betel-quid-And-Areca-nut-Chewing-And-Some-Areca-nut-derived-Nitrosamines-2004
    ncbi_bookshelf: https://www.ncbi.nlm.nih.gov/books/NBK316567/
    study_type: regulatory_monograph
    meeting_date: "June 2003"
    key_findings:
      - "Betel quid WITH tobacco: Group 1 carcinogen (sufficient human evidence) — causes oral, pharyngeal, esophageal cancer"
      - "Betel quid WITHOUT tobacco: Group 1 carcinogen — causes oral cancer (upgraded from Vol. 37 'inadequate evidence')"
      - "Areca nut alone: Group 1 carcinogen to humans"
      - "Betel leaf (Piper betle) alone: insufficient evidence for carcinogenicity when isolated from quid preparation"
      - "Safrole identified in Piper betle flowers as possible carcinogen (Group 2B)"
    critical_distinction: >
      IARC evaluation targets betel quid as a preparation containing areca nut + lime ± tobacco
      wrapped in betel leaf. Betel leaf per se was not classified as carcinogenic. Researchers
      studying isolated Piper betle extracts (without areca nut and tobacco) note protective
      rather than carcinogenic properties.
    safety_implications: Betel leaf used alone (without areca nut, tobacco, or lime) not subject to Group 1 classification

