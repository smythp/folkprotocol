herb: Gentian
scientific_name: "Gentiana lutea L."
common_names:
  - "Yellow gentian"
  - "Gentian root"
  - "Bitter root"
  - "Bitter gentian"
  - "Great yellow gentian"
  - "Enzian (German)"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-27
notes_on_scope: >
  Gentiana lutea (yellow gentian) is the primary medicinal species and pharmacopoeial standard.
  Its active principles are secoiridoid glycosides: gentiopicroside (0.6–3.5% dry weight, primary
  bitter compound), amarogentin (0.025–0.05% dry weight; ~8000× more bitter than quinine by bitterness value),
  and swertiamarin. Additional constituents include xanthones (isogentisin, mangiferin) and
  flavonoids. The EMA HMPC (2019) granted gentian root only traditional-use status, not
  well-established medicinal use, reflecting the thin clinical evidence base for its primary
  traditional indications (appetite stimulation, dyspepsia). No RCTs have been published for
  gentian monotherapy in digestive complaints. The only placebo-controlled RCTs testing gentian
  as a sole intervention measured cosmetic/skin endpoints (lipid synthesis, n=33; skin roughness,
  n=22) and energy intake (n=20 healthy subjects). Gentian is best-evidenced as a component of
  Sinupret (BNO-101) for acute sinusitis, though isolation of gentian's individual contribution
  is not possible. Pharmacokinetic data exist only from animal studies. Commission E (Germany)
  gave a positive monograph in 1985/1990. Health Canada and ESCOP have monographs. No WHO
  Selected Medicinal Plants monograph has been published specifically for G. lutea.

# Systematic Reviews
systematic_reviews:
  - citation:
      authors: "Ponticelli M, Lela L, Moles M, Mangieri C, Bisaccia D, Faraone I, Falabella R, Milella L"
      title: "The healing bitterness of Gentiana lutea L., phytochemistry and biological activities: A systematic review"
      journal: "Phytochemistry"
      year: 2023
      volume: "206"
      pages: "113518"
      pmid: "36423749"
      doi: "10.1016/j.phytochem.2022.113518"
      url: "https://pubmed.ncbi.nlm.nih.gov/36423749/"
    study_details:
      study_type: "Systematic review (PRISMA-compliant)"
      databases: "PubMed and Scopus"
      search_period: "2000–June 2022"
      initial_results: 399  # 158 PubMed, 241 Scopus
      scope: "Phytochemistry, biological activities (in vitro, in vivo animal, and human interventional trials)"
      key_phytochemical_findings:
        - "Three dominant phytochemical classes: secoiridoids, flavonoids, xanthones"
        - "Gentiopicroside, amarogentin, swertiamarin: collectively 1–6% of G. lutea root dry weight"
        - "Amarogentin: one of the bitterest natural compounds known; 5000–8000× bitterness of quinine"
        - "Gentiopicroside: main secoiridoid, gastroprotective, hepatoprotective, anti-inflammatory"
      biological_activities:
        - "Antioxidant, antimicrobial, anti-inflammatory, anti-atherosclerotic, antihypertensive"
        - "Antiobesogenic, hepatoprotective, radioprotective, antidepressant (preclinical)"
      human_clinical_data:
        - "Only a small number of human interventional trials included; primarily in vitro and in vivo preclinical data"
        - "Human evidence limited to: cosmetic/skin endpoints, energy intake (food science), and combination product sinusitis studies"
      conclusion: "G. lutea extracts show promising activity across multiple disease models; clinical evidence lags substantially behind preclinical data"

  - citation:
      authors: "Melzer J, Saller R, Schapowal A, Brignoli R"
      title: "Systematic review of clinical data with BNO-101 (Sinupret) in the treatment of sinusitis"
      journal: "Forschende Komplementärmedizin (Research in Complementary Medicine)"
      year: 2006
      volume: "13"
      issue: "2"
      pages: "78-87"
      pmid: "16645287"
      doi: "10.1159/000091969"
      url: "https://pubmed.ncbi.nlm.nih.gov/16645287/"
    study_details:
      study_type: "Systematic review with meta-analysis"
      total_studies_identified: 22
      controlled_trials_reassessed: 6
      rcts_in_meta_analysis: 4
      total_patients_in_meta_analysis: ~620  # ~319 placebo-controlled + ~301 ambroxol-controlled
      product: "BNO-101 (Sinupret)"
      sinupret_composition: "Gentianae radix:Primulae flos:Rumicis herba:Sambuci flos:Verbenae herba = 1:3:3:3:3; gentian root content 6 mg/tablet"
      key_findings:
        vs_placebo: "2 RCTs (n=319 total): BNO-101 'cured' 61.1% vs placebo 34.5% (p < 0.05) after 2 weeks"
        vs_ambroxol: "2 RCTs (n=301 total): Chronic sinusitis 'cured' 37.1% (BNO-101) vs 12.5% (ambroxol), p < 0.05"
        symptoms_improved: "Reduced drainage obstruction, headache, and radiological signs vs placebo"
        safety: "Adverse event incidence similar to placebo"
      limitation: "Gentian contributes only 1 of 5 active components; individual contribution cannot be isolated"
      conclusion: "Sinupret (BNO-101) is significantly superior to placebo for acute and chronic sinusitis; safety profile comparable to placebo"

  - citation:
      authors: "Antoniadi L, Bartnik M, Angelis A, Wawruszak A, Halabalaki M, Kukula-Koch W, Skaltsounis LA"
      title: "Gentiopicroside—An Insight into Its Pharmacological Significance and Future Perspectives"
      journal: "Cells"
      year: 2023
      volume: "13"
      issue: "1"
      pages: "70"
      pmid: "38201274"
      pmcid: "PMC10778152"
      doi: "10.3390/cells13010070"
      url: "https://pubmed.ncbi.nlm.nih.gov/38201274/"
    study_details:
      study_type: "Systematic review"
      scope: "Pharmacological profile, molecular targets, and clinical translation potential of gentiopicroside (GPS), the primary secoiridoid of G. lutea"
      key_pk_findings:
        absorption: "Primarily via passive diffusion in intestinal epithelial cells; P-glycoprotein inhibitors significantly enhance uptake"
        stability: "34.4% degradation after 48 hours in intestinal fluids (in vitro)"
        metabolism: "Hydrolysis to aglycone intermediate, then converted to metabolites M1–M4 via isomerization, reduction, oxidation"
        lipophilicity: "Relatively poor lipophilicity; 'suboptimal pharmacokinetic properties' — main limitation for clinical translation"
        oral_ba_animal: "Oral bioavailability in mice: ~39.6%; Tmax 0.5 hours"
      safety_findings:
        genotoxicity: "One study reported genotoxic activity against prokaryotic and eukaryotic cells; weak structural similarity to established genotoxic agents"
        cell_viability: "At 50 μM concentration: 25% reduction in viable peripheral blood mononuclear cells"
      human_clinical_data: "Only one clinical trial identified involving human subjects (cosmetic gel cream, 22 subjects)"
      conclusion: "GPS shows multi-target pharmacological profile but poor oral bioavailability limits clinical development; encapsulation strategies being explored"

# Clinical Trials (Human Studies — Gentian Monotherapy)
clinical_trials:
  - citation:
      authors: "Mennella I, Fogliano V, Ferracane R, Arlorio M, Pattarino F, Vitaglione P"
      title: "Microencapsulated bitter compounds (from Gentiana lutea) reduce daily energy intakes in humans"
      journal: "British Journal of Nutrition"
      year: 2016
      volume: "116"
      issue: "10"
      pages: "1841-1850"
      pmid: "27829482"
      doi: "10.1017/S0007114516003858"
      url: "https://pubmed.ncbi.nlm.nih.gov/27829482/"
    study_details:
      study_type: "Randomized crossover controlled trial"
      design: "Crossover; participants received enriched and control conditions on separate occasions"
      participants: 20  # healthy subjects
      population: "Healthy adults"
      intervention: "Microencapsulated bitter ingredient-enriched pudding (EBIP) delivering 100 mg secoiridoids from G. lutea root extract with ethylcellulose-stearate coating, consumed at breakfast"
      comparator: "Control pudding (CP) without bitter compounds"
      primary_outcomes:
        - "Ad libitum energy intake at lunch 3 hours post-breakfast"
        - "Daily energy consumption"
        - "Postprandial gastrointestinal hormone responses"
        - "Appetite ratings"
      key_findings:
        - "EBIP: 30% significantly lower energy intake over post-lunch period vs control pudding"
        - "No significant difference in postprandial hormonal responses or appetite ratings between conditions"
        - "Trend toward higher GLP-1 response following EBIP (not statistically significant)"
      mechanism: "Targeted GI-tract bitter compound release via encapsulation; proposed GLP-1 mediated satiety signaling"
      conclusion: "Microencapsulated bitter secoiridoids from G. lutea reduce daily energy intake in healthy humans; encapsulation required for GI delivery (unencapsulated bitter compounds act cephalically)"
      notes: "Healthy volunteers only; primary endpoint is food intake, not GI complaint treatment; extract preparation and exact G. lutea batch not fully specified"

  - citation:
      authors: "McMullen MK, Whitehouse JM, Whitton PA, Towell A"
      title: "Bitter tastants alter gastric-phase postprandial haemodynamics"
      journal: "Journal of Ethnopharmacology"
      year: 2014
      volume: "154"
      issue: "3"
      pages: "719-727"
      pmid: "24802704"
      doi: "10.1016/j.jep.2014.04.041"
      url: "https://pubmed.ncbi.nlm.nih.gov/24802704/"
    study_details:
      study_type: "Randomized controlled trial"
      design: "Parallel-group RCT measuring postprandial hemodynamics"
      participants_flavored_water: 12  # for gentian-flavored water arms
      participants_encapsulated: 14   # for encapsulated tastant arm
      population: "Healthy adults"
      interventions:
        - "Gentian root (Gentiana lutea) 500 mg in flavored water"
        - "Gentian root 1500 mg in flavored water"
        - "Gentian root 1000 mg encapsulated (cellulose capsule)"
        - "Wormwood herb 500 mg / 1500 mg in flavored water (comparator bitter herb)"
        - "Cellulose placebo capsules + water"
      outcomes: "Blood pressure, cardiac contraction force, heart rate, peripheral vascular resistance, stroke volume, cardiac output during gastric phase of digestion"
      key_findings:
        - "Gentian flavored water (500 and 1500 mg): significantly increased peripheral vascular resistance"
        - "Gentian flavored water: significantly decreased cardiac output, primarily by reducing stroke volume"
        - "Wormwood 1500 mg flavored water: similar hemodynamic response to gentian"
        - "Encapsulated gentian 1000 mg: no additional hemodynamic effects beyond water alone"
      interpretation: "Cephalic-phase sympathetically-mediated response triggered by bitter taste at oral/pharyngeal receptors; gut bitter receptors alone insufficient to trigger response in encapsulated form"
      conclusion: "Bitter tastants from gentian root alter postprandial hemodynamics via a cephalic-phase reflex; flavor contact with oral mucosa required for effect"
      notes: "Surrogate endpoint (hemodynamics) not a clinical outcome; mechanistic study not a clinical efficacy trial"

  - citation:
      authors: "Wölfle U, Haarhaus B, Seiwerth J, Cawelius A, Schwabe K, Quirin KW, Schempp CM"
      title: "The Herbal Bitter Drug Gentiana lutea Modulates Lipid Synthesis in Human Keratinocytes In Vitro and In Vivo"
      journal: "International Journal of Molecular Sciences"
      year: 2017
      volume: "18"
      issue: "8"
      pages: "1814"
      pmid: "28829355"
      pmcid: "PMC5578200"
      doi: "10.3390/ijms18081814"
      url: "https://pubmed.ncbi.nlm.nih.gov/28829355/"
    study_details:
      study_type: "Combined in vitro and clinical study (placebo-controlled half-side comparison)"
      clinical_component:
        design: "Placebo-controlled half-side comparison (two different forearms)"
        participants: 33  # adult volunteers
        population: "Healthy adults"
        intervention: "5% Gentiana lutea extract cream applied to one volar forearm twice daily for 2 weeks"
        comparator: "Placebo cream on contralateral forearm"
        primary_outcome: "Skin lipid content (sebumeter)"
        key_findings:
          - "Treated skin: significantly increased lipid content vs placebo (p < 0.01, sebumeter measurement)"
      in_vitro_findings:
        - "G. lutea extract significantly increased lipid synthesis in human keratinocytes (Nile Red labeling)"
        - "Gas chromatography confirmed increased triglycerides in treated cells"
        - "Induced ceramide synthase 3 expression"
        - "Effect blocked by p38 MAPK and PPARγ pathway inhibitors"
        - "Bitter taste receptor TAS2R38 identified as likely initiating receptor"
      active_constituent: "Amarogentin identified as key active compound binding to bitter taste receptors TAS2R1 and TAS2R38 in keratinocytes"
      proposed_application: "Dry skin, atopic eczema — conditions with impaired epidermal barrier"
      conclusion: "G. lutea extract enhances epidermal lipid synthesis in humans via bitter receptor-mediated p38 MAPK/PPARγ signaling; potential therapeutic use in barrier-impaired skin conditions"

  - citation:
      authors: "Berthon JY, Cabannes M, Bouton C, Carre M, Bridon E, Filaire E"
      title: "In vitro, ex vivo and clinical approaches to evaluate the potential effect of Gentiana lutea extract on skin"
      journal: "International Journal of Cosmetic Science"
      year: 2023
      volume: null
      issue: null
      pages: null
      pmid: "37365865"
      doi: "10.1111/ics.12878"
      url: "https://pubmed.ncbi.nlm.nih.gov/37365865/"
    study_details:
      study_type: "Multi-phase investigation: in vitro, ex vivo, and clinical"
      clinical_component:
        design: "Split-face controlled clinical study (eye area)"
        participants: 22  # Caucasian subjects aged 43-64
        population: "Healthy adults (cosmetic trial)"
        intervention: "Cream containing G. lutea extract (GIE; gentiopicroside 147 μg/mL) applied twice daily for 14 days to eye area"
        comparator: "Placebo cream on contralateral side (split-face)"
        primary_outcomes: "Skin roughness (upper eyelid), redness of dark circles"
        key_findings:
          - "Significantly reduced average roughness and relief of upper eyelid skin after 14 days"
          - "Significantly reduced redness of dark circles after 14 days"
          - "No irritation of eyelid area observed"
      in_vitro_molecular_findings:
        - "GIE upregulated NFE2L2 gene expression (anti-oxidative transcription factor)"
        - "GIE downregulated CXCL8 expression (IL-8 cytokine; anti-inflammatory)"
        - "Targeted advanced glycation end-product (AGE) pathways"
        - "Reduced pseudotube formation"
      active_constituent_tested: "Gentiopicroside at 147 μg/mL in final cream"
      conclusion: "G. lutea extract demonstrated measurable improvement in periorbital skin quality via anti-oxidant and anti-inflammatory mechanisms; potential cosmetic anti-aging application"
      limitation: "Cosmetic endpoint only; n=22; no GI or systemic health outcomes"

# Clinical Trials — Combination Products (Gentian as Component)
combination_clinical_trials:
  - citation:
      authors: "Neubauer N, März RW"
      title: "Placebo-controlled, randomized double-blind clinical trial with Sinupret® sugar coated tablets on the basis of a therapy with antibiotics and decongestant nasal drops in acute sinusitis"
      journal: "Phytomedicine"
      year: 1994
      volume: "1"
      issue: "3"
      pages: "177-181"
      pmid: "23195935"
      doi: "10.1016/S0944-7113(11)80061-9"
      url: "https://pubmed.ncbi.nlm.nih.gov/23195935/"
    study_details:
      study_type: "Randomized, double-blind, placebo-controlled trial"
      participants: 160
      population: "Patients with acute bacterial sinusitis"
      intervention: "Sinupret® (BNO-101) as adjunct to standard antibiotics + nasal decongestants"
      comparator: "Placebo + antibiotics + nasal decongestants"
      sinupret_composition: "Gentian root 6 mg, cowslip flowers 18 mg, sour dock herb 18 mg, elder flowers 18 mg, vervain herb 18 mg per tablet"
      dosing: "Sinupret sugar-coated tablets 3 × 2 daily (standard adult dose)"
      key_findings:
        - "Sinupret significantly improved clinical signs and radiographic findings vs placebo"
        - "Conventional therapy 'markedly improved' when Sinupret added to standard treatment"
        - "Good correlation between clinical signs, radiographic findings, and patient assessment"
      conclusion: "Sinupret is a useful adjunct to antibiotics and decongestants for acute bacterial sinusitis; results support traditional use of gentian-containing bitters for upper respiratory tract conditions"
      limitation: "Gentian (6 mg/tablet) is 1 of 5 components; no isolation of individual herb effect"

  - citation:
      authors: "Reden J, El-Hifnawi D, Zahnert T, Hummel T"
      title: "The effect of a herbal combination of primrose, gentian root, vervain, elder flowers, and sorrel on olfactory function in patients with a sinonasal olfactory dysfunction"
      journal: "Rhinology"
      year: 2011
      volume: "49"
      issue: "3"
      pages: "342-346"
      pmid: "21858267"
      doi: "10.4193/Rhino10.151"
      url: "https://pubmed.ncbi.nlm.nih.gov/21858267/"
    study_details:
      study_type: "Randomized, double-blind, placebo-controlled trial"
      design: "Double-blind, two-arm parallel trial following 7 days of initial oral prednisolone in all participants"
      population: "Patients with sinonasal olfactory dysfunction"
      intervention: "Sinupret® (containing primrose, gentian root, vervain, elder flowers, sorrel)"
      comparator: "Placebo"
      followup: "2 months"
      outcome: "Olfactory function (Sniffin' Sticks standardized olfactory test)"
      key_findings:
        - "No statistically significant differences in olfactory function between Sinupret and placebo"
        - "Both groups showed improvement post-steroid therapy; no additive benefit from Sinupret"
      conclusion: "Sinupret conferred no significant benefit for olfactory function beyond steroid therapy alone; gentian combination does not appear to restore olfaction in sinonasal dysfunction"

# Pilot and Feasibility Studies
pilot_studies:
  - citation:
      authors: "Sanatani M, Younus J, Stitt L, Malik N"
      title: "Tolerability of the combination of ginger (Zingiber officinalis), gentian (Gentiana lutea) and turmeric (Curcuma longa) in patients with cancer-associated anorexia"
      journal: "Journal of Complementary and Integrative Medicine"
      year: 2015
      volume: "12"
      issue: "1"
      pages: "57-60"
      pmid: "25324460"
      doi: "10.1515/jcim-2013-0064"
      url: "https://pubmed.ncbi.nlm.nih.gov/25324460/"
    study_details:
      study_type: "Pilot feasibility study"
      design: "Two-arm pilot study; Arm 1 (n=17): triple combination; Arm 2 (n=3): dual combination without gentian"
      participants: 20
      population: "Patients with cancer-associated anorexia"
      arm_1_intervention:
        turmeric: "1 g twice daily"
        ginger: "1 g twice daily"
        gentian: "1 mL tincture three times daily (total 3 mL/day)"
      arm_1_duration: "14 days"
      completion_rate: "41% of Arm 1 completed full 14-day treatment (7 of 17 patients)"
      early_discontinuation: "41% stopped early due to unacceptable toxicity or patient-initiated withdrawal"
      adverse_events:
        - "Nausea (6 patients)"
        - "Vomiting (3 patients)"
        - "Fatigue (3 patients)"
        - "Diarrhea (2 patients)"
        - "Bloating (2 patients)"
      efficacy: "No statistically significant improvement in appetite (visual analogue scale)"
      conclusion: "Triple combination of ginger, gentian, and turmeric not well tolerated in cancer patients at tested doses; lower doses or fewer agents warranted in future studies"
      notes: >
        Cannot attribute poor tolerability specifically to gentian vs ginger/turmeric; gentian tincture
        dose (3 mL/day) is within standard therapeutic range. Cancer patients are not representative
        of the general population for whom gentian is traditionally used.

# Case Reports
case_reports:
  - citation:
      authors: "Wiedermann CJ, Scheer M, Pycha A"
      title: "Gentian root bitters for the rapid suppression of post-propofol singultus: a case report"
      journal: "Wiener Klinische Wochenschrift"
      year: 2025
      pmid: "40900241"
      doi: "10.1007/s00508-025-02607-6"
      url: "https://pubmed.ncbi.nlm.nih.gov/40900241/"
    study_details:
      study_type: "Case report"
      patient: "70-year-old male with persistent hiccups following minor urologic surgery (post-propofol singultus)"
      intervention: "Self-administered approximately 20 mL of traditional gentian schnapps (Gentiana lutea root bitters)"
      outcome: "Complete cessation of hiccups within 1 minute of administration; effect reproducible on 2 subsequent recurrences the same day; no further episodes after third administration"
      prior_treatment: "Unresponsive to metoclopramide"
      mechanism_proposed: "Bitter taste receptor activation may modulate hiccup reflex arc via cranial nerve pathways"
      limitations:
        - "Single case; spontaneous resolution cannot be excluded"
        - "Alcohol content of schnapps may contribute"
        - "No blinding or placebo control"
      significance: "First published case report suggesting gentian bitters for singultus; generates hypothesis for controlled study"

# Pharmacokinetics (Animal Studies — No Human PK Data Available)
pharmacokinetics:
  - citation:
      authors: "Wang CH, Cheng XM, Bligh SWA, White KN, Branford-White CJ, Wang ZT"
      title: "Pharmacokinetics and bioavailability of gentiopicroside from decoctions of Gentianae and Longdan Xiegan Tang after oral administration in rats—comparison with gentiopicroside alone"
      journal: "Journal of Pharmaceutical and Biomedical Analysis"
      year: 2007
      volume: "43"
      issue: "5"
      pages: "1620-1625"
      pmid: "17560062"
      doi: "10.1016/j.jpba.2007.04.036"
      url: "https://pubmed.ncbi.nlm.nih.gov/17560062/"
    study_details:
      study_type: "Animal pharmacokinetic study (rats)"
      species: "Rat"
      compound_studied: "Gentiopicroside (GPS)"
      key_findings:
        GPS_alone:
          - "Cmax: 5.78 ± 2.24 μg/mL"
          - "Tmax: 0.75 ± 0.62 hours"
          - "Elimination half-life: 3.35 ± 0.76 hours"
          - "AUC: 32.7 ± 12.9 μg·h/mL"
        gentian_decoction:
          - "Elimination half-life: 6.21 ± 3.07 hours"
          - "AUC: 70.0 ± 13.9 μg·h/mL (markedly higher than GPS alone)"
        longdan_xiegan_tang_formula:
          - "Two-compartment kinetics"
          - "Elimination half-life: 3.83 ± 1.54 hours"
          - "AUC: 19.1 ± 5.9 μg·h/mL (markedly reduced vs decoction alone)"
        matrix_effect: "GPS bioavailability from whole decoction significantly superior to purified GPS; multi-ingredient formula significantly reduces GPS bioavailability"
      conclusion: "Marked variability in GPS pharmacokinetics depending on formulation; decoction matrix enhances bioavailability vs pure compound; polypharmacy formula reduces it"
      human_relevance: "Animal data only; no human PK studies exist for G. lutea extracts or GPS"

# Regulatory Monographs and Pharmacopoeia
regulatory_documents:
  - authority: "European Medicines Agency (EMA) / Committee on Herbal Medicinal Products (HMPC)"
    title: "European Union Herbal Monograph on Gentiana lutea L., radix"
    document_number: "EMA/HMPC/607861/2017"
    assessment_report: "EMA/HMPC/607863/2017"
    year: 2019
    month: "April"
    url: "https://www.ema.europa.eu/en/medicines/herbal/gentianae-radix"
    assessment_url: "https://www.ema.europa.eu/en/documents/herbal-report/assessment-report-gentiana-lutea-l-radix-revision-1_en.pdf"
    addendum: "EMA/HMPC/3544/2025 (Addendum, published 30/04/2025)"
    evidence_type: "Traditional-use registration (NOT well-established use)"
    rationale_for_traditional_use: >
      Evidence of plausible use for ≥30 years (including ≥15 years within EU) but insufficient
      clinical trial data for well-established use status.
    approved_indications:
      traditional_use:
        - "Temporary loss of appetite"
        - "Mild stomach and gut complaints (e.g., indigestion)"
    dosing:
      comminuted_herbal_substance: "0.6–6 g per day (as infusion, decoction, or maceration)"
      note: "Specific daily dose depends on preparation type; 0.6–6 g range covers all recommended preparations"
    safety:
      adverse_effects: "Occasional headache (known from traditional use)"
      contraindications:
        - "Gastric or duodenal ulcer"
        - "Gastro-oesophageal reflux disease"
        - "Hypersensitivity to gentian or other Gentianaceae family plants"
        - "Children and adolescents under 18 years (insufficient data)"
        - "Pregnancy and breastfeeding (insufficient data)"
      drug_interactions: "None known from traditional use"
    content_type: "Full regulatory monograph with quality standards, indications, dosing, contraindications"
    note: >
      The EMA cited a single uncontrolled observational study of 205 patients (dyspepsia, 120 mg
      dry extract 2-3 times daily for 15 days; improvement in 86% of patients) as supportive
      traditional-use evidence, but this study was insufficient for well-established use status
      due to absence of control group. No RCTs in the approved indication were available at the
      time of assessment.

