    status: "No dedicated WHO monograph identified for Gentiana lutea in WHO Monographs on Selected Medicinal Plants (Volumes 1–4)"
    note: >
      WHO Selected Medicinal Plants series (1999–2009) does not include a specific monograph for
      Gentiana lutea radix. Some older WHO sources reference gentian root in traditional medicine
      contexts, but no formal WHO monograph has been published as of 2026-02-27.

# Dosing and Standardization
dosing_information:
  traditional_dosing:
    primary_sources: "EMA HMPC Monograph EMA/HMPC/607861/2017 (2019); German Commission E (1985/1990)"
    preparations:
      - preparation: "Dried root infusion/decoction (comminuted)"
        dose_range: "0.6–6 g per day (EMA range)"
        typical_dose: "1–3 g per day (Commission E; typical clinical range)"
        notes: "Steep ~1 g in 150 mL boiling water for 10-15 minutes; cold maceration 8-10 hours also used"
        timing: "30 minutes before meals for appetite stimulation; after meals for digestive support"
      - preparation: "Tincture"
        typical_dose: "1–3 mL three times daily"
        notes: "Pilot clinical data: 1 mL tincture 3× daily in cancer patients (Sanatani 2015)"
      - preparation: "Dry extract"
        typical_dose: "120 mg 2-3× daily (as used in EMA-referenced uncontrolled observational study)"
        notes: "Product used in EMA-cited observational study of 205 dyspepsia patients"
  combination_product_dosing:
    - product: "Sinupret® (BNO-101) standard tablet"
      gentian_content: "6 mg dried gentian root per tablet"
      adult_dose: "2 tablets three times daily (total 36 mg gentian root/day)"
      indication: "Acute and chronic sinusitis (as adjunct to standard treatment)"
    - product: "Sinupret Forte"
      gentian_content: "12 mg dried gentian root per tablet"
      adult_dose: "1 tablet three times daily"
  research_dosing:
    - study: "Mennella et al. 2016 (energy intake)"
      preparation: "Microencapsulated secoiridoids 100 mg total (single dose at breakfast)"
      population: "Healthy adults"
    - study: "McMullen et al. 2014 (hemodynamics)"
      preparation: "500 mg and 1500 mg gentian root in flavored water; 1000 mg encapsulated"
      population: "Healthy adults"
    - study: "Wölfle et al. 2017 (skin)"
      preparation: "5% G. lutea extract cream, topical"
      population: "Healthy adults (forearm skin)"
  standardization:
    marker_compounds:
      - name: "Gentiopicroside"
        role: "Primary secoiridoid bitter; gastroprotective, hepatoprotective, anti-inflammatory"
        ph_eur_minimum: "≥0.3% in dried root (HPLC)"
        typical_content: "0.6–3.5% of root dry weight"
      - name: "Amarogentin"
        role: "Intensely bitter secoiridoid; primary bitterness contributor despite low concentration"
        typical_content: "0.025–0.05% of root dry weight"
        bitterness: "~8000× more bitter than quinine by bitterness index"
      - name: "Swertiamarin"
        role: "Additional secoiridoid with pharmacological activity"
        typical_content: "Present in root; less quantified commercially"
    bitterness_standard:
      test: "European Pharmacopoeia bitterness test"
      minimum_value: "≥10,000 bitterness units"
      note: "Bitterness test is the quality-defining assay for gentian root as a bitter digestive herb"

# Key Research Gaps
research_needs:
  - "No RCTs published for gentian monotherapy in any GI indication (appetite stimulation, dyspepsia, bloating, flatulence)"
  - "The single EMA-cited observational study (n=205, 15 days) lacks control group; re-analysis or RCT replication urgently needed"
  - "Human pharmacokinetic studies for whole gentian extract or purified gentiopicroside/amarogentin do not exist"
  - "Oral bioavailability of gentiopicroside and amarogentin in humans is unknown"
  - "Dose-finding studies for specific indications (appetite stimulation, dyspepsia) in humans"
  - "Long-term safety data beyond EMA traditional-use review"
  - "Interaction potential with PPIs, H2 blockers, and other acid-modifying agents"
  - "Standardized extract with defined gentiopicroside/amarogentin percentages not yet established for clinical trials"
  - "Head-to-head comparison with other bitters (wormwood, artichoke) for GI efficacy"
  - "Clinical trials to separate gentian contribution from other components in Sinupret"

# Summary Points
summary:
  clinical_evidence:
    primary_indications_gi:
      - "NO RCTs exist for gentian monotherapy in digestive complaints (appetite, dyspepsia, bloating)"
      - "EMA 2019: traditional-use only (not well-established use) — based on ≥30 years documented use"
      - "EMA cited one uncontrolled study (n=205 dyspepsia patients, 120 mg dry extract 2–3×/day, 15 days; 86% improved) — no control arm"
      - "Commission E positive monograph (1985/1990) for appetite, dyspepsia, bloating, flatulence — based on traditional evidence"
    skin_and_cosmetic:
      - "Half-side RCT (n=33): 5% G. lutea extract cream significantly increased epidermal lipid content (p<0.01) vs placebo over 2 weeks (Wölfle 2017)"
      - "Split-face study (n=22): topical extract (gentiopicroside 147 μg/mL) significantly reduced upper eyelid roughness and dark circle redness over 14 days (Berthon 2023)"
    energy_intake:
      - "Crossover RCT (n=20 healthy adults): microencapsulated secoiridoids (100 mg, from G. lutea) reduced post-lunch energy intake by 30% vs control pudding (Mennella 2016)"
    hemodynamics:
      - "RCT (n=12): gentian root 500–1500 mg in flavored water increased peripheral vascular resistance and decreased cardiac output via cephalic-phase bitter reflex (McMullen 2014); encapsulated form had no effect"
    sinupret_combination:
      - "Systematic review (6 trials, ~900 patients): Sinupret (1 of 5 components is gentian root 6 mg/tablet) significantly superior to placebo for sinusitis cure rate (61.1% vs 34.5%) (Melzer 2006)"
      - "RCT (n=160): Sinupret + antibiotics significantly outperformed antibiotics alone for acute sinusitis (Neubauer 1994)"
    negative_findings:
      - "RCT (n=unknown): Sinupret showed no significant benefit for olfactory function in sinonasal dysfunction vs placebo (Reden 2011)"
      - "Pilot study (n=17): ginger + gentian + turmeric combination poorly tolerated in cancer patients (41% completion; significant nausea, vomiting, fatigue) (Sanatani 2015)"

  safety_profile:
    general: "Good safety record from traditional use; Commission E and EMA identify only 'occasional headache' as known adverse effect"
    contraindications:
      - "Gastric or duodenal ulcer (bitter stimulation could exacerbate)"
      - "Gastro-oesophageal reflux disease (EMA 2019)"
      - "Pregnancy and breastfeeding (insufficient data)"
      - "Children under 18 years (insufficient data)"
    tolerability: "Poorly tolerated in cancer patients with anorexia when combined with ginger and turmeric (Sanatani 2015); not generalizable to healthy adults"
    drug_interactions: "None identified in monographs or clinical literature"
    hepatotoxicity: "No human hepatotoxicity cases identified; preclinical evidence suggests hepatoprotective properties; no significant safety signals in traditional use"
    genotoxicity_concern: "Gentiopicroside showed genotoxic activity against eukaryotic cells in one in vitro study; structural analysis suggests weak similarity to established genotoxic agents; clinical relevance unknown"

  pharmacokinetics:
    human_data: "No human pharmacokinetic studies identified for G. lutea extracts, gentiopicroside, or amarogentin"
    animal_data:
      - "GPS oral bioavailability in mice: ~39.6%; Tmax 0.50 hours"
      - "GPS in rat (pure compound): Cmax 5.78 μg/mL, Tmax 0.75 h, t½ 3.35 h, AUC 32.7 μg·h/mL"
      - "GPS from whole gentian decoction: AUC 70.0 μg·h/mL — significantly higher bioavailability than purified GPS (matrix effect)"
    stability: "GPS: 34.4% degradation after 48 hours in simulated intestinal fluid"
    notes: "Oral bioavailability substantially enhanced by whole-plant decoction matrix vs purified compound; clinical implications of encapsulated vs oral liquid forms documented in hemodynamic studies"

