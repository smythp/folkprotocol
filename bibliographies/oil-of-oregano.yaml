# Key Research Gaps
research_needs:
  - "Human pharmacokinetic studies measuring plasma carvacrol/thymol after oral oil of oregano supplements"
  - "Larger, independently replicated RCT for rhinosinusitis (following up Qaraaty 2020 and Hoang 2023 network meta-analysis findings)"
  - "RCTs using whole oregano oil preparations (not pure carvacrol) to translate carvacrol trial findings to commercial products"
  - "Dose-finding RCTs comparing carvacrol concentrations in oregano oil (50% vs 75% vs 86%) for therapeutic equivalence"
  - "RCTs evaluating oil of oregano for H. pylori eradication (following up HerbELICO case study)"
  - "Controlled clinical trial for enteric parasites (controlled follow-up to Force et al. 2000)"
  - "Long-term safety data (>2 months) in humans"
  - "Head-to-head comparison of standardized vs unstandardized preparations"
  - "Drug interaction studies in humans (anticoagulants, CYP2A6 substrates)"
  - "Bioavailability comparison of emulsified vs non-emulsified preparations in humans"
  - "Clinical trials for respiratory infections (in vitro antiviral data not validated in humans)"
  - "WHO/Commission E monograph assessment for O. vulgare essential oil"
  - "Phase III carvacrol trials to confirm respiratory benefits from Phase II data"

# Summary Points
summary:
  clinical_evidence:
    - "Limited but growing human RCT evidence for oregano oil and its primary constituent carvacrol"
    - "Oregano oil RCTs (whole oil/extract): 3 identified (rhinosinusitis n=75; antioxidant/safety n=45; exercise n=24)"
    - "Oregano oil clinical studies (non-RCT): metabolic syndrome (n=106), antiparasitic (n=14), H. pylori blend (n=15)"
    - "Carvacrol-specific RCTs (primary constituent): 5 identified — Phase I safety (healthy n=~20), 2 asthma trials (n=23, n=33), 2 sulfur mustard lung trials (n=20, n=21)"
    - "Rhinosinusitis systematic review/network meta-analysis (Hoang 2023): 47 RCTs; Origanum vulgare ranked #1 among 18 herbals for CRSsNP (low certainty)"
    - "Carvacrol respiratory systematic review/meta-analysis (Carvalho 2020): 5 human studies, 12 animal studies; significant anti-inflammatory and antioxidant evidence"
    - "Multi-ingredient herbal SIBO trial (Chedid 2014) supports herbal antimicrobials broadly; oregano contribution not isolated"

  safety:
    - "Excellent safety record: LiverTox Likelihood Score E (unlikely hepatotoxic)"
    - "FDA GRAS for food use; no cases in major DILI registries"
    - "Rat NOAEL 200 mg/kg/day (EFSA); large safety margin for typical human doses"
    - "Key contraindication: pregnancy (abortifacient); avoid medicinal doses during lactation"
    - "GI side effects (heartburn, nausea) reported at higher doses"
    - "Contact dermatitis in sensitive individuals (Lamiaceae family allergy)"
    - "Animal data suggest possible hormonal/drug interference at chronic high doses"

  bioavailability:
    - "No human PK studies for oral oil of oregano identified"
    - "Carvacrol metabolized primarily by CYP2A6 in humans"
    - "High volatility and low water solubility limit absorption; emulsification likely improves this"
    - "Absorption confirmed indirectly (Nurmi 2006: increased urinary phenolic excretion)"

  regulatory_status:
    - "No EU herbal monograph (EMA/HMPC) for O. vulgare essential oil"
    - "No Commission E monograph for O. vulgare essential oil"
    - "European Pharmacopoeia quality standard exists (Ph. Eur. 01/2008:1880): min 25 mL/kg oil, min 60% carvacrol+thymol"
    - "FDA GRAS for food flavoring"
    - "Health Canada recognizes as NHP for antioxidant and digestive use"

