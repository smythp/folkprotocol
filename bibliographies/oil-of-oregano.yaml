      url: "https://pubmed.ncbi.nlm.nih.gov/30486682/"
    study_details:
      design: "Phase I clinical trial, randomized, parallel-group"
      study_type: "Safety and tolerability"
      participants: "Not stated in abstract; two treatment groups"
      population: "Healthy subjects"
      groups:
        - "Carvacrol 1 mg/kg/day for 1 month"
        - "Carvacrol 2 mg/kg/day for 1 month"
      duration: "1 month"
