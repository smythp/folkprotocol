---
herb: Oil of Oregano
scientific_name: "Origanum vulgare L. (common oregano; also O. vulgare subsp. hirtum for high-carvacrol Mediterranean types)"
common_names:
  - "Oil of oregano"
  - "Oregano essential oil"
  - "Mediterranean oregano"
  - "Wild marjoram"
  - "Greek oregano"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-28
notes_on_scope: >
  Oil of oregano refers to the steam-distilled or cold-pressed essential oil and its
  emulsified preparations, distinguished from dried herb and aqueous extracts. The principal
  bioactive constituents are carvacrol and thymol (monoterpenoid phenols). Commercial products
  vary enormously: high-carvacrol types (O. vulgare subsp. hirtum, ≥70% carvacrol) dominate
  therapeutic use; common oregano (subsp. vulgare) contains far less. The European Pharmacopoeia
  sets a minimum standard of 60% combined carvacrol + thymol. Human RCT evidence is sparse;
  most mechanistic and antimicrobial data come from in vitro or animal models. No WHO or
  Commission E monograph exists specifically for O. vulgare essential oil (related monographs
  cover O. majorana and O. dictamnus). FDA classifies oregano as GRAS as a food flavoring.

# Randomized Controlled Trials (Human)
clinical_trials:
  - citation:
      authors: "Nurmi A, Mursu J, Nurmi T, Nyyssönen K, Alfthan G, Hiltunen R, Kaikkonen J, Salonen JT, Voutilainen S"
      title: "Consumption of juice fortified with oregano extract markedly increases excretion of phenolic acids but lacks short- and long-term effects on lipid peroxidation in healthy nonsmoking men"
      journal: "Journal of Agricultural and Food Chemistry"
      year: 2006
      volume: "54"
      issue: "16"
      pages: "5875-5884"
      pmid: "16881679"
      doi: "10.1021/jf060058b"
      url: "https://pubmed.ncbi.nlm.nih.gov/16881679/"
    study_details:
      design: "Randomized, double-blind, parallel-group controlled trial"
      participants: 45  # healthy nonsmoking men
      population: "Healthy adult males"
      groups: 3  # placebo / low dose / high dose
      intervention:
        low_dose: "Mango-orange juice enriched with 300 mg/day total phenolic compounds from oregano extract"
        high_dose: "Mango-orange juice enriched with 600 mg/day total phenolic compounds from oregano extract"
        placebo: "Plain mango-orange juice"
      duration: "4 weeks"
      primary_outcomes:
        - "Urinary phenolic acid excretion: markedly increased in the 600 mg/day group vs placebo (specific fold-change not reported in abstract)"
        - "Serum lipid peroxidation (MDA/TBARS): no significant changes in either oregano group vs placebo"
      secondary_outcomes:
        - "Serum lipids: no significant changes"
        - "Safety biomarkers (liver enzymes, renal markers): no significant changes at either dose"
      safety: "No adverse effects reported; no changes in safety parameters at 300 or 600 mg/day for 4 weeks"
      extract_type: "Aqueous/ethanolic oregano phenolic extract standardized to total phenolics (not defined as essential oil)"
      key_finding: "Oregano phenolic extract is absorbed (increased urinary phenolic output) but does not reduce lipid peroxidation in healthy men at these doses"

  - citation:
      authors: "Qaraaty M, Kamaneh SA"
      title: "Effect of oregano oil (Origanum vulgare L.) on chronic rhinosinusitis: A randomized, double-blind, clinical trial"
      journal: "Indian Journal of Traditional Knowledge (IJTK)"
      year: 2020
      volume: "19"
      issue: "2"
      doi: "10.56042/ijtk.v19i2.35368"
      url: "https://www.cochranelibrary.com/content?templateType=related&urlTitle=/central/doi/10.1002/central/CN-02183755"
      cochrane_id: "CN-02183755"
    study_details:
      design: "Randomized, double-blind, three-arm controlled clinical trial"
      participants: 75  # adults with chronic rhinosinusitis without nasal polyps
      population: "Adults with chronic rhinosinusitis (CRS without nasal polyps); Otolaryngology Clinic, Fifth Azar Hospital, January 30 – June 25, 2018"
      groups: 3
      intervention:
        oregano_group: "Nasal spray containing oregano oil (Origanum vulgare L.)"
        active_control: "Nasal spray containing fluticasone (standard pharmacotherapy)"
        placebo: "Nasal spray containing sesame oil"
      duration: "4 weeks"
      primary_outcome: "SNOT-22 symptom score reduction"
      key_outcomes:
        - "Oregano group: mean SNOT-22 reduction of 51.52 points (95% CI: −55.79 to −47.24)"
        - "Fluticasone group: mean SNOT-22 reduction of 21.60 points (95% CI: −25.48 to −17.71)"
        - "Sesame oil (placebo) group: mean SNOT-22 reduction of 11.84 points (95% CI: −13.18 to −10.51)"
        - "Oregano oil superior to fluticasone and placebo for CRS symptoms"
      safety: "Not detailed in available abstract"
      limitations:
        - "Published in regional journal without PubMed indexing; independent replication needed"
        - "Short duration (4 weeks); no long-term follow-up"
        - "Mechanism of action (anti-inflammatory vs. antimicrobial) not established"
        - "Active comparator fluticasone showed less effect than oregano; unusual finding requiring replication"
      extract_type: "Nasal spray preparation of O. vulgare L. essential oil; standardization not specified"
      key_finding: "Oregano oil nasal spray produced greater SNOT-22 improvement than fluticasone in CRS without polyps; requires independent replication"

  - citation:
      authors: "Shirvani H, Bazgir B, Shamsoddini A, Saeidi A, Tayebi SM, Escobar KA, Laher I, VanDusseldorp TA, Weiss K, Knechtle B, Zouhal H"
      title: "Oregano (Origanum vulgare) Consumption Reduces Oxidative Stress and Markers of Muscle Damage after Combat Readiness Tests in Soldiers"
      journal: "Nutrients"
      year: 2022
      volume: "15"
      issue: "1"
      pages: "49"
      pmid: "36615794"
      pmcid: "PMC9823977"
      doi: "10.3390/nu15010049"
      url: "https://pubmed.ncbi.nlm.nih.gov/36615794/"
    study_details:
      design: "Randomized controlled trial, parallel-group"
      participants: 24  # healthy male soldiers; oregano n=12, placebo n=12
      population: "Healthy adult military males, mean age 24±3 years"
      intervention: "Single 500 mg capsule Origanum vulgare powder consumed immediately post-exercise (army combat readiness test)"
      comparator: "Placebo capsule"
      duration: "Single acute intervention; measurements at 4 timepoints (pre-exercise, immediately post, 60 min, 120 min)"
      primary_outcomes:
        - "Creatine kinase (CK): significantly lower in oregano group at 60 and 120 minutes post-exercise (p<0.0001)"
        - "Malondialdehyde (MDA): significantly reduced oxidative stress marker in oregano group (p<0.0001)"
        - "Total antioxidant capacity (TAC): significantly increased in oregano group (p<0.0001)"
        - "Superoxide dismutase (SOD): elevated post-intervention in oregano group"
        - "Glutathione peroxidase (GPX): elevated post-intervention in oregano group"
      safety: "No adverse effects reported"
      limitations:
        - "Single acute dose; no multi-dose or long-term data"
        - "Small sample (n=24), exclusively healthy young males"
        - "No blinding or allocation concealment details provided"
      extract_type: "Crude O. vulgare powder capsule; standardization not described"
      key_finding: "Single 500 mg oral dose of oregano powder attenuated exercise-induced oxidative stress and muscle damage markers"

