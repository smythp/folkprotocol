# Comparative Effectiveness Studies (Herbal Multi-Ingredient)
comparative_studies:
  - citation:
      authors: "Chedid V, Dhalla S, Clarke JO, Roland BC, Dunbar KB, Koh J, Justino E, Tomakin E, Mullin GE"
      title: "Herbal therapy is equivalent to rifaximin for the treatment of small intestinal bacterial overgrowth"
      journal: "Global Advances in Health and Medicine"
      year: 2014
      volume: "3"
      issue: "3"
      pages: "16-24"
      pmid: "24891990"
      pmcid: "PMC4030608"
      doi: "10.7453/gahmj.2014.019"
      url: "https://pubmed.ncbi.nlm.nih.gov/24891990/"
    study_details:
      design: "Comparative effectiveness trial with optional crossover for non-responders"
      participants: 104  # SIBO confirmed by lactulose breath testing; 67 rifaximin, 37 herbal
      population: "Adults with confirmed small intestinal bacterial overgrowth (SIBO)"
      intervention: "Herbal therapy (multi-ingredient botanical formulas; specific products included Dysbiocide and FC-Cidal by Biotics Research, containing berberine, oregano, thyme, and other botanicals)"
      comparator: "Rifaximin 1200 mg daily"
      duration: "4 weeks treatment + follow-up breath testing"
      key_outcomes:
        - "Herbal therapy: 46% negative follow-up breath test (17/37 patients)"
        - "Rifaximin: 34% negative follow-up breath test (23/67 patients)"
        - "Adjusted odds ratio 1.85 favoring herbs (p=0.17, non-significant)"
        - "Rifaximin non-responders given herbal rescue: 57% response rate (8/14)"
      safety:
        rifaximin_arm: "Anaphylaxis (1), hives (2), diarrhea (2), C. difficile (1)"
        herbal_arm: "Diarrhea (1 case); p=0.22 vs rifaximin (non-significant)"
      limitations:
        - "Not an RCT; non-random treatment assignment"
        - "Herbal products are multi-ingredient blends — cannot attribute effect to oregano alone"
        - "Non-significant primary endpoint"
      key_finding: "Herbal multi-ingredient therapy (containing oregano among other botanicals) was non-inferior to rifaximin for SIBO clearance; oregano contribution cannot be isolated"

