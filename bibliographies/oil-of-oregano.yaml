# Pharmacokinetics and Bioavailability
pharmacokinetics:
  - citation:
      authors: "Bajagai YS, Steel JC, Radovanovic A, Stanley D"
      title: "Prolonged continual consumption of oregano herb interferes with the action of steroid hormones and several drugs, and effects signaling across the brain-gut axis"
      journal: "Food & Function"
      year: 2021
      volume: "12"
      issue: "1"
      pages: "286-298"
      pmid: "33349823"
      doi: "10.1039/d0fo02755f"
      url: "https://pubmed.ncbi.nlm.nih.gov/33349823/"
    study_details:
      model: "Broiler chickens fed 2% oregano supplementation (long-term continual consumption); not a human study"
      design: "Randomized controlled animal feeding study with transcriptomic analysis"
      key_findings:
        - "Continual supplementation at high dietary levels (2%) altered microbiota-gut-brain axis signaling"
        - "Altered expression of genes targeted by registered drugs; potential to affect drug efficiency and side effects"
        - "Altered steroid hormone action through modified gene expression patterns"
        - "Authors challenge 'natural = safe' assumption: 'natural products such as oregano have the potential for little to no side-effects' is not supported at high prolonged doses"
      human_relevance: "Animal study; signals potential concern with chronic high-dose exposure; human drug interaction data absent"
      note: "Drug interactions with human pharmaceutical agents not characterized in vivo; CYP2A6 identified as major human carvacrol-metabolizing enzyme in vitro"

  - citation:
      authors: "Reference: EFSA FEEDAP Panel"
      title: "Summary: EFSA 90-day rat oral toxicity NOAEL data"
      note: >
        From EFSA 2017 safety assessment (PMC7009896 / EFSA Journal 2017): A 90-day rat oral
        toxicity study established a NOAEL of 200 mg/kg body weight per day for oregano essential
        oil (O. vulgare subsp. hirtum). Consumer exposure assessment via carvacrol as marker
        showed a margin of exposure of approximately 4,000 compared to safe thresholds,
        indicating substantial safety margins for typical consumer exposures.
      bioavailability_summary:
        - "Carvacrol: high lipophilicity; absorbed rapidly from GI tract; metabolized primarily by CYP2A6 (human); excreted as glucuronide and sulfate conjugates"
        - "Thymol: similar physicochemical behavior to carvacrol; CYP2B6 involved in metabolism"
        - "Emulsification significantly improves aqueous dispersibility and likely oral bioavailability (basis of emulsified oil products)"
        - "No human pharmacokinetic studies measuring plasma carvacrol concentrations after oral oil of oregano supplements identified"

