  - citation:
      authors: "Ghorani V, Alavinezhad A, Rajabi O, Mohammadpour AH, Boskabady MH"
      title: "Safety and tolerability of carvacrol in healthy subjects: a phase I clinical study"
      journal: "Drug and Chemical Toxicology"
      year: 2021
      epub: 2018
      volume: "44"
      issue: "2"
      pages: "195-202"
      pmid: "30486682"
