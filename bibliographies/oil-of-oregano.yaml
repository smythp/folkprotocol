    study_details:
      design: "Uncontrolled open-label clinical study"
      participants: 14  # adult patients with stool-confirmed enteric parasites
      population: "Adults with confirmed enteric parasitic infection"
      intervention: "600 mg/day emulsified oil of Mediterranean oregano (Oreganum vulgare)"
      comparator: "None (uncontrolled)"
      duration: "6 weeks"
      parasites_targeted:
        - "Blastocystis hominis"
        - "Entamoeba hartmanni"
        - "Endolimax nana"
      key_outcomes:
