# Dosing and Standardization
dosing_information:
  traditional_dosing:
    - preparation: "Dried root (oral)"
      dose_range: "1–5 g"
      frequency: "Three times daily"
      source: "WHO Monographs Volume 1 (1999)"
    - preparation: "Standardized root extract"
      glycyrrhizic_acid_content: "Typically 4–24% GA in root; extracts standardized to known GA content"
    - preparation: "DGL (deglycyrrhizinated licorice)"
      note: "GA removed; safer for prolonged GI use; lacks mineralocorticoid effects"

  clinical_trial_dosing:
    - study: "Raveendra et al. 2012 (functional dyspepsia)"
      preparation: "GutGard extract 75 mg twice daily (150 mg/day)"
      duration: "30 days"
      outcome: "Significant symptom reduction"
    - study: "Raj et al. 2025 (GERD)"
      preparation: "GutGard DGL standardized to glabridin ≥3.5% and total flavonoids ≥10%"
      duration: "28 days"
      outcome: "Significant improvement in heartburn and regurgitation"
    - study: "Nahidi et al. 2012 (hot flashes)"
      preparation: "Licorice root extract 330 mg three times daily (990 mg/day)"
      duration: "8 weeks"
      outcome: "Significant reduction in hot flash frequency and severity"
    - study: "Hooshmandi et al. 2024 (PCOS)"
      preparation: "Licorice extract 1.5 g/day"
      duration: "8 weeks"
      outcome: "Improved metabolic parameters"
    - study: "Ameri et al. 2023 (COVID-19)"
      preparation: "Licorice extract 760 mg three times daily (2280 mg/day)"
      duration: "7 days"
      outcome: "No clinical benefit; safe"
    - study: "Puram et al. 2013 (H. pylori)"
      preparation: "GutGard standardized G. glabra extract 150 mg once daily"
      duration: "60 days"
      outcome: "56% H. pylori eradication (stool antigen) vs 4% placebo"
    - study: "Hajiaghamohammadi et al. 2016 (H. pylori add-on)"
      preparation: "Licorice 380 mg twice daily + triple therapy"
      duration: "14 days"
      outcome: "83.3% vs 62.5% H. pylori eradication"
    - study: "Af Geijerstam et al. 2024 (blood pressure)"
      preparation: "100 mg glycyrrhizic acid/day (from commercial licorice)"
      duration: "2 weeks"
      outcome: "+3.1 mmHg systolic; significant renin/aldosterone suppression"

  safety_thresholds:
    noael: "2 mg/kg/day glycyrrhizic acid (van Gelderen et al. 2000)"
    proposed_adi: "0.2 mg/kg/day GA (= ~12 mg/day for 60 kg person; van Gelderen et al. 2000)"
    who_ema_limit: "≤100 mg GA/day (daily maximum; applies to foods and supplements)"
    caution_threshold: "≥100 mg/day GA produces measurable cardiovascular effects (Af Geijerstam et al. 2024)"
    symptomatic_dose: ">400 mg glycyrrhetinic acid/day consistently produces mineralocorticoid effects"
    note: "50 g licorice/day (75 mg glycyrrhetinic acid) consumed for 2 weeks can cause significant BP rise"

  standardization:
    primary_marker: "Glycyrrhizin (glycyrrhizic acid, GA)"
    secondary_markers:
      - "Glabridin (for G. glabra flavonoid standardization)"
      - "Total flavonoids (e.g., liquiritigenin, isoliquiritigenin)"
    dgl_standard: "DGL preparations: GA reduced to <2–3% (vs 4–24% in raw root)"
    ph_eur_standard: "≥4.0% glycyrrhizic acid (dry basis)"

# Key Research Gaps
research_needs:
  - "Long-duration RCTs (>8 weeks) for G. glabra alone in GI and other indications"
  - "Dose-finding studies establishing minimum effective dose for each clinical indication"
  - "Human pharmacokinetic studies on standardized G. glabra extracts at therapeutic doses (not just pure glycyrrhizin)"
  - "Direct head-to-head comparison of DGL vs whole-root licorice preparations for GI efficacy"
  - "Cardiovascular safety studies at doses used therapeutically (>100 mg GA/day)"
  - "Reassessment of WHO 100 mg GA/day threshold given Af Geijerstam et al. 2024 data"
  - "Clarification of species-specific clinical profiles (G. glabra vs G. uralensis)"
  - "Systematic review of licorice for PCOS and female endocrine disorders"
  - "Definitive RCTs for licorice in menopausal hot flashes with sufficient power"
  - "Drug interaction studies focusing on CYP3A4 and 11β-HSD substrates"

# Summary Points
summary:
  clinical_evidence:
    gastrointestinal:
      - "GutGard (G. glabra 75–150 mg/day DGL extract) reduces functional dyspepsia symptoms significantly vs placebo (n=50, 30 days)"
      - "GutGard DGL reduces GERD heartburn and regurgitation (n=200, 28 days, Phase III RCT)"
      - "Meta-analysis of 15 RCTs (n=1367): licorice reduces ALT by 15.63 U/L and AST by 7.37 U/L in primary liver disease"
      - "GutGard 150 mg/day for 60 days: 56% H. pylori eradication (stool antigen) vs 4% placebo (n=100, RCT)"
      - "Licorice 380 mg twice daily added to H. pylori triple therapy: eradication 83.3% vs 62.5% (n=120, RCT)"
      - "2025 meta-analysis (9 studies, n=618): licorice shows non-significant trend toward peptic ulcer healing (OR 0.60) and pain reduction (OR 0.52)"
      - "Intravenous glycyrrhizin (80–240 mg 3×/week) reduces ALT 26% vs 6% placebo in chronic HCV; no viral effect"
    oral_conditions:
      - "Topical licorice (1–5% patch, paste, mouthwash) reduces aphthous pain within 4 days and ulcer size by day 8 (6 trials, n=314)"
    endocrine:
      - "Licorice 3.5 g/day for 2 cycles reduces serum testosterone 27.8→17.5 ng/dL in women (p<0.05)"
      - "Licorice 990 mg/day reduces hot flash frequency and severity over 8 weeks (n=90)"
      - "Licorice increases cortisol availability in Addison's disease patients (cortisol/cortisone ratio 0.21→0.43)"
    metabolic:
      - "Meta-analysis (n=985): licorice reduces BMI (-0.150 kg/m²) and body weight (-0.433 kg)"
      - "1.5 g/day licorice extract improves metabolic parameters in PCOS (n=66, 8 weeks)"
    covid_19:
      - "2280 mg/day licorice extract: no clinical benefit on COVID-19 symptoms (n=60, 7 days); safe"

  safety_profile:
    primary_concern: "Pseudoaldosteronism (pseudohyperaldosteronism): hypertension, hypokalemia, suppressed RAAS"
    mechanism: "11β-HSD2 inhibition by glycyrrhetinic acid → cortisol accumulation → mineralocorticoid receptor activation"
    dose_threshold: "Effects observed at ≥100 mg GA/day; 2024 RCT shows measurable BP rise at this threshold"
    noael: "2 mg/kg/day GA (NOAEL, van Gelderen 2000)"
    who_ema_limit: "≤100 mg GA/day daily maximum"
    contraindications:
      - "Hypertension"
      - "Hypokalemia or diuretic use"
      - "Liver cirrhosis or cholestatic disorders"
      - "Renal impairment"
      - "Pregnancy (potential for premature labor)"
    duration_limit: "Prolonged use (>4 weeks) not recommended without medical supervision"
    dgl_safety: "DGL preparations avoid mineralocorticoid effects; preferred for long-term GI use"
    epimerism_safety: "18α-glycyrrhizinate (magnesium isoglycyrrhizinate) shows 74% lower ADR rate than 18β compound (meta-analysis)"
    severe_cases: "Case reports of rhabdomyolysis, paralysis, hypertensive emergencies, encephalopathy from excessive licorice"

  pharmacokinetics:
    glycyrrhizin_oral_ba: "Negligible intact oral bioavailability; pre-systemically hydrolyzed to glycyrrhetinic acid"
    metabolite: "Glycyrrhetinic acid (GE): 200–1000× more potent 11β-HSD2 inhibitor than GA"
    matrix_effect: "Licorice extract shows reduced bioavailability vs pure glycyrrhizin due to matrix interactions"
    gra_half_life: "11.5±1.2h (at 1000 mg GRA); 38.7±10.5h (at 1500 mg GRA) — biphasic, dose-nonlinear (Krähenbühl 1994)"
    dgl_pk: "DGL lacks GA and GE systemic effects; acts locally in GI tract"
    urinary_excretion: "Only minor fraction (0.31–0.67% GRA; <1% total) eliminated by urine"

  drug_interactions:
    documented:
      - "Warfarin: monitoring required (enzyme interactions)"
      - "Antihypertensives: licorice may blunt effect or worsen hypertension"
      - "Corticosteroids: additive potassium loss; potentiation"
      - "Diuretics (loop, thiazide): additive hypokalemia risk"
      - "Cortisone acetate: licorice increases cortisol availability (Addison's patients)"
    proposed:
      - "CYP3A4 substrates: licorice may affect metabolism (in vitro data)"
      - "Hormonal contraceptives: theoretical interaction via hormonal effects"

