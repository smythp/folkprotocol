  - "Yashtimadhu (Ayurvedic)"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-27
notes_on_scope: >
  Three species are commercially used: G. glabra (European standard), G. uralensis (dominant in
  Chinese medicine), and G. inflata. Regulatory monographs (WHO, EMA) cover all three. The principal
  active saponin is glycyrrhizin (glycyrrhizic acid, GA; 4–24% of dry root), which is hydrolyzed
  pre-systemically by intestinal microflora to glycyrrhetinic acid (GE) — the bioactive
  mineralocorticoid-active metabolite. Deglycyrrhizinated licorice (DGL) preparations have GA
  removed to eliminate mineralocorticoid effects. Clinical evidence spans GI conditions, liver
  disease, oral ulcers, endocrine effects (testosterone suppression, cortisol augmentation), and
  menopausal symptoms. Safety signals center on dose-dependent pseudoaldosteronism (hypertension,
  hypokalemia) from 11β-HSD2 inhibition; WHO safety threshold is ≤100 mg GA/day.

