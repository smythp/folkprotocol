dosing_summary:
  clinical_trial_doses:
    range: "250 mg–1,500 mg/day standardized extract"
    most_common_dose: "750–1,500 mg/day (extract)"
    tribestan_dose: "1,500 mg/day (6 × 250 mg tablets; ~675 mg/day furostanol saponins)"
    postmenopausal_women: "750 mg/day for 120 days"
    athletic_population: "770 mg/day (40% saponins) for 6 weeks"
  standardization:
    key_marker: "Furostanol saponins (particularly protodioscin)"
    tribestan_standard: "≥ 112.5 mg furostanol saponins per 250 mg tablet (≥ 45%)"
    typical_range_commercial: "40–45% furostanol saponins in standardized extracts"
  duration:
    most_studies: "30 days to 12 weeks"
    typical_minimum: "4–8 weeks for observable effects"
    postmenopausal_study: "120 days (4 months)"
  forms:
    standardized_extract: "Tribestan® (Sopharma); 250 mg tablets standardized to furostanol saponins"
    dried_extract: "Androsten® (250 mg dried extract per capsule)"
    granules: "Gokshura granules (Ayurvedic)"
    water_extract: "Traditional; associated with toxicity cases"

safety_profile_summary:
  at_standard_doses:
    adverse_effects:
      - "GI discomfort, nausea, dyspepsia (mild, transient)"
      - "No serious adverse events in major RCTs"
    serious_case_reports:
      - "Severe cholestatic jaundice + acute kidney injury (high dose, prolonged use)"
      - "Nephrotoxicity + hepatotoxicity + neurotoxicity (after 2 days of herbal water extract)"
      - "Rhabdomyolysis (CYP3A4 drug interaction with atorvastatin)"
      - "Priapism (72-hour duration; case report)"
  livertox_rating: "E* — Possible rare cause of liver injury at high doses or pre-existing disease"
  drug_interactions:
    cyp3a4_inhibition: "Moderate inhibitor; risk with statins (atorvastatin), immunosuppressants, and other CYP3A4 substrates"
  psa_monitoring:
    note: "One study found PSA increase from 1.4 to 1.7 (p = 0.007); monitoring recommended in men"
  contraindications:
    - "Pre-existing liver or kidney disease (cautionary)"
    - "Concurrent statin therapy (drug interaction risk)"
    - "Concurrent CYP3A4-metabolized medications"

evidence_summary:
  testosterone_in_eugonadal_men:
    verdict: "No effect"
    key_evidence: "Neychev 2005 (p > 0.05 all androgens); Santos 2014 (negative); Vilar Neto 2025 systematic review (8/10 studies no effect)"
  testosterone_in_hypogonadal_men:
    verdict: "Possible modest effect"
    key_evidence: "GamalEl Din 2019 (2.2 → 2.7 ng/dL, p < 0.001); Vilar Neto 2025 (2/10 studies showed 60–70 ng/dL increase)"
  erectile_dysfunction:
    verdict: "Probable benefit"
    key_evidence: "Suharyani 2025 meta-analysis (IIEF-5 MD 3.23 vs placebo); Kamenov 2017 (IIEF difference 2.70, p < 0.0001)"
  female_sexual_dysfunction:
    verdict: "Likely beneficial; mechanistically via free testosterone"
    key_evidence: "De Souza 2016 (FSFI improvements, P < 0.01); Vale 2018 (FSFI improvements, p < .001); Martimbianco 2020 systematic review"
  sperm_quality:
    verdict: "Probable benefit; evidence limited by methodology"
    key_evidence: "Sanagoo 2019 (6/7 studies positive); Salgado 2017 (sperm concentration, motility, liquefaction improved)"
  athletic_performance:
    verdict: "No clear benefit on most metrics; possible testosterone maintenance during training"
    key_evidence: "Fernández-Lázaro 2022 systematic review (no clear hormonal benefit); Fernández-Lázaro 2021 RCT (attenuated testosterone decline)"

research_gaps:
  identified_needs:
    - "No human pharmacokinetic data; only rat data on protodioscin (5.7% bioavailability)"
    - "No WHO or Commission E monographs; EMA could not establish traditional use monograph"
    - "Large sample size RCTs needed (most trials <100 participants)"
    - "Long-term safety studies (>3 months) lacking"
    - "Standardization across trials needed (preparation, dose, saponin content vary widely)"
    - "Bioavailability studies in humans comparing different extract standardizations"
    - "Head-to-head comparison of furostanol vs spirostanol standardized extracts"
    - "Systematic investigation of CYP3A4 inhibition and drug interaction magnitude"
    - "PSA monitoring studies in men using TT long-term"
