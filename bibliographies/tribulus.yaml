bioavailability_pharmacokinetics:
  - id: protodioscin_bioavailability
    source: "Multiple reviews and Zhang et al. (Steroids, 2016)"
    active_compound: "Protodioscin (dominant furostanol saponin; primary pharmacologically active compound)"
    key_findings:
      - "Protodioscin bioavailability: approximately 5.7% (low) in rat pharmacokinetic study (Zhang et al., Steroids 2016)"
      - "Contradictory findings: separate study from Dioscorea extract showed good bioavailability—formulation may matter"
      - "HPLC-ESI-MS/MS method in rat plasma developed for pharmacokinetic study"
      - "Very little known about pharmacokinetics of TT's therapeutically active compounds (per Štefănescu 2020)"
    clinical_implications:
      - "Low oral bioavailability of protodioscin may explain need for higher clinical doses"
      - "Formulation matrix may significantly affect absorption"
    research_gap: "No pharmacokinetic data in humans; animal data only"

  - id: saponin_variability
    source: "Štefănescu et al. (Biomolecules, 2020); Zhu et al. (BMC Chemistry, 2017)"
    key_findings:
      - "Protodioscin concentration: 1–1530 mg/100g dry weight depending on geographic origin"
      - "Remarkable variations between samples from the same country"
      - "108 kinds of steroidal saponins isolated (58 spirostane + 50 furostane types)"
      - "Saponin composition influenced by: geographic origin, plant part, developmental stage"
      - "Furostanol saponins (including protodioscin) and spirostanol saponins are primary active compounds"
      - "Saponins possess membrane permeabilizing properties—may affect absorption of co-administered drugs"
    drug_interaction_mechanism: "CYP3A4 moderate inhibition (confirmed in Huff et al. 2024 case)"

