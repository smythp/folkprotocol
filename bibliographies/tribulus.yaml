systematic_reviews_meta_analyses:
  - id: suharyani_2025
    title: "Tribulus terrestris for management of patients with erectile dysfunction: a systematic review and meta-analysis of randomized trials"
    authors:
      - Suharyani S
      - Amanda B
      - Angellee J
      - William W
      - Hariyanto TI
      - I'tishom R
    year: 2025
    journal: International Journal of Impotence Research
    pmid: 40360723
    pubmed_link: https://pubmed.ncbi.nlm.nih.gov/40360723/
    doi: "10.1038/s41443-025-01086-7"
    study_type: Systematic review and meta-analysis of RCTs
    studies_reviewed: 8 RCTs
    key_findings:
      - "IIEF-5 improved from baseline: MD 4.21 (p < 0.00001)"
      - "IIEF-15 improved from baseline: MD 15.88 (p = 0.0004)"
      - "TT outperformed placebo on IIEF-5: MD 3.23"
      - "TT outperformed placebo on IIEF-15: MD 14.44"
      - "No significant difference in total testosterone levels vs placebo"
      - "No difference in adverse event incidence vs placebo"
    statistical_findings:
      iief5_vs_baseline_md: 4.21
      iief15_vs_baseline_md: 15.88
      iief5_vs_placebo_md: 3.23
      iief15_vs_placebo_md: 14.44
    safety: "Good tolerability; adverse event rate similar to placebo"

  - id: vilar_neto_2025
    title: "Effects of Tribulus (Tribulus terrestris L.) Supplementation on Erectile Dysfunction and Testosterone Levels in Men-A Systematic Review of Clinical Trials"
    authors:
      - Vilar Neto JO
      - Monteiro de Moraes WMA
      - Pinto DV
      - da Silva CA
      - Roriz Caminha JS
      - Chaves Nunes Filho JC
      - Gonçalves Reis CE
      - Prestes J
      - Santos HO
      - De Francesco Daher E
    year: 2025
    journal: Nutrients
    pmid: 40219032
    pubmed_link: https://pubmed.ncbi.nlm.nih.gov/40219032/
    pmc_link: https://pmc.ncbi.nlm.nih.gov/articles/PMC11990417/
    study_type: Systematic review of clinical trials
    studies_reviewed: 10 (9 clinical trials + 1 quasi-experimental)
    sample_size: 483 participants total; individual trials 15–172 participants
    dosing:
      range: "400–750 mg/day"
      duration: "1–3 months"
    key_findings:
      - "3 of 5 studies measuring erectile function showed improvements after supplementation"
      - "Only 2 of 10 studies showed meaningful testosterone increases (~60–70 ng/dL)"
      - "Testosterone increases occurred exclusively in hypogonadal subjects"
      - "8 of 10 studies reported no significant hormonal changes"
      - "50% of included studies had low methodological quality (Jadad score)"
      - "Low overall evidence quality; no robust evidence for testosterone increase in eugonadal men"
    populations: "Healthy males, oligozoospermia, erectile dysfunction, ED with hypogonadism, unexplained infertility"
    testosterone_finding_detail: "Modest elevations of 60–70 ng/dL in hypogonadal subjects only"

