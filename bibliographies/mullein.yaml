---
herb: Mullein
scientific_name: "Verbascum thapsus L."
common_names:
  - "Common mullein"
  - "Great mullein"
  - "Verbascum"
  - "Torchweed"
  - "Flannel leaf"
  - "Mullein flower (Verbasci flos)"
bibliography_type: clinical_and_regulatory
last_updated: 2026-02-28
notes_on_scope: >
  Mullein (Verbascum thapsus L.) is the primary species in commercial use, though
  V. densiflorum Bertol., V. thapsiforme Schrad., and V. phlomoides L. share similar
  constituent profiles and are often interchangeable in traditional preparations and
  regulatory monographs. The EMA herbal monograph covers all four species under "Verbasci flos."
  Clinical RCT evidence for mullein as a standalone intervention is extremely limited — the
  one wound-healing RCT used a topical V. thapsus cream; the two ear-pain RCTs used
  multi-herb formulations in which mullein was one of four to six components. Most
  clinical evidence is therefore indirect (combination products) or preclinical (in vitro,
  animal, genotoxicity). No pharmacokinetic/bioavailability human studies for standardized
  mullein extracts were identified. This bibliography captures the full available evidence
  hierarchy with explicit labeling of study type and applicability.

# ─── Regulatory Monographs ───────────────────────────────────────────────────

regulatory_monographs:
  - citation:
      organization: "European Medicines Agency (EMA) — Committee on Herbal Medicinal Products (HMPC)"
      title: "European Union herbal monograph on Verbascum thapsus L., V. densiflorum Bertol.,
              V. thapsiforme Schrad. and V. phlomoides L., flos"
      reference: "EMA/HMPC/611537/2016"
      year_adopted: 2018
      date: "22 June 2018"
      url: "https://www.ema.europa.eu/en/medicines/herbal/verbasci-flos"
    monograph_details:
      approval_type: "Traditional use (Article 16d Directive 2001/83/EC)"
      basis: "At least 30 years documented traditional use, minimum 15 years within EU; no clinical trial requirement"
      approved_indication: >
        Relief of sore throat associated with dry cough and cold
      age_restriction: "Adults and adolescents ≥ 12 years"
      authorized_preparations:
        - "Herbal tea (infusion): 1.5–2 g dried flower per 150 mL boiling water, steep 10–15 min; 3–4 times daily"
        - "Tincture (1:5 in 25% ethanol): 15–40 mL per day in divided doses"
      safety_summary: >
        No adverse effects reported at therapeutic doses as of assessment date.
        Treatment should not exceed 1 week without medical supervision. If symptoms
        worsen or persist, consult a healthcare professional. Not recommended in
        children < 12 years due to lack of data.
      contraindications: "Known hypersensitivity to Verbascum species or Scrophulariaceae"
      notes: >
        Periodic safety review call for data issued through June 2024; monograph revision
        underway as of early 2026.

  - citation:
      organization: "European Food Safety Authority (EFSA) — Panel on Additives and Products or Substances used in Animal Feed (FEEDAP)"
      title: "Safety of a feed additive consisting of a tincture derived from Verbascum thapsus L. (great mullein tincture) for use in all animal species (MANGHEBATI SAS)"
      journal: "EFSA Journal"
      year: 2021
      volume: "19(7)"
      article_number: "e06711"
      pmid: "34335922"
      pmcid: "PMC8317052"
      doi: "10.2903/j.efsa.2021.6711"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8317052/"
    monograph_details:
      document_type: "Scientific opinion / regulatory safety assessment"
      scope: "Animal feed additive; tincture derived from V. thapsus"
      key_safety_findings:
        - "Tincture safe at maximum 50 mg/kg complete feed for short-lived fattening animals"
        - "Maximum 600 mg/kg for horses"
        - "No conclusions possible for long-lived animals due to genotoxic concerns (aucubin aglycone)"
        - "Aucubin content in tincture: 0.004% average; aglycone can bind DNA and inhibit replication/transcription enzymes"
        - "No consumer safety concerns at approved use levels for food-producing species"
      notes: >
        Provides the most detailed toxicological characterization of V. thapsus tincture
        available in the literature; genotoxic concern is specific to the aglycone liberated
        from aucubin — relevant to long-term, high-dose animal exposure and warrants
        caution extrapolating to chronic human use at higher doses.

# ─── Randomized Controlled Trials ───────────────────────────────────────────

randomized_controlled_trials:
  - citation:
      authors: "Taleb S, Saeedi M"
      title: "The effect of the Verbascum Thapsus on episiotomy wound healing in nulliparous women: a randomized controlled trial"
      journal: "BMC Complementary Medicine and Therapies"
      year: 2021
      pmid: "34103042"
      pmcid: "PMC8186151"
      doi: "10.1186/s12906-021-03315-4"
      url: "https://pubmed.ncbi.nlm.nih.gov/34103042/"
    study_details:
      design: "Randomized, double-blind, placebo-controlled trial"
      population: "93 primiparous women with episiotomy wounds (nulliparous obstetric patients)"
      intervention: "Topical cream containing Verbascum thapsus extract applied to episiotomy wound; 2 cm of cream twice daily for 10 days"
      comparator: "Matched placebo cream"
      primary_outcome: "REEDA scale score (Redness, Edema, Ecchymosis, Discharge, Approximation) — wound healing composite"
      registration: "IRCT201404073106N15 (registered 02/12/2015)"
      key_findings:
        - "No statistically significant difference between groups at days 1 and 3 post-intervention"
        - "At day 10: mean REEDA scores significantly better in Verbascum group vs. placebo (p = 0.01)"
        - "Suggests delayed but meaningful wound-healing benefit with topical V. thapsus cream"
      applicability: >
        Standalone V. thapsus RCT; topical route only; wound-healing endpoint.
        Not generalizable to oral respiratory/cough indications typical of traditional use.

  - citation:
      authors: "Sarrell EM, Mandelberg A, Cohen HA"
      title: "Efficacy of naturopathic extracts in the management of ear pain associated with acute otitis media"
      journal: "Archives of Pediatrics & Adolescent Medicine"
      year: 2001
      volume: "155(7)"
      pages: "796-799"
      pmid: "11434846"
      url: "https://pubmed.ncbi.nlm.nih.gov/11434846/"
    study_details:
      design: "Randomized controlled trial"
      population: "103 children aged 6–18 years with ear pain and clinical diagnosis of acute otitis media"
      intervention: >
        Naturopathic herbal extract ear drops (Otikon Otic Solution) containing
        Allium sativum, Verbascum thapsus, Calendula flores, and Hypericum perforatum in olive oil
      comparator: "Anaesthetic ear drops (amethocaine, phenazone, glycerine)"
      primary_outcome: "Ear pain score (visual analog scale, linear and color-based), measured over 3 days"
      key_findings:
        - "Both groups showed statistically significant improvement in ear pain (p = 0.007)"
        - "Naturopathic extract group performed at least as well as anaesthetic drops"
        - "Study authors note ~80% of pain was self-limited (would have resolved without treatment)"
      limitations:
        - "Mullein is one of four active herbal components; individual contribution of V. thapsus cannot be isolated"
        - "No placebo-only arm; cannot distinguish herbal effect from self-limitation"
        - "Pain measurement subjective; 3-day follow-up only"
      applicability: >
        Combination product RCT — mullein contribution to outcome is indeterminate.
        Provides indirect clinical support for traditional ear/respiratory use.

  - citation:
      authors: "Sarrell EM, Cohen HA, Kahan E"
      title: "Naturopathic treatment for ear pain in children"
      journal: "Pediatrics"
      year: 2003
      volume: "111(5 Pt 1)"
      pages: "e574-9"
      pmid: "12728112"
      url: "https://pubmed.ncbi.nlm.nih.gov/12728112/"
    study_details:
      design: "Double-blind randomized controlled trial"
      population: "171 children aged 5–18 years with ear pain"
      intervention: >
        Naturopathic herbal extract ear drops (NHED) containing Allium sativum,
        Verbascum thapsus, Calendula flores, Hypericum perforatum, lavender, and
        vitamin E in olive oil; 5 drops three times daily
      comparator: "Topical anesthetic alone; amoxicillin ± topical anesthetic; combinations"
      dosing_detail: "5 drops instilled in affected ear, 3× daily"
      primary_outcome: "Ear pain reduction over 3 days"
      key_findings:
        - "All groups showed significant pain improvement over 3 days"
        - "NHED performed better than control in pain reduction"
        - "80% of pain was self-limited and would resolve without treatment"
        - "Most effective combination (NHED + topical anesthetic) explained only 7.3% of total pain reduction"
        - "Antibiotic treatment (amoxicillin) was not contributory to pain outcomes"
      limitations:
        - "Mullein is one of six botanical components; individual contribution indeterminate"
        - "High self-limitation rate limits ability to detect true treatment effect"
      applicability: >
        Larger follow-up to 2001 Sarrell trial. Same limitation: mullein is embedded
        in a multi-herb formula. Modest dosing detail available (5 drops TID).

# ─── Systematic Reviews and Narrative Reviews ────────────────────────────────

systematic_reviews_and_reviews:
  - citation:
      authors: "Gupta A, Atkinson AN, Pandey AK, Bishayee A"
      title: "Health-promoting and disease-mitigating potential of Verbascum thapsus L. (common mullein): A review"
      journal: "Phytotherapy Research"
      year: 2022
      volume: "36(4)"
      pages: "1507-1522"
      pmid: "35088467"
      doi: "10.1002/ptr.7393"
      url: "https://pubmed.ncbi.nlm.nih.gov/35088467/"
    study_details:
      design: "Narrative review"
      scope: "Comprehensive review of phytochemistry, pharmacology, and therapeutic applications of V. thapsus"
      key_findings:
        - "Documented activities: antiviral, antioxidant, analgesic, sedative, anti-inflammatory, hypnotic, antibacterial, antifungal, anticancer"
        - "Key constituents: coumarin, hesperidin, flavonoids, iridoid glycosides (aucubin), phenylethanoid glycosides (verbascoside), saponins, vitamin C, minerals"
        - "Traditional applications include lung, skin, and throat disorders; astringent and expectorant use"
        - "Root extracts historically used for toothache, stiffness, and seizures"
        - "Calls for clinical translation of preclinical findings"
      notes: "Most current comprehensive review of V. thapsus as of publication; good entry point to primary literature"

  - citation:
      authors: "Turker AU, Gurel E"
      title: "Common mullein (Verbascum thapsus L.): recent advances in research"
      journal: "Phytotherapy Research"
      year: 2005
      volume: "19(9)"
      pages: "733-739"
      pmid: "16222647"
      doi: "10.1002/ptr.1653"
      url: "https://pubmed.ncbi.nlm.nih.gov/16222647/"
    study_details:
      design: "Narrative review"
      scope: "Summarizes ethnobotanical, phytochemical, and early pharmacological research on V. thapsus"
      key_findings:
        - "Traditional uses: pulmonary problems, inflammatory diseases, asthma, spasmodic coughs, diarrhoea, migraine headaches"
        - "Commercial availability by 2005: dried leaves and flowers, capsules, alcohol extracts, flower oil widely available in US health stores"
        - "Documents tissue culture and bioassay research up to that date"
      notes: "Foundational review; precedes the wave of more systematic phytochemical studies post-2010"

  - citation:
      authors: "Blanco-Salas J, Hortigón-Vinagre MP, Morales-Jadán D, Ruiz-Téllez T"
      title: "Searching for Scientific Explanations for the Uses of Spanish Folk Medicine: A Review on the Case of Mullein (Verbascum, Scrophulariaceae)"
      journal: "Biology (Basel)"
      year: 2021
      pmid: "34356473"
      pmcid: "PMC8301161"
      doi: "10.3390/biology10080706"
      url: "https://pubmed.ncbi.nlm.nih.gov/34356473/"
    study_details:
      design: "Review with in silico molecular analysis"
      scope: "10 Verbascum species documented in Spain's Traditional Knowledge inventory; in silico evaluation of phytochemicals against inflammatory targets"
      key_findings:
        - "Most traditional mullein uses can be explained by anti-inflammatory action of compounds such as quercetin"
        - "Traditional indications include respiratory diseases, otitis, arthrosis, and rheumatism — all inflammatory conditions"
        - "In silico molecular docking supports proposed mechanisms for folk medicine applications"
      notes: "Bridges ethnobotany and mechanistic pharmacology; primarily preclinical/in silico evidence"

# ─── Key In Vitro and Preclinical Studies ────────────────────────────────────

preclinical_studies:
  - citation:
      authors: "Calabrese G, Zappalà A, Dolcimascolo A, Acquaviva R, Parenti R, Malfa GA"
      title: "Phytochemical Analysis and Anti-Inflammatory and Anti-Osteoarthritic Bioactive Potential of Verbascum thapsus L. (Scrophulariaceae) Leaf Extract Evaluated in Two In Vitro Models of Inflammation and Osteoarthritis"
      journal: "Molecules"
      year: 2021
      pmid: "34500824"
      pmcid: "PMC8434610"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8434610/"
    study_details:
      design: "In vitro experimental research"
      models: "RAW 264.7 murine macrophages (inflammation model); IL-1β-stimulated human chondrocytes (osteoarthritis model)"
      phytochemical_profile:
        total_phenolic_content: "124.0 ± 0.7 mg gallic acid equivalent (GAE)/g extract"
        primary_compounds: "Verbascoside 254.8 mg/mL, iso-verbascoside 142.9 mg/mL, forsythoside B 108.1 mg/mL, martynoside 118.4 mg/mL, echinacoside 42.1 mg/mL, samioside 52.3 mg/mL"
        method: "HPLC-DAD"
      key_findings:
        - "At 50 and 100 µg/mL, extract significantly reduced nitric oxide (NO•) levels in LPS-stimulated macrophages after 6 days"
        - "V. thapsus demonstrated superior NO• reduction vs. Harpagophytum procumbens (devil's claw) positive control at 50 µg/mL"
        - "In chondrocytes at 100 µg/mL for 6 days: significant inhibition of IL-6, COX-2, and iNOS vs. control"
        - "Matrix metalloproteases MMP-1, MMP-8, and MMP-9 expression significantly reduced"
      applicability: "In vitro only; provides mechanistic data supporting anti-inflammatory and potential anti-arthritic uses"

  - citation:
      authors: "Grigore A, Colceru-Mihul S, Litescu S, Panteli M, Rasit I"
      title: "Correlation between polyphenol content and anti-inflammatory activity of Verbascum phlomoides (mullein)"
      journal: "Pharmaceutical Biology"
      year: 2013
      volume: "51(7)"
      pages: "925-929"
      pmid: "23627472"
      doi: "10.3109/13880209.2013.767361"
      url: "https://pubmed.ncbi.nlm.nih.gov/23627472/"
    study_details:
      design: "Combined in vitro and in vivo experimental study"
      species: "Verbascum phlomoides (related mullein species with similar constituent profile)"
      key_findings:
        polyphenol_content:
          total_polyphenols: "4.18% expressed as gallic acid"
          rosmarinic_acid: "14.93 mg/g"
          caffeic_acid: "39.96 mg/g"
          ferulic_acid: "29.61 mg/g"
          quercetin: "17.29 mg/g"
        anti_inflammatory:
          - "Significantly inhibited TNF-α-induced ICAM-1 expression by 55–58.8% in human endothelial cells at higher concentrations"
          - "Failed to reduce egg-white-induced rat paw edema in vivo"
        conclusion: "Strong antioxidant activity; modest anti-inflammatory activity in vivo; suggests complex multi-component mechanism"

  - citation:
      authors: "Mahdavi S, Amiradalat M, Babashpour M, Sheikhlooei H, Miransari M"
      title: "The Antioxidant, Anticarcinogenic and Antimicrobial Properties of Verbascum thapsus L"
      journal: "Medicinal Chemistry"
      year: 2020
      pmid: "31456524"
      url: "https://pubmed.ncbi.nlm.nih.gov/31456524/"
    study_details:
      design: "In vitro experimental research"
      key_findings:
        antioxidant:
          - "50 mg/L ethanolic extract: 21.26% inhibition of DPPH free radicals"
          - "300 mg/L ethanolic extract: ~91.31% inhibition of DPPH free radicals (near-maximal, dose-dependent)"
        antimicrobial:
          - "Gram-positive strains (e.g., Bacillus cereus) more sensitive to V. thapsus extract than Gram-negative strains"
          - "Gram-negative strains showed greater tolerance"
        anticarcinogenic_compounds:
          - "GC-MS identified 1-hexanol (2.11%) and 2-hexene (1.95%) in ethanolic extract as potential anticarcinogenic components"

  - citation:
      authors: "Turker AU, Camper ND"
      title: "Biological activity of common mullein, a medicinal plant"
      journal: "Journal of Ethnopharmacology"
      year: 2002
      volume: "82(2-3)"
      pages: "117-125"
      pmid: "12241986"
      doi: "10.1016/S0378-8741(02)00186-1"
      url: "https://pubmed.ncbi.nlm.nih.gov/12241986/"
    study_details:
      design: "In vitro bioassay research"
      extracts_tested: "Water, ethanol, and methanol extracts; also commercial mullein products"
      key_findings:
        antibacterial:
          - "Water extracts inhibited Klebsiella pneumoniae, Staphylococcus aureus, Staphylococcus epidermidis, and Escherichia coli"
        antitumor:
          - "All extract types inhibited Agrobacterium tumefaciens-induced tumors in potato disc tissue assay"
        toxicity:
          - "Higher concentrations produced adverse effects on brine shrimp and radish seed germination and development"

  - citation:
      authors: "Zgórniak-Nowosielska I, Grzybek J, Manolova N, Serkedjieva J, Zawilińska B"
      title: "Antiviral activity of Flos verbasci infusion against influenza and Herpes simplex viruses"
      journal: "Archives of Immunology and Therapeutic Experimentation (Warszawa)"
      year: 1991
      pmid: "1666504"
      url: "https://pubmed.ncbi.nlm.nih.gov/1666504/"
    study_details:
      design: "In vitro antiviral research"
      preparation: "Lyophilized flower infusion of Verbascum thapsiforme (equivalent species)"
      key_findings:
        influenza:
          - "Virus titers decreased by 1–3 log units against multiple influenza A strains and influenza B"
        herpes_simplex:
          - "Titers reduced by 2.3 log units"
          - "At 300 µg/mL: direct virucidal inactivation of HSV; did not directly inactivate influenza viruses"
        constituents_identified: "Flavonoids, iridoids, phenolic acids, saponins, amino acids, free sugars"
      notes: >
        Foundational antiviral study; methodology limited by era but values are consistent
        with subsequent phytochemical and in silico analyses of mullein's antiviral constituents.

# ─── Safety and Genotoxicity Studies ─────────────────────────────────────────

safety_studies:
  - citation:
      authors: "Escobar FM, Sabini MC, Zanon SM, Cariddi LN, Tonn CE, Sabini LI"
      title: "Genotoxic evaluation of a methanolic extract of Verbascum thapsus using micronucleus test in mouse bone marrow"
      journal: "Natural Products Communications"
      year: 2011
      pmid: "21834240"
      url: "https://pubmed.ncbi.nlm.nih.gov/21834240/"
    study_details:
      design: "In vivo genotoxicity evaluation (murine micronucleus assay)"
      model: "Mouse bone marrow cells"
      doses_tested: ["100 mg/kg", "300 mg/kg", "500 mg/kg"]
      extract_type: "Methanolic extract of V. thapsus"
      key_findings:
        - "No genotoxic effects detected at any dose tested (100, 300, 500 mg/kg)"
        - "No toxicity in bone marrow detected in extract-treated groups"
        - "Did not produce significant increase in frequency of micronucleated polychromatic erythrocytes (MNPCE)"
        - "PCE/NCE ratios not significantly affected vs. controls"
        - "Authors conclude results 'provide security in its use as herbal medicine'"
      notes: >
        Important safety datum for methanolic extract. Contrast with EFSA 2021 finding
        regarding aucubin aglycone genotoxic potential in tincture — the methanolic
        extraction route and dose range may explain the discrepancy. Aqueous/traditional
        preparations likely carry lower genotoxic risk than concentrated ethanolic tinctures.

# ─── Standardized Extract and Constituent Notes ──────────────────────────────

extract_and_constituent_notes:
  marker_compounds:
    - name: "Verbascoside (acteoside)"
      class: "Phenylethanoid glycoside"
      typical_content_in_extract: "Predominant polyphenol; up to 254.8 mg/mL in leaf aqueous extract (Calabrese 2021)"
      pharmacological_role: "Anti-inflammatory (ICAM-1 inhibition, NO• reduction, COX-2 inhibition); antioxidant; antimicrobial"
    - name: "Aucubin"
      class: "Iridoid glycoside"
      pharmacological_role: "Anti-inflammatory; aglycone form has DNA-binding potential (EFSA 2021 concern)"
    - name: "Saponins"
      class: "Triterpenoid glycosides"
      pharmacological_role: "Expectorant (saponin-mediated mucociliary stimulation); antiviral membrane disruption"
    - name: "Hesperidin"
      class: "Flavanone glycoside"
      pharmacological_role: "Antioxidant; anti-inflammatory; antiviral (demonstrated in related Verbascum species)"
    - name: "Quercetin"
      class: "Flavonol"
      typical_content: "17.29 mg/g (Grigore 2013, V. phlomoides)"
      pharmacological_role: "Anti-inflammatory; antioxidant; in silico: COX/inflammatory pathway inhibition"

  preparation_and_dosing_context:
    traditional_oral_preparations:
      infusion_leaf_or_flower:
        dose_per_cup: "1–2 teaspoons (approx. 1.5–4 g) dried leaf or flower per 150–250 mL boiling water"
        steep_time: "10–15 minutes (strain carefully through fine cloth to remove leaf hairs)"
        frequency: "3–4 times per day"
        source: "EMA monograph and traditional pharmacopoeia convention"
      tincture:
        ratio: "1:5 in 25% ethanol"
        daily_dose_range: "15–40 mL per day in divided doses"
        source: "EMA monograph (Verbasci flos, 2018)"
      dried_herb_powder:
        dose: "1–3 g per dose, 2–3× daily (mixed with honey for palatability)"
    topical:
      wound_cream:
        dose: "2 cm of V. thapsus cream applied to wound twice daily × 10 days (Taleb & Saeedi 2021 RCT)"
      ear_drops:
        dose: "5 drops in affected ear, 3× daily (Sarrell 2003 RCT, multi-herb formulation)"

  bioavailability_notes: >
    No human pharmacokinetic or bioavailability studies for standardized V. thapsus extracts
    were identified as of 2026. Verbascoside undergoes significant reduction in antioxidant
    activity after simulated in vitro digestion (phenolic acids more stable than intact
    glycosides). Aucubin pharmacokinetics have been characterized in animal models (Zeng et al.,
    2020, cited in EFSA 2021 opinion) but no published human PK data found.

# ─── Evidence Gaps and Research Needs ────────────────────────────────────────

evidence_gaps:
  - "No standalone mullein RCTs for respiratory indications (cough, expectorant, bronchitis)"
  - "No pharmacokinetic/bioavailability studies in humans for any V. thapsus extract"
  - "No dose-ranging clinical studies establishing minimum effective or maximum tolerated human doses"
  - "No standardized extract defined for commercial oral preparations (unlike, e.g., Echinacea or Ginkgo)"
  - "Long-term safety data absent; EFSA genotoxicity concern for aucubin aglycone warrants investigation in high-dose chronic use scenarios"
  - "All positive respiratory-use evidence is traditional/ethnobotanical or preclinical; mechanism is plausible but clinically unvalidated"
